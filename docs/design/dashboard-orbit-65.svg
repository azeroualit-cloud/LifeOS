">17:30</text><text x="163" y="735" font-size="19" fill="#eee" font-weight="600">Allenamento</text><text x="163" y="759" font-size="13" fill="#a2aab5" font-weight="400">Palestra · 1 ora</text><text x="72" y="795" font-size="15" fill="#b0b8c2" font-weight="400">20:00</text><text x="163" y="794" font-size="19" fill="#eee" font-weight="600">Cena con amici</text><text x="163" y="818" font-size="13" fill="#a2aab5" font-weight="400">Centro</text><text x="163" y="858" font-size="14" fill="#c5cbd3" font-weight="400">Vedi la settimana  →</text><text x="72" y="900" font-size="17" fill="#eee" font-weight="600">Abitudini di oggi</text><text x="377" y="900" font-size="12" fill="#a2aab5" font-weight="400">Gestisci</text><rect x="72" y="920" width="179" height="44" rx="22" fill="#1e2228" stroke="none"/><circle cx="95" cy="942" r="9" fill="#ccd2db"/><text x="113" y="947" font-size="15" fill="#a7afb9" font-weight="400">Leggere</text><rect x="261" y="920" width="183" height="44" rx="22" fill="#1e2228" stroke="none"/><circle cx="284" cy="942" r="9" fill="#858f9e"/><circle cx="284" cy="942" r="7" fill="#1e2228"/><text x="302" y="947" font-size="15" fill="#eee" font-weight="400">Camminare</text><rect x="66" y="978" width="384" height="69" rx="34" fill="#24282f" stroke="none"/><rect x="74" y="985" width="93" height="55" rx="27" fill="#414750" stroke="none"/><rect x="112" y="994" width="8" height="8" rx="2" fill="#e7ebef" stroke="none"/><rect x="112" y="1005" width="8" height="8" rx="2" fill="#e7ebef" stroke="none"/><rect x="123" y="994" width="8" height="8" rx="2" fill="#e7ebef" stroke="none"/><rect x="123" y="1005" width="8" height="8" rx="2" fill="#e7ebef" stroke="none"/><text x="86" y="1032" font-size="10" fill="#d4dbe5" font-weight="400">Dashboard</text><circle cx="209" cy="998" r="2" fill="#d4dbe5"/><line x1="215" y1="998" x2="226" y2="998" stroke="#d4dbe5" stroke-dasharray=""/><circle cx="209" cy="1005" r="2" fill="#d4dbe5"/><line x1="215" y1="1005" x2="226" y2="1005" stroke="#d4dbe5" stroke-dasharray=""/><circle cx="209" cy="1012" r="2" fill="#d4dbe5"/><line x1="215" y1="1012" x2="226" y2="1012" stroke="#d4dbe5" stroke-dasharray=""/><text x="191" y="1032" font-size="10" fill="#d4dbe5" font-weight="400">Attività</text><rect x="301" y="994" width="22" height="20" rx="3" fill="none" stroke="#d4dbe5"/><line x1="303" y1="1000" x2="321" y2="1000" stroke="#d4dbe5" stroke-dasharray=""/><text x="280" y="1032" font-size="10" fill="#d4dbe5" font-weight="400">Calendario</text><rect x="398" y="1004" width="5" height="11" rx="1" fill="#d4dbe5" stroke="none"/><rect x="406" y="997" width="5" height="18" rx="1" fill="#d4dbe5" stroke="none"/><rect x="414" y="990" width="5" height="25" rx="1" fill="#d4dbe5" stroke="none"/><text x="385" y="1032" font-size="10" fill="#d4dbe5" font-weight="400">Finanza</text><text x="528" y="169" font-size="24" fill="#eee" font-weight="600">Tre priorità, un solo linguaggio</text><circle cx="548" cy="225" r="20" fill="#282d35"/><text x="537" y="230" font-size="12" fill="#c9d0da" font-weight="400">01</text><text x="586" y="229" font-size="19" fill="#eee" font-weight="600">Una vista delle 24 ore</text><text x="586" y="259" font-size="15" fill="#a4acb7" font-weight="400">Arco del turno e tacche degli impegni.</text><text x="586" y="282" font-size="15" fill="#a4acb7" font-weight="400">Il centro mostra il tempo residuo.</text><circle cx="548" cy="335" r="20" fill="#282d35"/><text x="537" y="340" font-size="12" fill="#c9d0da" font-weight="400">02</text><text x="586" y="339" font-size="19" fill="#eee" font-weight="600">Una timeline leggibile</text><text x="586" y="369" font-size="15" fill="#a4acb7" font-weight="400">Ore, titoli e luoghi hanno ruoli distinti.</text><text x="586" y="392" font-size="15" fill="#a4acb7" font-weight="400">Tocca un impegno per aprire i suoi dettagli.</text><circle cx="548" cy="445" r="20" fill="#282d35"/><text x="537" y="450" font-size="12" fill="#c9d0da" font-weight="400">03</text><text x="586" y="449" font-size="19" fill="#eee" font-weight="600">Contenuti pertinenti</text><text x="586" y="479" font-size="15" fill="#a4acb7" font-weight="400">Solo le abitudini previste oggi.</text><text x="586" y="502" font-size="15" fill="#a4acb7" font-weight="400">Calendario e dati salute restano accessibili.</text><text x="528" y="578" font-size="20" fill="#eee" font-weight="600">Il widget Oggi riprende la stessa gerarchia</text><rect x="528" y="610" width="688" height="232" rx="26" fill="#20242b" stroke="none"/><text x="552" y="645" font-size="12" fill="#b6becb" font-weight="400">MER 28 · LIFE OS</text><rect x="552" y="664" width="44" height="44" rx="13" fill="#6196c6" stroke="none"/><text x="564" y="694" font-size="23" fill="#101113" font-weight="700">M</text><text x="612" y="686" font-size="24" fill="#eee" font-weight="600">Mattina</text><text x="612" y="713" font-size="15" fill="#b6becb" font-weight="400">06:00–14:00</text><text x="1077" y="686" font-size="23" fill="#eee" font-weight="400">20 min</text><text x="1076" y="713" font-size="13" fill="#b6becb" font-weight="400">alla fine</text><line x1="552" y1="738" x2="1192" y2="738" stroke="#454c57" stroke-dasharray=""/><text x="552" y="781" font-size="18" fill="#b6becb" font-weight="400">17:30</text><text x="637" y="781" font-size="21" fill="#eee" font-weight="600">Allenamento</text><text x="637" y="811" font-size="14" fill="#a4acb7" font-weight="400">Palestra</text><text x="528" y="891" font-size="12" fill="#a4acb7" font-weight="400">DA APPROVARE PRIMA DELLO SVILUPPO</text><text x="528" y="925" font-size="15" fill="#c1c8d1" font-weight="400">Dashboard: vista della giornata, non nuova logica dei dati.</text><text x="528" y="954" font-size="15" fill="#c1c8d1" font-weight="400">Widget: dati condivisi, aggiornamenti e firma da verificare.</text><text x="528" y="983" font-size="15" fill="#c1c8d1" font-weight="400">Finanza e Salute restano alternative per una fase successiva.</text><text x="48" y="1120" font-size="15" fill="#aab3bf" font-weight="400">Anello informativo, azioni sulle righe native. Nessuna rotazione continua o gesture in conflitto con lo scroll.</text></svg>