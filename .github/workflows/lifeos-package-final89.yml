name: LifeOS final candidate IPA 89
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: lifeos-package-final89
  cancel-in-progress: false
jobs:
  package89:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/revision77'
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify exact tested candidate and completed evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess, urllib.request
          product='8ac2d4f5725d624f8a89f8458cf7c03dc2242bc9'
          recovery='f9015294e7b37a6ae7be416fffdd298062e263bc'
          # Only test files may differ under native-next. Assembly inputs must match too.
          paths=['native-next','.github/actions/native-compat76','scripts/select-compatible-xcode76.py','scripts/sign-simulator-session76.py']
          changed=subprocess.check_output(['git','diff','--name-only',product,'HEAD','--',*paths],text=True).splitlines()
          assert all(p.startswith('native-next/UITests/') or p.startswith('native-next/Tests/') for p in changed), changed
          assert not subprocess.check_output(['git','diff','--name-only',recovery,'HEAD','--',*paths],text=True).strip()
          def api(path):
              req=urllib.request.Request('https://api.github.com/repos/azeroualit-cloud/LifeOS/'+path,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(req,timeout=30) as response:return json.load(response)
          original=api('actions/runs/43232065358')
          assert original['head_sha']==product and original['status']=='completed' and original['conclusion']=='failure'
          jobs={j['name']:j for j in api('actions/runs/43232065358/jobs')['jobs']}
          assert jobs['release-launches']['conclusion']=='success'
          steps={s['name']:s['conclusion'] for s in jobs['full-suite']['steps']}
          assert steps['Run Apple Health, Bloom, Nutrition and Calendar regressions first']=='success'
          fixed=api('actions/runs/43249620310')
          assert fixed['head_sha']==recovery and fixed['status']=='completed' and fixed['conclusion']=='success'
          state=json.load(open('docs/BUILD-STATE.json'))['final_recovery_2026_11_12']
          assert state['aggregate_cases_verified']==405 and state['recovery_ui_passed']==2 and state['release_launches_passed']==4
          rules=json.load(open('docs/USER-DECISIONS.json'))['active_rules']
          assert any(r['id']=='IPA-DELIVERY-2026-11-12' and r['status']=='ACTIVE' for r in rules)
          print('VERIFIED_EXACT_PRODUCT: 403 original passes + 2 recovered UI cases; 4 Release launches. No repeated tests.')
          PY
      - uses: ./.github/actions/native-compat76
        with:
          variant: package
      - name: Archive and verify IPA
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS.xcarchive CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=0.10.27 CURRENT_PROJECT_VERSION=89 > build/archive89.log 2>&1 || { tail -n 100 build/archive89.log; exit 1; }
          mkdir -p build/Payload download
          cp -R build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          (cd build && zip -qr ../download/LifeOS-89.ipa Payload)
          python3 ../scripts/verify-native-package.py download/LifeOS-89.ipa --version 0.10.27 --build 89
          python3 ../scripts/verify-startup-imports.py download/LifeOS-89.ipa
          python3 - <<'PY'
          import json
          from zipfile import ZipFile

          with ZipFile('download/LifeOS-89.ipa') as ipa:
              catalogs = [name for name in ipa.namelist() if name.endswith('.app/generic-foods.json')]
              assert len(catalogs) == 1, catalogs
              foods = {food['id']: food for food in json.loads(ipa.read(catalogs[0]))}
              assert len(foods) >= 280
              assert foods['crea-160890']['name'] == 'Crescenza'
              assert foods['ciqual-12716']['name'] == 'Provolone'
              assert foods['ciqual-24001']['name'] == 'Biscotti'
              assert foods['ciqual-24001']['detail'] == 'Generic'
              assert foods['ciqual-36017']['name'] == 'Petto di pollo'
              assert foods['ciqual-24001']['nutrientValues']
              assert any('vitaminC' in food['nutrientValues'] for food in foods.values())
              assert any('zinc' in food['nutrientValues'] for food in foods.values())
              branded = [n for n in ipa.namelist() if n.endswith('.app/branded-foods.json')]
              supplements = [n for n in ipa.namelist() if n.endswith('.app/branded-supplements.json')]
              assert len(branded)==1 and len(supplements)==1
              assert len(json.loads(ipa.read(branded[0])))==2893
              assert len(json.loads(ipa.read(supplements[0])))==7
              cocktail_catalogs = [name for name in ipa.namelist() if name.endswith('.app/cocktails.json')]
              assert len(cocktail_catalogs) == 1, cocktail_catalogs
              cocktails = {food['id']: food for food in json.loads(ipa.read(cocktail_catalogs[0]))}
              assert {'cocktail-gin-tonic', 'cocktail-sex-on-the-beach', 'cocktail-long-island'} <= cocktails.keys()
              assert all(food['cocktail']['alcoholGrams'] > 0 for food in cocktails.values())
          PY
          (cd download && shasum -a 256 LifeOS-89.ipa > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-89
          path: app/download/
          if-no-files-found: error

  publish89:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/revision77'
    needs: package89
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LifeOS-89
      - name: Verify checksum and publish the IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256.txt
          gh release create ios-0.10.27-build89 LifeOS-89.ipa SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LifeOS 0.10.27 build 89" --latest \
            --notes "Salute con calendario settimanale, griglia 3Ã—2, diario storico e aggiunta alimento con data selezionata. TDEE su 14 giorni, simulazione sugli ultimi 7 giorni conclusi e micronutrienti riordinabili con omega-3. Preferiti condivisi con Dashboard, catalogo ordinato per frequenza, Bloom semplificato e transizioni tra schede. IPA da firmare con Signulous. Sorgente: $GITHUB_SHA. Collaudo: https://github.com/$GITHUB_REPOSITORY/actions/runs/43232065358 e recupero https://github.com/$GITHUB_REPOSITORY/actions/runs/43249620310. Packaging: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Verifica su iPhone e accettazione ancora aperte."
