name: Life OS - Link diretto IPA build 53
on:
  push:
    paths: ['.github/workflows/lifeos-ipa-link.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  publish:
    # First push registers the workflow without running this job. Only the first
    # explicit dispatch can publish; later pushes, dispatches and reruns skip it.
    if: github.event_name == 'workflow_dispatch' && github.run_number == 2 && github.run_attempt == 1
    permissions:
      actions: read
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica IPA verificata
        uses: actions/download-artifact@v5
        with:
          name: LifeOS-IPA-per-Signulous
          run-id: 40115963503
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ipa
      - name: Controlla e prepara file diretto
        run: |
          python3 - <<'PY'
          import pathlib, hashlib, zipfile, shutil
          files = list(pathlib.Path('ipa').rglob('*.ipa'))
          assert len(files) == 1
          expected = 'f03526c498984242c0bc80266324ac467299ef15202d4265c6f73fafec315897'
          assert hashlib.sha256(files[0].read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(files[0]) as archive:
              assert archive.testzip() is None
          shutil.copyfile(files[0], 'LifeOS-build53.ipa')
          pathlib.Path('SHA256.txt').write_text(expected + '  LifeOS-build53.ipa\n')
          PY
      - name: Pubblica IPA per firma tramite link
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view native-0.9.0-build53-unified >/dev/null 2>&1; then exit 0; fi
          gh release create native-0.9.0-build53-unified LifeOS-build53.ipa SHA256.txt --target eb3c04b27c356ae70eebd4d044745e081f4284c8 --title 'Life OS unificato — 0.9.0 build 53' --notes 'IPA unsigned per Signulous. Attività, abitudini, eventi, salvataggi locali, notifiche locali, Siri e widget rapidi. Verificati 98 test unitari, 26 UI e 12 compatti. Siri/widget da collaudare dopo firma; sincronizzazione peso da attivare lato server.' --latest=false
