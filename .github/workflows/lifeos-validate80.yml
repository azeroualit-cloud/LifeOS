name: LifeOS pre-IPA validation
on:
  workflow_dispatch:
  push:
    branches: ['codex/revision77']
    paths: ['.github/workflows/lifeos-validate80.yml']
permissions:
  contents: read
jobs:
  full-suite:
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/native-compat76
        with:
          variant: primary
      - name: Compile app and full test suite
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/final-compile.log 2>&1 || { tail -n 100 build/final-compile.log; exit 1; }
      - name: Verify redesigned Health controls at standard and large text sizes
        working-directory: app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          xcodebuild test-without-building -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests/NativeRevision78UITests/testSafeAreaLastContentStandard -only-testing:LifeOSProbeUITests/NativeRevision78UITests/testSafeAreaLastContentLargeText CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/health-layout.log 2>&1 || { grep -E 'error:|Test Case .*failed' build/health-layout.log || true; tail -n 80 build/health-layout.log; exit 1; }
      - name: Run all unit and UI tests
        working-directory: app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          xcodebuild test-without-building -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 660 -resultBundlePath build/Final.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/final-tests.log 2>&1 || { tail -n 120 build/final-tests.log; exit 1; }
      - name: Collect lightweight test diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          mkdir -p app/build/final-diagnostics
          diag=app/build/final-diagnostics
          result=app/build/Final.xcresult
          printf 'Commit: %s\nRun: %s attempt %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$diag/context.txt"
          if [ -f app/build/final-tests.log ]; then
            cp app/build/final-tests.log "$diag/final-tests.log"
            # Preserve every matching line; the complete log remains available for context.
            grep -E 'error:|Test Case .*failed|Executed [0-9]+ tests?, with [0-9]+ failures?' app/build/final-tests.log > "$diag/failures-and-counts.txt" || true
          else
            printf 'Test log unavailable: the test step may not have started.\n' > "$diag/failures-and-counts.txt"
          fi
          if [ -f "$result/Info.plist" ]; then
            for kind in summary tests; do
              if xcrun xcresulttool get test-results "$kind" --path "$result" > "$diag/$kind.json.tmp" 2> "$diag/$kind-error.txt"; then
                mv "$diag/$kind.json.tmp" "$diag/$kind.json"
                rm "$diag/$kind-error.txt"
              else
                rm -f "$diag/$kind.json.tmp"
                printf '%s extraction failed; see %s-error.txt.\n' "$kind" "$kind" >> "$diag/context.txt"
              fi
            done
          else
            printf 'Result bundle unavailable or incomplete; structured extraction not attempted.\n' >> "$diag/context.txt"
          fi
          {
            printf '## LifeOS final test diagnostics\n\n'
            printf 'Commit: `%s` · Run: `%s`, attempt `%s`\n\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
            printf 'Lightweight artifact: `lifeos-final-diagnostics-%s-%s`.\n\n' "$GITHUB_SHA" "$GITHUB_RUN_ATTEMPT"
            printf 'First 100 failure/count lines (complete list and log in artifact):\n\n```text\n'
            head -n 100 "$diag/failures-and-counts.txt"
            printf '\n```\n\n'
            cat "$diag/context.txt"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload lightweight test diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: lifeos-final-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          if-no-files-found: warn
          path: app/build/final-diagnostics
      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: |
          if [ -f app/build/Final.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path app/build/Final.xcresult --output-path app/build/final-screenshots
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lifeos-final-validation-${{ github.sha }}
          path: |
            app/build/final-*.log
            app/build/Final.xcresult
            app/build/final-screenshots

  release-launches:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/native-compat76
        with:
          variant: primary
      - name: Compile app and synthetic session test
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/final-compile.log 2>&1 || { tail -n 100 build/final-compile.log; exit 1; }
      - name: Create isolated simulators for Release startup checks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,subprocess
          test_device=os.environ['MAIN_DEVICE']
          subprocess.run(['xcrun','simctl','shutdown',test_device],check=True,timeout=120)
          runtime=os.environ['COMPAT_RUNTIME']
          device_type='com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro'
          runtime_id='com.apple.CoreSimulator.SimRuntime.iOS-'+runtime.replace('.','-')
          available=json.loads(subprocess.check_output(['xcrun','simctl','list','runtimes','-j']))['runtimes']
          assert any(r['identifier']==runtime_id and r.get('isAvailable') for r in available),f'Compatible simulator runtime unavailable: {runtime_id}'
          fresh_device=subprocess.check_output(['xcrun','simctl','create','LifeOS final fresh startup',device_type,runtime_id],text=True).strip()
          fixture_device=subprocess.check_output(['xcrun','simctl','create','LifeOS final fixture startup',device_type,runtime_id],text=True).strip()
          assert fresh_device and fixture_device and len({test_device,fresh_device,fixture_device})==3
          for device in (fresh_device,fixture_device):
              subprocess.run(['xcrun','simctl','boot',device],check=True)
              subprocess.run(['xcrun','simctl','bootstatus',device,'-b'],check=True)
          with open(os.environ['GITHUB_ENV'],'a') as env:
              env.write('FINAL_VALIDATION_TEST_DEVICE='+test_device+'\n')
              env.write('MAIN_DEVICE='+fixture_device+'\n')
              env.write('FRESH_DEVICE='+fresh_device+'\n')
          print('FINAL_STARTUP_SIMULATORS fresh='+fresh_device,'fixture='+fixture_device,'TYPE',device_type,'RUNTIME',runtime_id)
          PY
      - name: Prepare synthetic saved session
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild test-without-building -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeTests/NativeSessionVaultTests/testPrepareSyntheticSavedSessionForReleaseStartup -resultBundlePath build/FinalSession.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/final-session.log 2>&1 || { tail -n 100 build/final-session.log; exit 1; }
      - name: Build Release and verify four launches
        working-directory: app
        env:
          LIFEOS_RELEASE_SESSION_FIXTURE: '1'
        run: |
          set -euo pipefail
          xcodebuild build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -derivedDataPath release-build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/final-release.log 2>&1 || { tail -n 100 build/final-release.log; exit 1; }
          echo 'Release build finished; starting four launch checks'
          python3 -u ../scripts/verify-release-launch75.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifeos-final-release-launches
          path: |
            app/build/final-*.log
            app/build/FinalSession.xcresult
            app/release-launch
  package84:
    if: >-
      github.repository == 'azeroualit-cloud/LifeOS' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/revision77' &&
      contains(github.event.head_commit.message, '[release-ipa-84]')
    needs: [full-suite, release-launches]
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/native-compat76
        with:
          variant: package
      - name: Archive and verify IPA
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS.xcarchive CODE_SIGNING_ALLOWED=NO MARKETING_VERSION=0.10.22 CURRENT_PROJECT_VERSION=84 > build/archive84.log 2>&1 || { tail -n 100 build/archive84.log; exit 1; }
          mkdir -p build/Payload download
          cp -R build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          (cd build && zip -qr ../download/LifeOS-84.ipa Payload)
          python3 ../scripts/verify-native-package.py download/LifeOS-84.ipa --version 0.10.22 --build 84
          python3 ../scripts/verify-startup-imports.py download/LifeOS-84.ipa
          python3 - <<'PY'
          import json
          from zipfile import ZipFile

          with ZipFile('download/LifeOS-84.ipa') as ipa:
              catalogs = [name for name in ipa.namelist() if name.endswith('.app/generic-foods.json')]
              assert len(catalogs) == 1, catalogs
              foods = {food['id']: food for food in json.loads(ipa.read(catalogs[0]))}
              assert foods['ciqual-24001']['name'] == 'Biscotti'
              assert foods['ciqual-24001']['detail'] == 'Generic'
              assert foods['ciqual-36017']['name'] == 'Petto di pollo'
          PY
          (cd download && shasum -a 256 LifeOS-84.ipa > SHA256.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-84
          path: app/download/
          if-no-files-found: error

  publish84:
    if: >-
      github.repository == 'azeroualit-cloud/LifeOS' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/codex/revision77' &&
      contains(github.event.head_commit.message, '[release-ipa-84]')
    needs: package84
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: LifeOS-84
      - name: Verify checksum and publish the IPA
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          sha256sum --check SHA256.txt
          gh release create ios-0.10.22-build84 LifeOS-84.ipa SHA256.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "LifeOS 0.10.22 build 84" --latest \
            --notes "Calendario di Nutrizione a tutta larghezza con i valori della bozza conservati. IPA da firmare con Signulous. Sorgente: $GITHUB_SHA. Collaudo pre-IPA: https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Verifica su iPhone e accettazione ancora aperte."
