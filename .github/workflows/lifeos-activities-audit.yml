name: Life OS - Audit attività 68 senza scritture
on:
  push:
    paths: ['.github/workflows/lifeos-activities-audit.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifica migrazioni compatibili sul codice live, senza distribuire
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: |
          python3 - <<'PY'
          import importlib.util,pathlib
          def load(name,path):
              spec=importlib.util.spec_from_file_location(name,path)
              m=importlib.util.module_from_spec(spec);spec.loader.exec_module(m);return m
          current=load('activities','scripts/deploy-activities-68.py')
          def inspect(source,patches):
              import re,json
              statements=[]
              for literal in re.findall(r'"((?:[^"\\]|\\.)*)"',source):
                  if literal.startswith(('CREATE TABLE','ALTER TABLE','SELECT','DELETE FROM','UPDATE')) and any(table in literal for table in ['os_tasks','os_events','os_event_repeat']):
                      statements.append(literal)
              print('ACTIVITY_SCHEMA_CONTEXT '+json.dumps({'fields':{key:key in source for key in ['scheduled_time','section_status','activityEvents']},'sql':statements},ensure_ascii=True))
              return source
          current.base.transform=inspect
          current.base.main()
          PY
