name: LifeOS savings destination 91 deploy (authorized BACKEND-DEPLOY-SAVINGS-2026-11-16)
on:
  push:
    branches: ['codex/deploy-savings91']
    paths: ['.github/workflows/lifeos-savings-deploy91.yml']
permissions:
  contents: read
concurrency:
  group: lifeos-utility-code-deployment
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify the exact synthetic implementation
        env:
          LIFEOS_UTILITY_WORKER: manual/build-75/worker.js
          LIFEOS_ROUTING_WORKER: manual/build-75/worker.js
          LIFEOS_ACTIVITY_WORKER: manual/build-75/worker.js
        run: |
          set -euo pipefail
          python3 scripts/build-worker-68.py
          python3 scripts/build-worker-70.py
          python3 scripts/build-worker-75.py
          python3 backend/utilities/tests/test_transform.py
          python3 backend/expense-routing/tests/test_savings_transform.py
          node backend/utilities/tests/competence.test.mjs
          node backend/utilities/tests/budget.test.mjs
          node backend/utilities/tests/routing.test.mjs
          node backend/expense-routing/tests/routing.test.mjs
          node backend/activities/tests/worker.test.mjs
      - name: Deploy the savings destination with live verification and automatic rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-savings-91.py
