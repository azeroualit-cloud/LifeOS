name: Life OS - Controllo pubblico e chiusura aggiornamento 61
on:
  push:
    branches: ['codex/backend-source-audit-61']
    paths: ['.github/workflows/lifeos-public-health-61.yml']
permissions:
  contents: read
jobs:
  health:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.event.before == 'c8aefb31bc0666800fe0505314e8b4920494d60e'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - name: Verifica solo pagine pubbliche senza credenziali
        run: python3 scripts/check-lifeos-public-health-61.py
