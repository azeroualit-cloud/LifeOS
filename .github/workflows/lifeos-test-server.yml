name: Life OS - Collega copia di test
on:
  workflow_dispatch:
  push:
    paths: ['scripts/provision-lifeos-test.py', '.github/workflows/lifeos-test-server.yml']
permissions:
  contents: read
concurrency:
  group: lifeos-test-server
  cancel-in-progress: false
jobs:
  prepare:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verifica isolamento
        run: python3 -m unittest discover -s scripts -p 'test_provision.py' -v
      - name: Prepara copia isolata e verifica le API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_TEST_PASSWORD: ${{ secrets.LIFEOS_TEST_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: '1728c3b1b852eb6285646842db7256de'
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: python3 scripts/provision-lifeos-test.py
