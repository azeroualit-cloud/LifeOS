name: Life OS - Verifica IPA
on:
  push:
    paths: ['.github/workflows/lifeos-artifact-check.yml']
permissions:
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Scarica l'unica IPA dalla build verificata
        uses: actions/download-artifact@v5
        with:
          name: LifeOS-IPA-per-Signulous
          run-id: 40115963503
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: ipa
      - name: Scarica i risultati dei test della stessa build
        uses: actions/download-artifact@v5
        with:
          name: LifeOS-diagnostica
          run-id: 40115963503
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: diagnostics
      - name: Verifica test, checksum, widget e architetture
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, plistlib, re, zipfile
          root = pathlib.Path('ipa')
          files = list(root.rglob('*.ipa'))
          assert len(files) == 1, 'Serve una sola IPA'
          checksums = list(root.rglob('SHA256.txt'))
          assert len(checksums) == 1
          expected = checksums[0].read_text().split()[0]
          digest = hashlib.sha256(files[0].read_bytes()).hexdigest()
          assert digest == expected, 'Checksum IPA non corrispondente'
          with zipfile.ZipFile(files[0]) as archive:
              assert archive.testzip() is None, 'Archivio IPA danneggiato'
              app = 'Payload/LifeOSProbe.app/'
              info = plistlib.loads(archive.read(app + 'Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.nas.lifeos.probe'
              assert str(info['CFBundleVersion']) == '53'
              assert info['CFBundleShortVersionString'] == '0.9.0'
              assert info['CFBundleDevelopmentRegion'] == 'it'
              assert any('lifeos' in row.get('CFBundleURLSchemes', []) for row in info['CFBundleURLTypes'])
              assert any(name.startswith(app + 'Metadata.appintents/') for name in archive.namelist())
              widget = app + 'PlugIns/LifeOSWidget.appex/'
              extension = plistlib.loads(archive.read(widget + 'Info.plist'))
              assert str(extension['CFBundleVersion']) == '53'
              assert extension['NSExtension']['NSExtensionPointIdentifier'] == 'com.apple.widgetkit-extension'
              for folder, metadata in [(app, info), (widget, extension)]:
                  binary = archive.read(folder + metadata['CFBundleExecutable'])
                  assert binary[:4] == bytes.fromhex('cffaedfe'), 'Eseguibile Mach-O 64 bit atteso'
                  assert int.from_bytes(binary[4:8], 'little') == 0x0100000c, 'Architettura arm64 attesa'
          required = {'unit-tests.log': 98, 'tests.log': 26, 'compact.log': 12, 'health-tests.log': 2, 'focused-tests.log': 1}
          for name, count in required.items():
              logs = list(pathlib.Path('diagnostics').rglob(name))
              assert len(logs) == 1, 'Manca un solo log: ' + name
              outcomes = re.findall(r'Executed (\d+) tests?, with (\d+) failures?', logs[0].read_text(errors='replace'))
              assert outcomes and tuple(map(int, outcomes[-1])) == (count, 0), 'Risultato test non valido: ' + name
          archives = list(pathlib.Path('diagnostics').rglob('archive.log'))
          assert len(archives) == 1 and '** ARCHIVE SUCCEEDED **' in archives[0].read_text(errors='replace')
          print('IPA_VERIFIED: version=0.9.0 build=53 app=arm64 widget=arm64 locale=it')
          print('TESTS_VERIFIED: unit=98 UI=26 compact=12 health=2 finance=1 failures=0')
          print('SHA256=' + digest)
          print('::notice title=Life OS build 53::IPA e test verificati; SHA256=' + digest)
          PY

