name: Life OS - IPA verificata
on:
  workflow_dispatch:
    inputs:
      delivery_run:
        description: Consegna diretta della build 58 già archiviata e verificata
        type: string
        default: ''
  push:
    branches: ['feature/plans-v2']
    paths: ['.github/workflows/lifeos-ipa.yml']
permissions:
  contents: read
concurrency:
  group: lifeos-ipa-${{ github.ref }}
  cancel-in-progress: false
jobs:
  ipa:
    if: (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[build ipa]')) && inputs.delivery_run == ''
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26
        run: |
          python3 - <<'PY'
          import pathlib,re,os
          choices=[]
          for p in pathlib.Path('/Applications').glob('Xcode_*.app'):
            m=re.fullmatch(r'Xcode_([0-9.]+).app',p.name)
            if m and int(m[1].split('.')[0])>=26: choices.append((tuple(map(int,m[1].split('.'))),p))
          assert choices
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DEVELOPER_DIR='+str(max(choices)[1]/'Contents/Developer')+'\n')
          PY
      - name: Unpack verified source
        run: |
          python3 - <<'PY'
          import hashlib,pathlib,zipfile
          p=pathlib.Path('lifeos-native.zip')
          assert hashlib.sha256(p.read_bytes()).hexdigest()=='f2a586c34e40088583f2ca79a00b76eaaa6f23880344753452e8540cc42e6cf1'
          with zipfile.ZipFile(p) as z:
            assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
            z.extractall('app')
          PY
          python3 app/scripts/check-design-system.py
          brew install xcodegen
          cd app
          xcodegen generate
      - name: Archive iPhone build 58
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS.xcarchive MARKETING_VERSION=0.9.7 CURRENT_PROJECT_VERSION=58 CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
      - name: Verify and package unsigned IPA for Signulous
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p build/Payload download
          cp -R build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          cp LifeOS.entitlements download/LifeOS.entitlements
          python3 - <<'PY'
          import pathlib,plistlib,hashlib,json,subprocess
          app=pathlib.Path('build/Payload/LifeOSProbe.app')
          info=plistlib.loads((app/'Info.plist').read_bytes())
          assert info['CFBundleShortVersionString']=='0.9.7'
          assert info['CFBundleVersion']=='58'
          assert info['CFBundleIdentifier']=='com.nas.lifeos.probe'
          assert info['CFBundleSupportedPlatforms']==['iPhoneOS']
          assert info.get('NSHealthShareUsageDescription') and info.get('NSHealthUpdateUsageDescription')
          assert plistlib.loads(pathlib.Path('LifeOS.entitlements').read_bytes())['com.apple.developer.healthkit'] is True
          assert any('lifeos' in item.get('CFBundleURLSchemes',[]) for item in info.get('CFBundleURLTypes',[]))
          executable=app/info['CFBundleExecutable']
          assert 'arm64' in subprocess.check_output(['lipo','-archs',str(executable)],text=True)
          assert 'IOSSIMULATOR' not in subprocess.check_output(['vtool','-show-build',str(executable)],text=True)
          binary=executable.read_bytes()
          markers=['plan-record-payment','plan-payment-confirm','plan-link-movement-','X-LifeOS-Plans-Version','Giorni della settimana']
          for marker in markers: assert marker.encode() in binary,marker
          metadata={'version':'0.9.7','build':'58','bundle_id':info['CFBundleIdentifier'],'platform':'iPhoneOS','architecture':'arm64','signing':'unsigned; sign with Signulous','source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'source_zip_sha256':hashlib.sha256(pathlib.Path('../lifeos-native.zip').read_bytes()).hexdigest(),'plans_binary_markers':markers,'habits_ui_verification':'NativeInterfaceTests/testHabitIntervalAndWeekdaySchedulingPersistInManagement; binary string search is not an accessibility-identifier test'}
          pathlib.Path('download/BUILD-INFO.json').write_text(json.dumps(metadata,indent=2)+'\n')
          PY
          cd build
          zip -qr ../download/LifeOS-0.9.7-build58-unsigned.ipa Payload
          cd ../download
          shasum -a 256 LifeOS-0.9.7-build58-unsigned.ipa > SHA256.txt
          python3 - <<'PY'
          import zipfile,plistlib
          with zipfile.ZipFile('LifeOS-0.9.7-build58-unsigned.ipa') as z:
            assert z.testzip() is None
            info=plistlib.loads(z.read('Payload/LifeOSProbe.app/Info.plist'))
            assert info['CFBundleVersion']=='58'
          print('IPA_VERIFIED: Life OS 0.9.7 build 58, iPhoneOS arm64, Piani v2')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: LifeOS-0.9.7-build58-per-Signulous
          path: app/download/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: LifeOS-build58-diagnostic
          path: app/build/archive.log
          retention-days: 7
  deliver:
    if: inputs.delivery_run == '39606915520'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require successful matching app, Worker and archive checks
        run: |
          set -euo pipefail
          for run in 39606909804 39606844897 39606915520; do
            for attempt in $(seq 1 60); do
              gh api "repos/$GH_REPO/actions/runs/$run" > run.json
              status=$(python3 -c "import json; r=json.load(open('run.json')); assert r['head_sha']=='ff5a07424f6b97f5494f024b7abed1081397c186'; print(r['status'])")
              if [ "$status" = completed ]; then
                python3 -c "import json; assert json.load(open('run.json'))['conclusion']=='success'"
                break
              fi
              test "$attempt" -lt 60
              sleep 15
            done
          done
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: 39606915520
          name: LifeOS-0.9.7-build58-per-Signulous
          path: delivery
      - name: Verify exact unsigned iPhone IPA before publishing the requested direct download
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,plistlib,zipfile
          folder=Path('delivery');ipa=folder/'LifeOS-0.9.7-build58-unsigned.ipa'
          metadata=json.loads((folder/'BUILD-INFO.json').read_text())
          assert metadata['source_commit']=='ff5a07424f6b97f5494f024b7abed1081397c186'
          assert metadata['source_zip_sha256']=='f2a586c34e40088583f2ca79a00b76eaaa6f23880344753452e8540cc42e6cf1'
          assert hashlib.sha256(ipa.read_bytes()).hexdigest()==(folder/'SHA256.txt').read_text().split()[0]
          with zipfile.ZipFile(ipa) as z:
            assert z.testzip() is None
            info=plistlib.loads(z.read('Payload/LifeOSProbe.app/Info.plist'))
            assert (info['CFBundleShortVersionString'],info['CFBundleVersion'])==('0.9.7','58')
            assert info['CFBundleIdentifier']=='com.nas.lifeos.probe' and info['CFBundleSupportedPlatforms']==['iPhoneOS']
            assert not any(n.endswith(('.p12','.mobileprovision','.env')) for n in z.namelist())
            binary=z.read('Payload/LifeOSProbe.app/'+info['CFBundleExecutable'])
            assert binary[:4]==bytes.fromhex('cffaedfe') and int.from_bytes(binary[4:8],'little')==0x0100000c
            for marker in ['plan-payment-delete','getFinanceCategoryPeriod','movement-manage-plan-payment']:assert marker.encode() in binary
          Path('RELEASE-NOTES.md').write_text('IPA non firmata per Signulous. Spese normali semplificate; eliminazione dei pagamenti collegati anche da piani interrotti; Analisi 3/6/12 mesi con lettura dedicata e messaggi di errore leggibili.\n\nWorker corrispondente: https://raw.githubusercontent.com/azeroualit-cloud/LifeOS/ff5a07424f6b97f5494f024b7abed1081397c186/worker.js\n')
          print('IPA_SOURCE_AND_BINARY_VERIFIED',hashlib.sha256(ipa.read_bytes()).hexdigest())
          PY
      - name: Publish the requested direct IPA download
        run: |
          gh release create v0.9.7-build58 delivery/LifeOS-0.9.7-build58-unsigned.ipa delivery/BUILD-INFO.json delivery/SHA256.txt --target ff5a07424f6b97f5494f024b7abed1081397c186 --title 'Life OS 0.9.7 build 58' --notes-file RELEASE-NOTES.md
