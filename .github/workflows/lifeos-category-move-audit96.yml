name: LifeOS category move audit (read-only)
# 26/11/2026: «ho provato a premere Sposta in x - Sposta e nulla è stato spostato». Did the moves reach the
# movements, and which category does each one show? Only SELECT; logs category labels and counts, no movement
# names, dates or amounts. About 3 scans of the movements table (~10k rows of the daily D1 budget).
# Attempt 4: route anchors per module for the plan rename. Attempt 3: after CATEGORY-TOOLS-96. Attempt 2: the D1 query API answers 403 to this token; check the live Worker code instead (fragment counts only)
on:
  push:
    branches: ['codex/build93']
    paths: ['.github/workflows/lifeos-category-move-audit96.yml']
permissions:
  contents: read
jobs:
  audit:
    if: github.repository == 'azeroualit-cloud/LifeOS'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Manual categories and what they resolve to
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          ACCOUNT = '1728c3b1b852eb6285646842db7256de'; DATABASE = 'a90a8c6d-d6eb-4dc6-8fdb-382e4ad4485a'
          def q(sql):
              assert sql.lstrip().upper().startswith('SELECT')
              r = urllib.request.Request('https://api.cloudflare.com/client/v4/accounts/' + ACCOUNT + '/d1/database/' + DATABASE + '/query',
                  data=json.dumps({'sql': sql}).encode(), headers={'Authorization': 'Bearer ' + os.environ['CLOUDFLARE_API_TOKEN'].strip(), 'Content-Type': 'application/json'}, method='POST')
              with urllib.request.urlopen(r, timeout=60) as resp: return json.loads(resp.read())['result'][0]['results']
          J = "FROM movements m LEFT JOIN movement_financial_categories c ON c.movement_source_row=m.source_row"
          for key, sql in [
              ('manual_by_category', "SELECT COALESCE(m.category,'') category, COALESCE(c.detail_category,'(non risolta)') shown, COUNT(*) n " + J + " WHERE instr(COALESCE(m.notes,''),'[Categoria manuale]')>0 GROUP BY 1,2 ORDER BY n DESC LIMIT 60"),
              ('manual_shown_differently', "SELECT COUNT(*) n " + J + " WHERE instr(COALESCE(m.notes,''),'[Categoria manuale]')>0 AND COALESCE(c.detail_category,'')<>COALESCE(m.category,'')"),
              ('stale_resolution', "SELECT COUNT(*) n " + J + " WHERE c.movement_source_row IS NULL OR COALESCE(c.source_category,'')<>COALESCE(m.category,'')"),
              ('shown_categories', "SELECT COALESCE(c.detail_category,NULLIF(m.category,''),'Altro') shown, COUNT(*) n " + J + " GROUP BY 1 ORDER BY n DESC LIMIT 80"),
              ('saved_list', "SELECT modified, length(doc) size, doc FROM web_settings WHERE key='finance-categories'"),
          ]:
              try: out = q(sql)
              except urllib.error.HTTPError as e: out = 'ERR HTTP %s' % e.code
              except Exception as e: out = 'ERR ' + type(e).__name__
              print('==', key); print(json.dumps(out, ensure_ascii=False))
          PY
      - uses: actions/checkout@v5
      - name: Live Worker code for the category move (counts only)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/audit-category-move-96.py
