name: LifeOS plan rename 96 (audit, deploy)
# RENAME-EVERYWHERE-2026-11-26: renameFinancePlan on both Workers (DEPLOY-WORKERS-93), legacy recurring plans keep
# their original name for matching. Starts from the live modules; nothing is written unless every fragment is found
# exactly once; upload verified with rollback. A push that changes this file is the deliberate start.
# Attempt 1
on:
  push:
    branches: ['codex/build93']
    paths: ['.github/workflows/lifeos-plan-rename96.yml']
concurrency:
  group: lifeos-site-deploy93
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.ref == 'refs/heads/codex/build93'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check both live Workers (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-plan-rename-96.py
      - name: Deploy to both Workers with verification and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-plan-rename-96.py
