name: Debug candidate 90 spindumps
on:
  push:
    branches: [codex/revision77]
    paths: [.github/workflows/debug-spindump.yml]
env:
  RUN_ID: "43722940589"
permissions:
  actions: read
  contents: read
jobs:
  spindumps:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download validation artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name | startswith("lifeos-candidate90-validation")) | .name' | head -1)
          gh run download "$RUN_ID" -R "${{ github.repository }}" -n "$name" -D art
      - name: Print the app main-thread stacks from every spindump
        run: |
          set -u
          sudo apt-get install -y zstd >/dev/null
          mkdir -p out
          for f in art/*.xcresult/Data/data.*; do
            if head -c 4 "$f" | od -An -tx1 | grep -q "28 b5 2f fd"; then zstd -dqc "$f" > out/tmp 2>/dev/null || continue; else cp "$f" out/tmp; fi
            if grep -q "^Process: *LifeOSProbe \[" out/tmp 2>/dev/null; then
              echo "=================== $(basename "$f" | cut -c1-40) ($(dirname "$f" | cut -d/ -f2))"
              awk '/^Process: *LifeOSProbe \[/{p=1} p&&/^Process:/&&!/LifeOSProbe \[/{exit} p' out/tmp > out/app.txt || true
              awk '/^Thread .*main-thread/{m=1;next} /^Thread /{m=0} m' out/app.txt \
                | sed -E 's/^ *([0-9]+) +(.*) \(([A-Za-z.]+) \+ [0-9]+\).*/\1|\3|\2/' \
                | grep -E 'Layout|Lazy|Scroll|Inset|Preference|Geometry|onChange|Animat|Transaction|Safe|Frame|Hosting|Navigation|Toolbar|Bar|Accessib|LifeOSProbe' \
                | awk -F'|' '{ if (!($3 in best) || $1+0 > best[$3]+0) best[$3]=$1"|"$2 } END { for (k in best) print best[k]"|"k }' \
                | sort -t'|' -k1,1nr | cut -c1-200 | head -70 || true
            fi
          done
