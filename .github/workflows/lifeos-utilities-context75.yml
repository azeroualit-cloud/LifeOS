name: LifeOS live utility compatibility audit
on:
  push:
    branches: ['codex/revision77']
    paths: ['scripts/deploy-utilities-75.py', 'backend/utilities/competence.mjs', '.github/workflows/lifeos-utilities-context75.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Rebuild known code baseline
        run: |
          python3 scripts/build-worker-68.py
          python3 scripts/build-worker-70.py
          python3 backend/utilities/tests/test_transform.py
      - name: Verify guarded patch against active code without querying financial records
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-utilities-75.py
