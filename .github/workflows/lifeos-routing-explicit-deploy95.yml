name: LifeOS site expense destination 95 (audit, deploy)
# EXPENSE-ROUTING-EXPLICIT-2026-11-25: the site form never preselects a goal or fund for a new expense.
# Deploy authorized by the user on 25/11/2026 («Sì, correggi il sito»), limited to this patch.
# A push that changes this file is the deliberate start. Both Workers; if the three page fragments are not
# found exactly once, nothing is written. Upload verified, rollback on failure.
# Attempt 3 (attempt 2: the source map also matched; skipped now). Attempt 2: the page can sit in another module or as plain text in the app Worker (attempt 1: p1=p2=p3=0 there; nothing written)
on:
  push:
    branches: ['codex/build93']
    paths: ['.github/workflows/lifeos-routing-explicit-deploy95.yml']
permissions:
  contents: read
concurrency:
  group: lifeos-utility-code-deployment
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.ref == 'refs/heads/codex/build93'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check both live Workers (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-routing-explicit-95.py
      - name: Deploy to both Workers with verification and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-routing-explicit-95.py
