name: LifeOS salary movements 97 (audit, deploy)
# SALARY-FROM-MOVEMENTS-97: salary history also from Stipendio movements for months without a payslip, on both Workers
# (DEPLOY-WORKERS-93). Live modules, anchors exactly once, verified upload with rollback. A push changing this file starts it.
# Attempt 2: the site Worker has a stale copy of the module; patch only the one the entry imports.
on:
  push:
    branches: ['codex/build93']
    paths: ['.github/workflows/lifeos-salary-movements97.yml']
concurrency:
  group: lifeos-site-deploy93
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.ref == 'refs/heads/codex/build93'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check both live Workers (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-salary-movements-97.py
      - name: Deploy to both Workers with verification and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-salary-movements-97.py
