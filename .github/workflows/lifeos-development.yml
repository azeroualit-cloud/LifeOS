name: LifeOS development preview and focused checks
on:
  push:
    branches: ['codex/**']
    paths: ['native-next/**', '.github/workflows/lifeos-development.yml', 'scripts/select-development-tests.py', '.github/actions/native-compat76/**', 'scripts/select-compatible-xcode76.py', 'scripts/sign-simulator-session76.py']
  workflow_dispatch:
    inputs:
      mode:
        description: Preview, focused regression, or trial checks
        type: choice
        options: [preview, focused, trial, nutrition-render, calendar-render, health-render, health-detail-render, health-reference, shift-render, catalog-review, catalog-fixes, catalog-last, final-recovery, tdee-review, catalog-navigation, catalog-recovery, catalog-expansion]
        default: preview
      package_trial:
        description: Explicitly request an unsigned trial IPA in Actions artifacts (trial mode only)
        type: boolean
        default: false
      area:
        description: Shared changes require all; auto expands unknown paths
        type: choice
        options: [auto, all, dashboard, nutrition, health, bloom, finance, activities, calendar, shifts]
        default: all
      device:
        description: Screen size
        type: choice
        options: [primary, compact]
        default: primary
permissions:
  contents: read
concurrency:
  group: lifeos-development-${{ github.ref }}-${{ inputs.mode || (contains(github.event.head_commit.message, '[release-ipa-') && 'release-preview-skipped') || 'preview' }}
  cancel-in-progress: true
jobs:
  preview:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[release-ipa-')
    runs-on: macos-15
    timeout-minutes: ${{ inputs.mode == 'trial' && 150 || 35 }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: ./.github/actions/native-compat76
        with:
          variant: ${{ inputs.device || 'primary' }}
      - name: Select bounded checks
        env:
          MODE: ${{ inputs.mode || (contains(github.event.head_commit.message, '[nutrition-render]') && 'nutrition-render') || (contains(github.event.head_commit.message, '[calendar-render]') && 'calendar-render') || (contains(github.event.head_commit.message, '[health-render]') && 'health-render') || (contains(github.event.head_commit.message, '[health-detail-render]') && 'health-detail-render') || (contains(github.event.head_commit.message, '[health-reference]') && 'health-reference') || (contains(github.event.head_commit.message, '[shift-render]') && 'shift-render') || (contains(github.event.head_commit.message, '[catalog-review]') && 'catalog-review') || (contains(github.event.head_commit.message, '[catalog-fixes]') && 'catalog-fixes') || (contains(github.event.head_commit.message, '[catalog-last]') && 'catalog-last') || 'preview' }}
          AREA: ${{ inputs.area || 'auto' }}
          BASE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$MODE" = trial ]; then
            BASE="$(python3 -c 'import json; print(json.load(open("docs/BUILD-STATE.json"))["latest_distributed_build"]["source_commit"])')"
          fi
          python3 scripts/select-development-tests.py --mode "$MODE" --area "$AREA" --base "$BASE"
      - name: Compile once
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/development-build.log 2>&1 || { tail -n 100 build/development-build.log; exit 1; }
      - name: Run selected checks and capture real screens
        working-directory: app
        env:
          CHECK_AREA: ${{ inputs.area || 'auto' }}
          RECORD_REVIEW: ${{ inputs.mode == 'health-render' || contains(github.event.head_commit.message, '[health-render]') }}
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          if [ "$CHECK_AREA" = nutrition ] || [ "$RECORD_REVIEW" = true ]; then
            xcrun simctl io "$MAIN_DEVICE" recordVideo --codec=h264 build/nutrition-simulator.mp4 > build/nutrition-recording.log 2>&1 &
            VIDEO_PID=$!
            trap 'kill -INT "$VIDEO_PID" 2>/dev/null || true; wait "$VIDEO_PID" 2>/dev/null || true' EXIT
          fi
          args=()
          while IFS= read -r arg; do args+=("$arg"); done < build/development-selection.args
          xcodebuild test-without-building -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 660 "${args[@]}" -resultBundlePath build/Development.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/development-tests.log 2>&1 || { tail -n 120 build/development-tests.log; exit 1; }
      - name: Collect focused failure lines
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          mkdir -p app/build/focused-diagnostics
          if [ -f app/build/development-tests.log ]; then
            grep -E 'error:|Test Case .*failed|Executed [0-9]+ tests?, with [0-9]+ failures?' app/build/development-tests.log > app/build/focused-diagnostics/failures-and-counts.txt || true
            cat app/build/focused-diagnostics/failures-and-counts.txt
          fi
          if [ -f app/build/Development.xcresult/Info.plist ]; then
            xcrun xcresulttool get test-results summary --path app/build/Development.xcresult > app/build/focused-diagnostics/summary.json || true
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lifeos-development-diagnostics-${{ github.sha }}
          path: app/build/focused-diagnostics
          retention-days: 7
      - name: Verify a fresh Release launch
        if: inputs.mode == 'trial'
        working-directory: app
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$MAIN_DEVICE"
          xcrun simctl erase "$MAIN_DEVICE"
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          xcodebuild build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -derivedDataPath release-build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/development-release.log 2>&1 || { tail -n 100 build/development-release.log; exit 1; }
          python3 -u ../scripts/verify-release-launch75.py --fresh-only
      - name: Archive and verify the explicitly requested trial IPA
        if: github.repository == 'azeroualit-cloud/LifeOS' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/revision77' && inputs.mode == 'trial' && inputs.package_trial
        working-directory: app
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version=$(python3 -c 'import re; from pathlib import Path; print(re.search(r"MARKETING_VERSION: .([0-9.]+).", Path("project.yml").read_text())[1])')
          build=$(python3 -c 'import re; from pathlib import Path; print(re.search(r"CURRENT_PROJECT_VERSION: .([0-9]+).", Path("project.yml").read_text())[1])')
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/Trial.xcarchive CODE_SIGNING_ALLOWED=NO > build/development-archive.log 2>&1 || { tail -n 100 build/development-archive.log; exit 1; }
          mkdir -p build/Payload trial-download
          cp -R build/Trial.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          (cd build && zip -qr ../trial-download/LifeOS-Trial.ipa Payload)
          python3 ../scripts/verify-native-package.py trial-download/LifeOS-Trial.ipa --version "$version" --build "$build"
          python3 ../scripts/verify-startup-imports.py trial-download/LifeOS-Trial.ipa
          (cd trial-download && shasum -a 256 LifeOS-Trial.ipa > SHA256.txt)
          cp build/development-selection.json trial-download/
          printf '%s\n' "$GITHUB_SHA" > trial-download/SOURCE.txt
      - uses: actions/upload-artifact@v4
        if: github.repository == 'azeroualit-cloud/LifeOS' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/codex/revision77' && inputs.mode == 'trial' && inputs.package_trial
        with:
          name: LifeOS-Trial-${{ github.sha }}
          path: app/trial-download/
          if-no-files-found: error
          retention-days: 7
      - name: Export screenshots even when tests fail
        if: ${{ !cancelled() }}
        run: |
          if [ -f app/build/Development.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path app/build/Development.xcresult --output-path app/build/development-screenshots
          fi
      - name: Record scope and limits
        if: ${{ !cancelled() }}
        env:
          CHECK_RESULT: ${{ job.status }}
        run: |
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          p=Path('app/build/development-selection.json')
          selection=json.loads(p.read_text()) if p.exists() else {'selection':'not reached'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('# LifeOS development evidence\nCommit: `'+os.environ['GITHUB_SHA']+'`\n\nStatus before export: '+os.environ['CHECK_RESULT']+'\n\n```json\n'+json.dumps(selection,indent=2)+'\n```\n\nScreenshots are simulator evidence, not production acceptance. A trial IPA, when explicitly requested, is an Actions artifact for device testing. Inspect screenshots and record visual findings before delivery.\n')
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lifeos-development-${{ inputs.mode || 'preview' }}-${{ github.sha }}
          retention-days: 7
          path: |
            app/build/development-*.log
            app/build/development-selection.*
            app/build/development-screenshots
            app/build/Development.xcresult
            app/release-launch
            app/build/nutrition-simulator.mp4
            app/build/nutrition-recording.log
