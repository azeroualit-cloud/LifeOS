name: Life OS - Distribuzione attività unificate
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/lifeos-activities-deploy.yml']
permissions:
  contents: read
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[deploy-activities-68]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifica attività, spese e selezione modulo
        run: |
          python3 scripts/build-worker-68.py
          python3 scripts/test_deploy_activities_68.py
          node backend/activities/tests/activities.test.mjs
          node backend/activities/tests/worker.test.mjs
          LIFEOS_ROUTING_WORKER=manual/build-68/worker.js node backend/expense-routing/tests/routing.test.mjs
      - name: Audit del contesto attuale senza scritture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-unified-activities.py
      - name: Aggiorna soltanto le attività nei due Worker condivisi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-unified-activities.py
      - name: Verifica contratto reale senza creare attività di prova
        env:
          LIFEOS_TEST_PASSWORD: ${{ secrets.LIFEOS_TEST_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os,json,datetime,http.cookiejar,urllib.request,urllib.error,uuid
          from zoneinfo import ZoneInfo
          origin='https://lifeos-native-test.a-zeroual-it.workers.dev'
          client=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def post(path,payload):
              request=urllib.request.Request(origin+path,data=json.dumps(payload).encode(),method='POST',headers={'Origin':origin,'Content-Type':'application/json'})
              with client.open(request,timeout=90) as response:return response.read()
          try:
              password=os.environ['LIFEOS_TEST_PASSWORD'];assert password
              post('/auth/login',{'user':'nas','password':password})
              month=datetime.datetime.now(ZoneInfo('Europe/Rome')).strftime('%Y-%m')
              snapshot=json.loads(post('/api/getLifeData',[month]))
              assert snapshot['capabilities']['unifiedActivities']==1
              assert all(isinstance(snapshot[k],list) for k in ['tasks','events','upcomingEvents'])
              try:
                  post('/api/saveActivity',[{'uid':'validation-probe','requestId':str(uuid.uuid4()),'source':'task','sourceId':0,'title':''}])
                  raise AssertionError('Il server ha accettato un titolo vuoto.')
              except urllib.error.HTTPError as response:
                  assert response.code==400
                  rejected=json.loads(response.read())
                  assert 'Attività non valida' in rejected.get('error','')
              print('UNIFIED_ACTIVITY_READ_AND_VALIDATION_CONTRACT_OK; no private data logged; no test activities created.')
          except Exception as error:
              raise SystemExit('Verifica API fallita: '+type(error).__name__)
          PY
