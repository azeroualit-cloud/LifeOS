name: Life OS - Distribuzione attività unificate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifica attività, spese e selezione modulo
        run: |
          python3 scripts/test_deploy_activities_68.py
          node backend/activities/tests/activities.test.mjs
          node backend/expense-routing/tests/routing.test.mjs
      - name: Audit del contesto attuale senza scritture
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-unified-activities.py
      - name: Aggiorna soltanto le attività nei due Worker condivisi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-unified-activities.py
