name: LifeOS 77 isolated validation
on:
  push:
    branches: ['codex/revision77']
    paths: ['native-next/**', '.github/workflows/lifeos-revision77.yml']
permissions:
  contents: read
concurrency:
  group: revision77-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: xcode-27
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/native-compat76
        with:
          variant: primary
      - name: Compile app and tests
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/compile77.log
      - name: Test on iPhone 15 Pro
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          xcodebuild test-without-building -derivedDataPath simulator-build -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeTests -only-testing:LifeOSProbeUITests/NativeRevision77UITests -resultBundlePath build/Revision77.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/revision77.log
      - name: Prepare verified saved session for Release startup
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild test-without-building -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeTests/NativeSessionVaultTests/testPrepareSyntheticSavedSessionForReleaseStartup -resultBundlePath build/SessionFixture77.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/session77.log
      - name: Verify four real Release launches with preserved session
        working-directory: app
        shell: bash
        env:
          LIFEOS_RELEASE_SESSION_FIXTURE: '1'
        run: |
          set -euo pipefail
          xcodebuild build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -derivedDataPath release-build CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee build/release77.log
          python3 ../scripts/verify-release-launch75.py
      - name: Export screenshots
        if: always()
        shell: bash
        run: |
          if [ -f app/build/Revision77.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path app/build/Revision77.xcresult --output-path app/build/screenshots77
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision77-iphone15pro
          path: |
            app/build/*.log
            app/release-launch
            app/build/Revision77.xcresult
            app/build/screenshots77

  package:
    needs: validate
    runs-on: xcode-27
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/native-compat76
        with:
          variant: package
      - name: Archive device app and verify exact IPA
        working-directory: app
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS77.xcarchive CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive77.log
          mkdir -p build/Payload download
          cp -R build/LifeOS77.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          cd build
          zip -qr ../download/LifeOS-77.ipa Payload
          cd ..
          python3 ../scripts/verify-native-package.py download/LifeOS-77.ipa --version 0.10.16 --build 77
          python3 ../scripts/verify-startup-imports.py download/LifeOS-77.ipa
          cd download
          shasum -a 256 LifeOS-77.ipa > SHA256.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision77-device-package
          path: |
            app/download
            app/build/archive77.log
            app/build/LifeOS77.xcarchive/dSYMs
