name: LifeOS 77 isolated validation
on:
  push:
    branches: ['codex/revision77']
    paths: ['native-next/**', '.github/workflows/lifeos-revision77.yml']
permissions:
  contents: read
concurrency:
  group: revision77-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: xcode-27
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/native-compat76
        with:
          variant: primary
      - name: Compile and test on iPhone 15 Pro
        working-directory: app
        shell: bash
        run: |
          set -o pipefail
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          xcodebuild test -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeTests -only-testing:LifeOSProbeUITests/NativeRevision77UITests -resultBundlePath build/Revision77.xcresult 2>&1 | tee build/revision77.log
      - name: Export screenshots
        if: always()
        shell: bash
        run: |
          if [ -f app/build/Revision77.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path app/build/Revision77.xcresult --output-path app/build/screenshots77
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: revision77-iphone15pro
          path: |
            app/build/revision77.log
            app/build/Revision77.xcresult
            app/build/screenshots77
