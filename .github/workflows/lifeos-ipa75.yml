name: Deliver requested verified IPA 75 only
on:
  push:
    paths: ['.github/workflows/lifeos-ipa75.yml']
permissions:
  contents: write
  actions: read
jobs:
  deliver:
    if: contains(github.event.head_commit.message, '[ipa-only-75]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v5
        with:
          name: LifeOS-75-validated-package
          run-id: 41592894317
          github-token: ${{ github.token }}
          path: validated75
      - name: Verify exact previously tested IPA and source; no rebuild or backend access
        run: |
          set -euo pipefail
          git diff --exit-code 14d40ef496bece1ae084ff50a4030471a5cb172d HEAD -- native-next backend web scripts/verify-native-package.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess,shutil,plistlib,zipfile
          found=list(Path('validated75').rglob('LifeOS-unsigned.ipa'))
          assert len(found)==1
          ipa=found[0]
          expected='94e64ccf0cc5a139208a05cb094a67241d6436305a9b4cd4e93b4737b05bf39d'
          assert hashlib.sha256(ipa.read_bytes()).hexdigest()==expected
          subprocess.run(['python3','scripts/verify-native-package.py',str(ipa),'--version','0.10.14','--build','75'],check=True)
          with zipfile.ZipFile(ipa) as archive:
              info=plistlib.loads(archive.read('Payload/LifeOSProbe.app/Info.plist'))
              assert info.get('NSHealthShareUsageDescription') and info.get('NSHealthUpdateUsageDescription')
              assert 1 in info['UIDeviceFamily']
          out=Path('delivery75');out.mkdir()
          shutil.copy2(ipa,out/'LifeOS-75.ipa')
          (out/'SHA256.txt').write_text(expected+'  LifeOS-75.ipa\n')
          print('Exact verified IPA prepared. No Cloudflare access or financial data queries.')
          PY
      - name: Deliver the single IPA requested by the user
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd delivery75
          shasum -a 256 -c SHA256.txt
          gh release create ios-0.10.14-build75 LifeOS-75.ipa SHA256.txt --repo azeroualit-cloud/LifeOS --target 14d40ef496bece1ae084ff50a4030471a5cb172d --title 'Life OS 0.10.14 build 75' --notes 'Singolo file IPA richiesto dall’utente, identico al pacchetto Apple verificato nel run 41592894317. 245 unitari e verifiche UI su iPhone 15 Pro e SE 3, SDK 27.2 e runtime 27.0. App e widget arm64 per iPhoneOS verificati. Nessun aggiornamento Cloudflare eseguito: la nuova logica utenze richiede ancora l’aggiornamento backend. Aggiornare con Signulous senza disinstallare.'
