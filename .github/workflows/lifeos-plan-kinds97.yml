name: LifeOS plan kinds 97 (audit, deploy, convert)
# PLAN-KINDS-97 / FUNDS-PAY-FROM-SAVINGS-97: Fondo with optional end editable on current and future months, active fixed
# plans converted into Fondi without end (same quota, past months unchanged), on both Workers (DEPLOY-WORKERS-93).
# Live modules, anchors exactly once, verified upload with rollback. A push changing this file starts it.
on:
  push:
    branches: ['codex/build93']
    paths: ['.github/workflows/lifeos-plan-kinds97.yml']
concurrency:
  group: lifeos-site-deploy93
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.ref == 'refs/heads/codex/build93'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check both live Workers (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-plan-kinds-97.py
      - name: Deploy to both Workers with verification and rollback
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-plan-kinds-97.py
      - name: Convert the fixed plans into Fondi
        env:
          LIFEOS_TEST_PASSWORD: ${{ secrets.LIFEOS_TEST_PASSWORD }}
        run: python3 scripts/convert-fixed-plans-97.py
