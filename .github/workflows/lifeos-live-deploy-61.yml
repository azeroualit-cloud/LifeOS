name: Life OS - Aggiornamento backend 61 autorizzato
# One-shot operation explicitly approved by the owner. The exact previous branch
# head gate becomes false as soon as this single fast-forward push occurs.
# Remove this workflow after the operation; it is not reusable deployment CI.
on:
  push:
    branches: ['codex/backend-source-audit-61']
    paths: ['.github/workflows/lifeos-live-deploy-61.yml']
permissions:
  contents: read
concurrency:
  group: lifeos-test-server
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.ref == 'refs/heads/codex/backend-source-audit-61' && github.event.before == 'fc369b8697e7ac0a4802407519f07efce8dd5eef'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifica controlli di aggiornamento e rollback su fixture
        run: python3 -m unittest discover -s scripts -p test_deploy_lifeos_live_61.py
      - name: Aggiorna solo i due entrypoint verificati preservando configurazione e moduli
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-lifeos-live-61.py --apply
      - name: Verifica accesso applicativo e migrazione additiva senza modificare record utente
        env:
          LIFEOS_TEST_PASSWORD: ${{ secrets.LIFEOS_TEST_PASSWORD }}
        run: python3 scripts/verify-lifeos-live-61.py
