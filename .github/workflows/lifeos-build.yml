name: Life OS - App nativa
on:
  workflow_dispatch:
    inputs:
      reuse_verified_ui:
        description: Reuse the 31 UI tests from run 41014595085 only if app files are identical
        type: boolean
        default: false
      recover_compact_launch:
        description: Recover only the two simulator-launch failures from run 41018165365, with identical source ZIP
        type: boolean
        default: false
      package_verified_only:
        description: Package after all 127 tests are verified; only widget version metadata may differ
        type: boolean
        default: false
  push:
    paths: ['lifeos-native.zip', '.github/workflows/lifeos-build.yml', '.github/workflows/ios.yml', 'Sources/**', 'Shared/**', 'Widgets/**', 'Tests/**', 'UITests/**', '*.entitlements', 'Assets.xcassets/**', 'project.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: lifeos-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Seleziona SDK Apple recente
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          found = []
          for path in pathlib.Path('/Applications').glob('Xcode_*.app'):
              match = re.fullmatch(r'Xcode_([0-9.]+)\.app', path.name)
              if match:
                  version = tuple(map(int, match[1].split('.')))
                  if version[0] >= 26: found.append((version, path))
          assert found, 'Serve Xcode 26 o successivo per il design Apple attuale.'
          path = max(found, key=lambda x: x[0])[1]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + str(path / 'Contents/Developer') + '\n')
          print('Xcode selezionato:', path.name)
          PY
      - name: Prepara progetto
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          source = pathlib.Path('lifeos-native.zip')
          if source.is_file():
              assert hashlib.sha256(source.read_bytes()).hexdigest() == 'e8084ac7a67620534a33c34be0f3cae8466fb100cff9575bae2cc082137dc0d4', 'ZIP sorgenti diverso da quello previsto'
              with zipfile.ZipFile(source) as archive:
                  for name in archive.namelist():
                      p = pathlib.PurePosixPath(name)
                      assert not p.is_absolute() and '..' not in p.parts
                  archive.extractall('app')
          elif pathlib.Path('project.yml').is_file():
              import shutil
              pathlib.Path('app').mkdir()
              for name in ['Sources', 'Shared', 'Widgets', 'Tests', 'UITests', 'Assets.xcassets']:
                  shutil.copytree(name, 'app/' + name)
              shutil.copy2('project.yml', 'app/project.yml')
              for name in ['LifeOS.entitlements', 'Widget.entitlements']:
                  shutil.copy2(name, 'app/' + name)
              pathlib.Path('app/scripts').mkdir(exist_ok=True)
              shutil.copy2('scripts/check-design-system.py', 'app/scripts/check-design-system.py')
          else:
              raise SystemExit('Manca lifeos-native.zip nella radice del repository.')
          PY
      - name: Verifica design system
        working-directory: app
        run: python3 scripts/check-design-system.py
      - name: Genera progetto Xcode
        working-directory: app
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          mkdir -p build
      - name: Verifica contratto nativo sul database condiviso
        if: github.repository == 'azeroualit-cloud/LifeOS'
        working-directory: app
        env:
          LIFEOS_TEST_PASSWORD: ${{ secrets.LIFEOS_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, http.cookiejar, json, os, pathlib, subprocess, tempfile, time, urllib.request
          origin = 'https://lifeos-native-test.a-zeroual-it.workers.dev'
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def request(path, value):
              r = urllib.request.Request(origin + path, data=json.dumps(value).encode(), method='POST', headers={'Origin':origin,'Content-Type':'application/json','User-Agent':'LifeOS-Native-Check/1.0'})
              with client.open(r, timeout=90) as response:
                  assert response.status == 200 and response.headers.get('X-LifeOS-Data-Source') == 'shared'
                  return response.read()
          stage = 'login'
          try:
              password = os.environ['LIFEOS_TEST_PASSWORD']
              assert password
              request('/auth/login', {'user':'nas','password':password})
              now = datetime.datetime.now(datetime.timezone.utc)
              with tempfile.TemporaryDirectory(prefix='lifeos-contract-') as tmp:
                  folder = pathlib.Path(tmp)
                  start = time.monotonic()
                  stage = 'finance-overview'
                  finance = request('/api/getFinanceOverview', [now.year, now.month])
                  elapsed = time.monotonic()-start
                  light = json.loads(finance)
                  assert isinstance(light['planning'], dict)
                  (folder/'finance.json').write_bytes(finance)
                  stage = 'native-validator'
                  (folder/'Verify.swift').write_text('import Foundation\n@main struct Verify { static func main() { do { _ = try NativeValidation.snapshot(Data(contentsOf: URL(fileURLWithPath: CommandLine.arguments[1]))); print("NATIVE_FINANCE_CONTRACT_OK") } catch { print("NATIVE_FINANCE_CONTRACT_FAILED"); exit(1) } } }')
                  clean = dict(os.environ); clean.pop('LIFEOS_TEST_PASSWORD', None)
                  result = subprocess.run(['swiftc','-swift-version','5','-parse-as-library','Sources/Models.swift','Sources/NativeModels.swift',str(folder/'Verify.swift'),'-o',str(folder/'verify')],env=clean,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  assert result.returncode == 0, 'Compilazione validatore non riuscita'
                  subprocess.run([str(folder/'verify'),str(folder/'finance.json')],env=clean,check=True)
                  stage = 'life-data'
                  life = json.loads(request('/api/getLifeData',[now.strftime('%Y-%m')]))
                  assert isinstance(life['tasks'],list) and isinstance(life['categories'],list)
                  assert isinstance(json.loads(finance)['extraPlan']['allocations'],list)
                  assert len(json.loads(finance)['forecastHistory']) == 6
                  stage = 'finance-full'
                  full = json.loads(request('/api/getFinanceData', [now.year, now.month]))
                  assert isinstance(full['forecastPlan']['allocations'], list)
                  assert isinstance(full['planning'], dict)
                  assert light['planning']['goal'] == full['planning']['goal']
                  assert light['planning'].get('savingsTarget') == full['planning'].get('savingsTarget')
                  print('Contratto condiviso verificato; riepilogo: %.3f secondi, %d byte.' % (elapsed,len(finance)))
          except Exception as error:
              raise SystemExit('Verifica contratto fallita: stage=%s class=%s HTTP=%s. Nessun dato o credenziale pubblicato.' % (stage,type(error).__name__,getattr(error,'code','n/a')))
          PY
      - name: Compila app e test Apple
        if: inputs.package_verified_only != true
        timeout-minutes: 12
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); keys=sorted((k for k in d["devices"] if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); print(next(x["udid"] for k in keys for x in d["devices"][k] if "iPhone" in x["name"]))')
          xcodebuild build-for-testing -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compile.log
      - name: Verifica recupero dei soli avvii del simulatore
        if: inputs.recover_compact_launch == true
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE_UI: ${{ inputs.reuse_verified_ui == true }}
        run: |
          set -euo pipefail
          gh run view 41018165365 --repo azeroualit-cloud/LifeOS --log > app/build/verified-recovery.log
          python3 - <<'PYRECOVERY'
          import io, os, pathlib, re, subprocess, zipfile
          assert os.environ['REUSE_UI'] == 'true', 'Il recupero richiede anche la verifica dei 31 UI'
          commit = '5067b2f78bec2b1e7cd1630333482270b291c221'
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', commit], check=True)
          previous = subprocess.check_output(['git', 'show', commit + ':lifeos-native.zip'])
          def files(archive):
              result = {name: archive.read(name) for name in archive.namelist()}
              project = result['project.yml'].decode()
              project = project.replace('        CFBundleDisplayName: Life OS\n        CFBundleVersion: $(CURRENT_PROJECT_VERSION)\n        CFBundleShortVersionString: $(MARKETING_VERSION)\n        NSExtension:', '        CFBundleDisplayName: Life OS\n        NSExtension:', 1)
              result['project.yml'] = project.encode()
              return result
          assert files(zipfile.ZipFile(io.BytesIO(previous))) == files(zipfile.ZipFile('lifeos-native.zip')), 'Sorgenti modificati: eseguire tutti i test'
          log = pathlib.Path('app/build/verified-recovery.log').read_text()
          assert 'Executed 82 tests, with 0 failures' in log
          outcomes = re.findall(r"Test Case '-\[LifeOSProbeUITests.NativeInterfaceTests (\w+)\]' (passed|failed)", log)
          passed = {name for name, result in outcomes if result == 'passed'}
          failed = {name for name, result in outcomes if result == 'failed'}
          expected_failed = {'testCalendarEventCanBeCreatedAfterBoundaryScroll', 'testCalendarSelectionUpdatesImmediatelyAndKeepsEventIndex'}
          assert failed == expected_failed, failed
          errors = [line for line in log.splitlines() if 'error: -[LifeOSProbeUITests.NativeInterfaceTests ' in line]
          assert len(errors) >= 2 and all('Failed to get launch progress' in line and 'NativeInterfaceTests.swift:9:' in line for line in errors), errors
          required = set(re.findall(r'-only-testing:LifeOSProbeUITests/NativeInterfaceTests/(\w+)', pathlib.Path('.github/workflows/lifeos-build.yml').read_text()))
          assert len(required) == 14 and passed == required - failed, passed
          pathlib.Path('app/build/recovery-cases.txt').write_text('\n'.join(sorted(failed)) + '\n')
          print('VERIFIED_RECOVERY: source files identical except explicit widget version metadata; 82 unit and 12 compact UI passed')
          PYRECOVERY
      - name: Verifica mirata Finanza su compatto
        if: inputs.recover_compact_launch != true
        timeout-minutes: 15
        working-directory: app
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["name"].startswith("iOS")]; print(sorted(r,key=lambda x:tuple(map(int,x["version"].split("."))),reverse=True)[0]["identifier"])')
          COMPACT=$(xcrun simctl create 'LifeOS compact' 'com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation' "$RUNTIME")
          echo "COMPACT=$COMPACT" >> "$GITHUB_ENV"
          xcrun simctl shutdown all
          xcrun simctl boot "$COMPACT"
          xcrun simctl bootstatus "$COMPACT" -b
          xcodebuild test-without-building -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$COMPACT" -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testFinanceOverviewSupportsLargeTextAndEmptySnapshot -resultBundlePath build/Focused.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/focused-tests.log
      - name: Verifica riuso della suite UI già superata
        if: inputs.reuse_verified_ui == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 41014595085 --repo azeroualit-cloud/LifeOS --log > app/build/verified-ui.log
          python3 - <<'PYREUSE'
          import io, pathlib, subprocess, zipfile
          commit = '9e7a2c33bbb2452eecfb910eb97a73c486549624'
          subprocess.run(['git', 'fetch', '--no-tags', 'origin', commit], check=True)
          previous = zipfile.ZipFile(io.BytesIO(subprocess.check_output(['git', 'show', commit + ':lifeos-native.zip'])))
          current = zipfile.ZipFile('lifeos-native.zip')
          def files(archive):
              result = {name: archive.read(name) for name in archive.namelist()}
              project = result['project.yml'].decode()
              project = project.replace('        CFBundleDisplayName: Life OS\n        CFBundleVersion: $(CURRENT_PROJECT_VERSION)\n        CFBundleShortVersionString: $(MARKETING_VERSION)\n        NSExtension:', '        CFBundleDisplayName: Life OS\n        NSExtension:', 1)
              result['project.yml'] = project.encode()
              return result
          def app_files(archive):
              return {name: value for name, value in files(archive).items() if not name.startswith('Tests/')}
          assert app_files(previous) == app_files(current), 'App modificata: eseguire la suite UI completa'
          log = pathlib.Path('app/build/verified-ui.log').read_text()
          assert 'Executed 31 tests, with 0 failures' in log
          assert 'testWidgetQuickAddColdLaunchReachesBothEditors]\' passed' in log
          print('VERIFIED_UI_REUSED: 31 UI passed; all code and UI tests byte-identical; only explicit widget version metadata may differ')
          PYREUSE
      - name: Verifica copertura completa prima del solo packaging
        if: inputs.package_verified_only == true
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVER: ${{ inputs.recover_compact_launch == true }}
          REUSE_UI: ${{ inputs.reuse_verified_ui == true }}
        run: |
          set -euo pipefail
          gh run view 41023842491 --repo azeroualit-cloud/LifeOS --log > app/build/verified-final-tests.log
          python3 - <<'PYPACKAGE'
          import os, pathlib, re
          assert os.environ['RECOVER'] == os.environ['REUSE_UI'] == 'true'
          log = pathlib.Path('app/build/verified-final-tests.log').read_text()
          outcomes = re.findall(r"Test Case '-\[LifeOSProbeUITests.NativeInterfaceTests (\w+)\]' (passed|failed)", log)
          expected = set(pathlib.Path('app/build/recovery-cases.txt').read_text().splitlines())
          assert {name for name, status in outcomes if status == 'passed'} == expected
          assert not any(status == 'failed' for _, status in outcomes)
          assert 'Executed 2 tests, with 0 failures' in log
          assert 'VERIFIED_RECOVERY:' in log and 'VERIFIED_UI_REUSED:' in log
          print('VERIFIED_TEST_COVERAGE_OK: 82 unit + 31 main UI + 14 compact UI; only widget version metadata changed')
          PYPACKAGE
      - name: Compila ed esegui tutti i test
        if: inputs.recover_compact_launch != true
        timeout-minutes: 35
        working-directory: app
        env:
          REUSE_VERIFIED_UI: ${{ inputs.reuse_verified_ui == true }}
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); keys=sorted((k for k in d["devices"] if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); print(next(x["udid"] for k in keys for x in d["devices"][k] if "iPhone" in x["name"]))')
          xcrun simctl shutdown all
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          TEST_SCOPE=()
          if [ "$REUSE_VERIFIED_UI" = "true" ]; then TEST_SCOPE=(-only-testing:LifeOSProbeTests); fi
          xcodebuild test "${TEST_SCOPE[@]}" -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log
      - name: Esporta anteprima principale
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          elif [ -d build/Focused.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Focused.xcresult --output-path build/screenshots
          fi
      - name: Anteprima principale durante la verifica compatta
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-anteprima-principale
          path: app/build/screenshots/
          retention-days: 1
          if-no-files-found: ignore
      - name: Verifica interfaccia su iPhone compatto
        if: inputs.package_verified_only != true
        timeout-minutes: 25
        working-directory: app
        env:
          RECOVER_COMPACT: ${{ inputs.recover_compact_launch == true }}
        run: |
          set -euo pipefail
          if [ "$RECOVER_COMPACT" = "true" ]; then
            RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["name"].startswith("iOS")]; print(sorted(r,key=lambda x:tuple(map(int,x["version"].split("."))),reverse=True)[0]["identifier"])')
            COMPACT=$(xcrun simctl create 'LifeOS compact recovery' 'com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation' "$RUNTIME")
            echo "COMPACT=$COMPACT" >> "$GITHUB_ENV"
          fi
          xcrun simctl shutdown all
          xcrun simctl boot "$COMPACT"
          xcrun simctl bootstatus "$COMPACT" -b
          COMPACT_SCOPE=(-only-testing:LifeOSProbeUITests/NativeInterfaceTests/testFourSectionsInBothThemes -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testCalendarEventCanBeCreatedAfterBoundaryScroll -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testLargeTextAndSixWeekCalendar -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeSummaryAndVerticalRoutinesInBothThemes -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testCalendarSelectionUpdatesImmediatelyAndKeepsEventIndex -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeEmptyStatesRemainActionable -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeManyEventsAndTasksStayBoundedAndReachable -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testSharedRowsAndCategoryChoicesKeepAccessibleTargets -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testNavigationKeepsSelectionAndGeometryWhenChangingTabs -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testFinanceOverviewSupportsLargeTextAndEmptySnapshot -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeRestoresNeutralNextTimeWithoutArabicNames -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testReducedMotionKeepsChecklistAndFinanceActionsFunctional -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testCalendarTodayRestoresMonthAndSelection -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testNativeToolbarRespondsAcross44PointTouchRegion)
          if [ "$RECOVER_COMPACT" = "true" ]; then
            COMPACT_SCOPE=()
            while IFS= read -r name; do COMPACT_SCOPE+=("-only-testing:LifeOSProbeUITests/NativeInterfaceTests/$name"); done < build/recovery-cases.txt
            APP_PATH=$(python3 -c 'from pathlib import Path; p=list(Path.home().glob("Library/Developer/Xcode/DerivedData/LifeOSProbe-*/Build/Products/Debug-iphonesimulator/LifeOSProbe.app")); assert len(p)==1, "Expected exactly one compiled simulator app"; print(p[0])')
            test -d "$APP_PATH"
            xcrun simctl install "$COMPACT" "$APP_PATH"
            xcrun simctl launch --terminate-running-process "$COMPACT" com.nas.lifeos.probe --visual-test
            xcrun simctl io "$COMPACT" screenshot build/preflight.png
          fi
          xcodebuild test -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$COMPACT" -parallel-testing-enabled NO "${COMPACT_SCOPE[@]}" -resultBundlePath build/Compact.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compact.log
      - name: Esporta schermate del simulatore
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -d build/Compact.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Compact.xcresult --output-path build/compact-screenshots
          fi
      - name: Crea una sola IPA per iPhone
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS.xcarchive CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
          test -d build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app
          python3 - <<'PYWIDGET'
          import pathlib, plistlib
          app = pathlib.Path('build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app')
          extension = app / 'PlugIns/LifeOSDayWidget.appex'
          assert extension.is_dir(), 'Estensione widget assente dall’app archiviata'
          main = plistlib.loads((app/'Info.plist').read_bytes())
          widget = plistlib.loads((extension/'Info.plist').read_bytes())
          assert widget['NSExtension']['NSExtensionPointIdentifier'] == 'com.apple.widgetkit-extension'
          assert widget['CFBundleIdentifier'] == main['CFBundleIdentifier'] + '.widget'
          assert widget['CFBundleVersion'] == main['CFBundleVersion'] == '52'
          assert widget['CFBundleShortVersionString'] == main['CFBundleShortVersionString'] == '0.9.0'
          assert any('lifeos' in entry.get('CFBundleURLSchemes', []) for entry in main['CFBundleURLTypes'])
          print('WIDGET_EMBEDDED_AND_VERSIONED_OK')
          PYWIDGET
          mkdir -p build/Payload download
          cp -R build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          cd build
          zip -qr ../download/LifeOS-unsigned.ipa Payload
          cd ../download
          python3 - <<'PYIPA'
          import zipfile, plistlib, struct
          with zipfile.ZipFile('LifeOS-unsigned.ipa') as archive:
              assert archive.testzip() is None
              for prefix in ['Payload/LifeOSProbe.app/', 'Payload/LifeOSProbe.app/PlugIns/LifeOSDayWidget.appex/']:
                  info = plistlib.loads(archive.read(prefix + 'Info.plist'))
                  assert info['CFBundleVersion'] == '52' and info['CFBundleSupportedPlatforms'] == ['iPhoneOS']
                  binary = archive.read(prefix + info['CFBundleExecutable'])
                  assert binary[:4] == b'\xcf\xfa\xed\xfe' and struct.unpack('<I', binary[4:8])[0] == 0x0100000C
          print('IPA_INTEGRITY_VERSION_AND_ARM64_OK')
          PYIPA
          shasum -a 256 LifeOS-unsigned.ipa | tee SHA256.txt
      - name: Errori XCTest in annotazioni
        if: always()
        working-directory: app
        run: |
          python3 - <<'PYLOG'
          import pathlib, re
          for name in ['compile.log', 'focused-tests.log', 'tests.log', 'compact.log', 'archive.log']:
              path = pathlib.Path('build') / name
              if not path.exists(): continue
              lines = path.read_text(errors='replace').splitlines()
              errors = [line for line in lines if re.search(r'\.swift:\d+(?::\d+)?: error:|^xcodebuild: error:', line) or ('Test Case ' in line and ' failed ' in line)]
              for line in errors[:12]:
                  message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + message)
              outcomes = list(dict.fromkeys(match.group(0) for line in lines if (match := re.search(r'Executed \d+ tests, with \d+ failures(?: \(\d+ unexpected\))?', line))))
              for outcome in outcomes[-3:]:
                  print('::notice::' + name + ': ' + outcome.replace('%', '%25'))
              if not errors and lines:
                  tail = next((line for line in reversed(lines) if line.strip()), '')
                  print('::notice::Ultima riga ' + name + ': ' + tail[:900].replace('%', '%25'))
          PYLOG
      - name: Schermate della demo per revisione visiva
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-anteprima
          path: |
            app/build/preflight.png
            app/build/screenshots/*.png
            app/build/screenshots/manifest.json
            app/build/compact-screenshots/*.png
            app/build/compact-screenshots/manifest.json
          retention-days: 1
          if-no-files-found: ignore
      - name: IPA unica per Signulous
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-IPA-per-Signulous
          path: app/download/
          retention-days: 7
          if-no-files-found: error
      - name: Log e risultati anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-diagnostica
          path: |
            app/build/*.log
            app/build/Tests.xcresult
            app/build/Focused.xcresult
            app/build/Compact.xcresult
          retention-days: 1
          if-no-files-found: ignore
