name: Life OS - App nativa
on:
  workflow_dispatch:
  push:
    paths: ['lifeos-native.zip', '.github/workflows/lifeos-build.yml', '.github/workflows/ios.yml', 'Sources/**', 'Tests/**', 'Assets.xcassets/**', 'project.yml', 'native/**', 'native-next/**', 'backend/activities/**', 'manual/build-68/**', 'scripts/deploy-activities-68.py', 'scripts/print-native-previews.py']
permissions:
  contents: write
concurrency:
  group: lifeos-native-71-redesign-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 145
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Seleziona SDK Apple recente
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          found = []
          for path in pathlib.Path('/Applications').glob('Xcode_*.app'):
              match = re.fullmatch(r'Xcode_([0-9.]+)\.app', path.name)
              if match:
                  version = tuple(map(int, match[1].split('.')))
                  if version[0] >= 26: found.append((version, path))
          assert found, 'Serve Xcode 26 o successivo per il design Apple attuale.'
          path = max(found, key=lambda x: x[0])[1]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + str(path / 'Contents/Developer') + '\n')
          print('Xcode selezionato:', path.name)
          PY
      - name: Prepara progetto
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error https://raw.githubusercontent.com/azeroualit-cloud/LifeOS/02c2c089841833a67fc9a223b367710edf7e37b9/lifeos-native.zip -o /tmp/lifeos-build60.zip
          python3 - <<'PYZIP'
          import pathlib, hashlib, zipfile, shutil
          source = pathlib.Path('/tmp/lifeos-build60.zip')
          assert hashlib.sha256(source.read_bytes()).hexdigest() == 'b09762b88e4dc017d2c89fa7582ac38daf1fddf5aa0dd12fed94d73f6099ef03'
          with zipfile.ZipFile(source) as archive:
              for name in archive.namelist():
                  path = pathlib.PurePosixPath(name)
                  assert not path.is_absolute() and '..' not in path.parts
              archive.extractall('app')
          overlay = pathlib.Path('native-next')
          for path in overlay.rglob('*'):
              if path.is_file() and path.parts[1] in ['Sources','Tests','UITests','Widget','Shared','project.yml','LifeOS.entitlements','Widget.entitlements']:
                  target = pathlib.Path('app') / path.relative_to(overlay)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  shutil.copy2(path,target)
          PYZIP
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verifica conservazione attività su database isolato
        run: node web/tests/task-retention.mjs
      - name: Verifica instradamento spese e transazioni atomiche
        run: node backend/expense-routing/tests/routing.test.mjs
      - name: Verifica attività unificate e replay atomici
        run: |
          python3 scripts/build-worker-68.py
          node backend/activities/tests/activities.test.mjs
          node backend/activities/tests/worker.test.mjs
          LIFEOS_ROUTING_WORKER=manual/build-68/worker.js node backend/expense-routing/tests/routing.test.mjs
          node --input-type=module --check < manual/build-68/worker.js
          python3 scripts/build-worker-70.py
          node backend/movement-order/tests/creation.test.mjs
          LIFEOS_ROUTING_WORKER=manual/build-70/worker.js node backend/expense-routing/tests/routing.test.mjs
          LIFEOS_ACTIVITY_WORKER=manual/build-70/worker.js node backend/activities/tests/worker.test.mjs
      - name: Verifica contesto backend live senza scritture
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-unified-activities.py
      - name: Verifica design system
        working-directory: app
        run: python3 scripts/check-design-system.py
      - name: Genera progetto Xcode
        working-directory: app
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          mkdir -p build
      - name: Verifica contratto nativo sul database condiviso
        # The legacy live getLifeData deletes completed tasks after five days.
        # Keep the live contract opt-in until the retention backend is deployed.
        if: github.repository == 'azeroualit-cloud/LifeOS' && github.event_name == 'workflow_dispatch'
        working-directory: app
        env:
          LIFEOS_TEST_PASSWORD: ${{ secrets.LIFEOS_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, http.cookiejar, json, os, pathlib, subprocess, tempfile, time, urllib.request
          origin = 'https://lifeos-native-test.a-zeroual-it.workers.dev'
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def request(path, value):
              r = urllib.request.Request(origin + path, data=json.dumps(value).encode(), method='POST', headers={'Origin':origin,'Content-Type':'application/json','User-Agent':'LifeOS-Native-Check/1.0'})
              with client.open(r, timeout=90) as response:
                  assert response.status == 200 and response.headers.get('X-LifeOS-Data-Source') == 'shared'
                  return response.read()
          stage = 'login'
          try:
              password = os.environ['LIFEOS_TEST_PASSWORD']
              assert password
              request('/auth/login', {'user':'nas','password':password})
              now = datetime.datetime.now(datetime.timezone.utc)
              with tempfile.TemporaryDirectory(prefix='lifeos-contract-') as tmp:
                  folder = pathlib.Path(tmp)
                  start = time.monotonic()
                  stage = 'finance-overview'
                  finance = request('/api/getFinanceOverview', [now.year, now.month])
                  elapsed = time.monotonic()-start
                  light = json.loads(finance)
                  assert isinstance(light['planning'], dict)
                  (folder/'finance.json').write_bytes(finance)
                  stage = 'native-validator'
                  (folder/'Verify.swift').write_text('import Foundation\n@main struct Verify { static func main() { do { _ = try NativeValidation.snapshot(Data(contentsOf: URL(fileURLWithPath: CommandLine.arguments[1]))); print("NATIVE_FINANCE_CONTRACT_OK") } catch { print("NATIVE_FINANCE_CONTRACT_FAILED"); exit(1) } } }')
                  clean = dict(os.environ); clean.pop('LIFEOS_TEST_PASSWORD', None)
                  result = subprocess.run(['swiftc','-swift-version','5','-parse-as-library','Sources/Models.swift','Sources/NativeModels.swift',str(folder/'Verify.swift'),'-o',str(folder/'verify')],env=clean,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  assert result.returncode == 0, 'Compilazione validatore non riuscita'
                  subprocess.run([str(folder/'verify'),str(folder/'finance.json')],env=clean,check=True)
                  stage = 'life-data'
                  life = json.loads(request('/api/getLifeData',[now.strftime('%Y-%m')]))
                  assert isinstance(life['tasks'],list) and isinstance(life['categories'],list)
                  assert isinstance(json.loads(finance)['extraPlan']['allocations'],list)
                  assert len(json.loads(finance)['forecastHistory']) == 6
                  stage = 'finance-full'
                  full = json.loads(request('/api/getFinanceData', [now.year, now.month]))
                  assert isinstance(full['forecastPlan']['allocations'], list)
                  assert isinstance(full['planning'], dict)
                  assert light['planning']['goal'] == full['planning']['goal']
                  assert light['planning'].get('savingsTarget') == full['planning'].get('savingsTarget')
                  print('Contratto condiviso verificato; riepilogo: %.3f secondi, %d byte.' % (elapsed,len(finance)))
          except Exception as error:
              raise SystemExit('Verifica contratto fallita: stage=%s class=%s HTTP=%s. Nessun dato o credenziale pubblicato.' % (stage,type(error).__name__,getattr(error,'code','n/a')))
          PY
      - name: Prepara iPhone 15 Pro
        run: |
          python3 - <<'PYDEVICE'
          import json, os, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          runtime=sorted(k for k in data['devices'] if 'iOS' in k)[-1]
          matches=[d['udid'] for d in data['devices'][runtime] if d['name']=='iPhone 15 Pro']
          device=matches[0] if matches else subprocess.check_output(['xcrun','simctl','create','LifeOS iPhone 15 Pro','com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro',runtime],text=True).strip()
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('MAIN_DEVICE='+device+'\n')
          PYDEVICE
      - name: Compila app e test Apple
        timeout-minutes: 35
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE="$MAIN_DEVICE"
          echo "MAIN_DEVICE=$DEVICE" >> "$GITHUB_ENV"
          xcodebuild build-for-testing -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compile.log
      - name: Verifica mese/giorno, editor, Finanza e widget
        timeout-minutes: 25
        working-directory: app
        run: |
          set -euo pipefail
          xcrun simctl boot "$MAIN_DEVICE" || true
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          xcodebuild test-without-building -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests/NativeRevision71UITests -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testInformativeWidgetFitsBothSmallWidths -resultBundlePath build/Focused.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/focused-tests.log
      - name: Verifica logica e flussi agenda su iPhone principale
        timeout-minutes: 35
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE="$MAIN_DEVICE"
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcodebuild test-without-building -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeTests -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testExpenseAutomaticallyOffersWaterFundAndCanChangeExistingDestination -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testDashboardFocusTimelineOpensEventWithoutDuplicateSummary -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeSummaryAndVerticalRoutinesInBothThemes -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeEmptyStatesRemainActionable -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeManyEventsAndTasksStayBoundedAndReachable -resultBundlePath build/Regression.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/regression-tests.log
      - name: Prepara simulatore compatto
        timeout-minutes: 25
        working-directory: app
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$MAIN_DEVICE"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["name"].startswith("iOS")]; print(sorted(r,key=lambda x:tuple(map(int,x["version"].split("."))),reverse=True)[0]["identifier"])')
          COMPACT=$(xcrun simctl create 'LifeOS compact' 'com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation' "$RUNTIME")
          echo "COMPACT=$COMPACT" >> "$GITHUB_ENV"
          xcrun simctl boot "$COMPACT"
          xcrun simctl bootstatus "$COMPACT" -b
          xcrun simctl shutdown "$COMPACT"
      - name: Esporta anteprima principale
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -f build/Tests.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          elif [ -f build/Regression.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/Regression.xcresult --output-path build/screenshots
          elif [ -f build/Focused.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/Focused.xcresult --output-path build/screenshots
          fi
      - name: Esporta schermate editor e Salute
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -f build/Focused.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/Focused.xcresult --output-path build/focused-screenshots
          fi
      - name: Anteprime UI nei log
        if: always()
        working-directory: app
        run: |
          python3 ../scripts/print-native-previews.py main
      - name: Anteprima principale durante la verifica compatta
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-anteprima-principale
          path: |
            app/build/screenshots/
            app/build/focused-screenshots/
          retention-days: 1
          if-no-files-found: ignore
      - name: Verifica agenda e archivio su iPhone compatto
        timeout-minutes: 25
        working-directory: app
        run: |
          set -euo pipefail
          xcrun simctl shutdown "$MAIN_DEVICE" || true
          xcrun simctl boot "$COMPACT"
          xcrun simctl bootstatus "$COMPACT" -b
          xcodebuild test -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$COMPACT" -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests/NativeRevision71UITests -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testInformativeWidgetFitsBothSmallWidths -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testDashboardAgendaGroupsDaysAndCompletesWithoutOpeningEditor -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testExpenseAutomaticallyOffersWaterFundAndCanChangeExistingDestination -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testActivityAgendaShowsOnlyRelevantItemsAndFoldsCompleted -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeHealthCardRemainsCompactAndOpensDetail -resultBundlePath build/Compact.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compact.log
      - name: Esporta schermate del simulatore
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -f build/Compact.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path build/Compact.xcresult --output-path build/compact-screenshots
          fi
      - name: Anteprime compatte nei log
        if: always()
        working-directory: app
        run: python3 ../scripts/print-native-previews.py compact
      - name: Crea una sola IPA per iPhone
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS.xcarchive CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
          test -d build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app
          mkdir -p build/Payload download
          cp -R build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          cd build
          zip -qr ../download/LifeOS-unsigned.ipa Payload
          cd ../download
          python3 ../../scripts/verify-native-package.py LifeOS-unsigned.ipa --version 0.10.10 --build 71
          shasum -a 256 LifeOS-unsigned.ipa > SHA256.txt
      - name: Errori XCTest in annotazioni
        if: always()
        working-directory: app
        run: |
          python3 - <<'PYLOG'
          import pathlib, re
          for name in ['compile.log', 'regression-tests.log', 'focused-tests.log', 'tests.log', 'compact.log', 'archive.log']:
              path = pathlib.Path('build') / name
              if not path.exists(): continue
              lines = path.read_text(errors='replace').splitlines()
              errors = [line for line in lines if re.search(r'\.swift:\d+(?::\d+)?: error:|^xcodebuild: error:', line) or ('Test Case ' in line and ' failed ' in line)]
              for line in errors[:12]:
                  message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + message)
              outcomes = list(dict.fromkeys(match.group(0) for line in lines if (match := re.search(r'Executed \d+ tests, with \d+ failures(?: \(\d+ unexpected\))?', line))))
              for outcome in outcomes[-3:]:
                  print('::notice::' + name + ': ' + outcome.replace('%', '%25'))
              if not errors and lines:
                  tail = next((line for line in reversed(lines) if line.strip()), '')
                  print('::notice::Ultima riga ' + name + ': ' + tail[:900].replace('%', '%25'))
          PYLOG
      - name: Schermate della demo per revisione visiva
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-anteprima
          path: |
            app/build/focused-screenshots/*.png
            app/build/focused-screenshots/manifest.json
            app/build/screenshots/*.png
            app/build/screenshots/manifest.json
            app/build/compact-screenshots/*.png
            app/build/compact-screenshots/manifest.json
          retention-days: 1
          if-no-files-found: ignore
      - name: IPA unica per Signulous
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-IPA-per-Signulous
          path: app/download/
          retention-days: 7
          if-no-files-found: error
      - name: Log e risultati anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-diagnostica
          path: |
            app/build/*.log
            app/build/Tests.xcresult
            app/build/Regression.xcresult
            app/build/Focused.xcresult
            app/build/Compact.xcresult
          retention-days: 1
          if-no-files-found: ignore
      - name: Pubblica link diretto IPA 71 verificata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd app/download
          shasum -a 256 -c SHA256.txt
          unzip -tq LifeOS-unsigned.ipa
          cp LifeOS-unsigned.ipa LifeOS-71.ipa
          gh release create ios-0.10.10-build71 LifeOS-71.ipa SHA256.txt --repo azeroualit-cloud/LifeOS --target "$GITHUB_SHA" --title "Life OS 0.10.10 build 71" --notes "Calendario mese/giorno, editor attività dal basso, date e orari affiancati, Finanza aperta, accento Salute e widget Life OS Oggi. IPA non firmata per Signulous, pubblicata dopo verifiche Apple. Sorgente: $GITHUB_SHA."
