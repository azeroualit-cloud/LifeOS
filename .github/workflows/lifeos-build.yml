name: Life OS - App nativa
on:
  workflow_dispatch:
  push:
    paths: ['lifeos-native.zip', '.github/workflows/lifeos-build.yml', '.github/workflows/ios.yml', 'Sources/**', 'Tests/**', 'Assets.xcassets/**', 'project.yml']
permissions:
  contents: read
concurrency:
  group: lifeos-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 100
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Seleziona SDK Apple recente
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          found = []
          for path in pathlib.Path('/Applications').glob('Xcode_*.app'):
              match = re.fullmatch(r'Xcode_([0-9.]+)\.app', path.name)
              if match:
                  version = tuple(map(int, match[1].split('.')))
                  if version[0] >= 26: found.append((version, path))
          assert found, 'Serve Xcode 26 o successivo per il design Apple attuale.'
          path = max(found, key=lambda x: x[0])[1]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + str(path / 'Contents/Developer') + '\n')
          print('Xcode selezionato:', path.name)
          PY
      - name: Prepara progetto
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          source = pathlib.Path('lifeos-native.zip')
          if source.is_file():
              assert hashlib.sha256(source.read_bytes()).hexdigest() == 'f6fc56ba492b245669fb393adf2e5a0d15744aaa01345affddd3d3c0b17c84d0', 'ZIP sorgenti diverso da quello previsto'
              with zipfile.ZipFile(source) as archive:
                  for name in archive.namelist():
                      p = pathlib.PurePosixPath(name)
                      assert not p.is_absolute() and '..' not in p.parts
                  archive.extractall('app')
          elif pathlib.Path('project.yml').is_file():
              import shutil
              pathlib.Path('app').mkdir()
              for name in ['Sources', 'Tests', 'UITests', 'Assets.xcassets']:
                  shutil.copytree(name, 'app/' + name)
              shutil.copy2('project.yml', 'app/project.yml')
              pathlib.Path('app/scripts').mkdir(exist_ok=True)
              shutil.copy2('scripts/check-design-system.py', 'app/scripts/check-design-system.py')
          else:
              raise SystemExit('Manca lifeos-native.zip nella radice del repository.')
          PY
      - name: Verifica design system
        working-directory: app
        run: python3 scripts/check-design-system.py
      - name: Genera progetto Xcode
        working-directory: app
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          mkdir -p build
      # This build validates local fixtures only. Live backend verification is a
      # separate action requiring explicit authorization and configured credentials.
      - name: Compila app e test Apple
        timeout-minutes: 12
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); keys=sorted((k for k in d["devices"] if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); print(next(x["udid"] for k in keys for x in d["devices"][k] if "iPhone" in x["name"]))')
          xcodebuild build-for-testing -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compile.log
      - name: Verifica persistenza e sincronizzazione
        timeout-minutes: 10
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); keys=sorted((k for k in d["devices"] if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); print(next(x["udid"] for k in keys for x in d["devices"][k] if "iPhone" in x["name"]))')
          xcodebuild test-without-building -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 300 -parallel-testing-enabled NO -only-testing:LifeOSProbeTests -resultBundlePath build/Unit.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/unit-tests.log
      - name: Verifica completa interfaccia
        timeout-minutes: 45
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); keys=sorted((k for k in d["devices"] if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); print(next(x["udid"] for k in keys for x in d["devices"][k] if "iPhone" in x["name"]))')
          xcodebuild test -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log
      - name: Esporta anteprima principale
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          elif [ -d build/Health.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Health.xcresult --output-path build/screenshots
          elif [ -d build/Focused.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Focused.xcresult --output-path build/screenshots
          fi
      - name: Anteprima principale durante la verifica compatta
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-anteprima-principale
          path: app/build/screenshots/
          retention-days: 1
          if-no-files-found: ignore
      - name: Verifica interfaccia su iPhone compatto
        timeout-minutes: 25
        working-directory: app
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["name"].startswith("iOS")]; print(sorted(r,key=lambda x:tuple(map(int,x["version"].split("."))),reverse=True)[0]["identifier"])')
          COMPACT=$(xcrun simctl create 'LifeOS compact' 'com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation' "$RUNTIME")
          xcodebuild test -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$COMPACT" -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testFourSectionsInBothThemes -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testQuickWeightEntryFromDashboard -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testLargeTextAndSixWeekCalendar -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testCalendarSelectionUpdatesImmediatelyAndKeepsEventIndex -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testFinanceOverviewSupportsLargeTextAndEmptySnapshot -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testReducedMotionKeepsChecklistAndFinanceActionsFunctional -resultBundlePath build/Compact.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compact.log
      - name: Esporta schermate del simulatore
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -d build/Compact.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Compact.xcresult --output-path build/compact-screenshots
          fi
      - name: Crea una sola IPA per iPhone
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS.xcarchive CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
          test -d build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app
          mkdir -p build/Payload download
          cp -R build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          cd build
          zip -qr ../download/LifeOS-unsigned.ipa Payload
          cd ../download
          shasum -a 256 LifeOS-unsigned.ipa > SHA256.txt
      - name: Verifica IPA, estensione e collegamenti locali
        working-directory: app
        run: |
          python3 - <<'PYIPA'
          import hashlib, pathlib, plistlib, struct, zipfile
          ipa = pathlib.Path('download/LifeOS-unsigned.ipa')
          expected = pathlib.Path('download/SHA256.txt').read_text().split()[0]
          assert hashlib.sha256(ipa.read_bytes()).hexdigest() == expected
          with zipfile.ZipFile(ipa) as z:
              assert z.testzip() is None
              app = 'Payload/LifeOSProbe.app/'
              info = plistlib.loads(z.read(app + 'Info.plist'))
              assert info['CFBundleIdentifier'] == 'com.nas.lifeos.probe'
              assert info['CFBundleVersion'] == '60'
              assert info['CFBundleDevelopmentRegion'] == 'it'
              assert info['NSHealthShareUsageDescription'] and info['NSHealthUpdateUsageDescription']
              assert any(name.startswith(app + 'Metadata.appintents/') for name in z.namelist())
              assert any('lifeos' in x.get('CFBundleURLSchemes', []) for x in info['CFBundleURLTypes'])
              widget = app + 'PlugIns/LifeOSWidget.appex/'
              extension = plistlib.loads(z.read(widget + 'Info.plist'))
              assert extension['CFBundleVersion'] == info['CFBundleVersion']
              assert extension['NSExtension']['NSExtensionPointIdentifier'] == 'com.apple.widgetkit-extension'
              for prefix, metadata in [(app, info), (widget, extension)]:
                  binary = z.read(prefix + metadata['CFBundleExecutable'])
                  magic, cpu = struct.unpack('<II', binary[:8])
                  assert magic == 0xfeedfacf and cpu == 0x0100000c, 'Serve Mach-O arm64'
          print('IPA_OK: checksum, CRC, build 60, URL scheme, widget embedded, both binaries arm64')
          PYIPA
      - name: Errori XCTest in annotazioni
        if: always()
        working-directory: app
        run: |
          python3 - <<'PYLOG'
          import pathlib, re
          for name in ['compile.log', 'unit-tests.log', 'health-tests.log', 'focused-tests.log', 'tests.log', 'compact.log', 'archive.log']:
              path = pathlib.Path('build') / name
              if not path.exists(): continue
              lines = path.read_text(errors='replace').splitlines()
              errors = [line for line in lines if re.search(r'\.swift:\d+(?::\d+)?: error:|^xcodebuild: error:', line) or ('Test Case ' in line and ' failed ' in line)]
              for line in errors[:12]:
                  message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + message)
              outcomes = list(dict.fromkeys(match.group(0) for line in lines if (match := re.search(r'Executed \d+ tests, with \d+ failures(?: \(\d+ unexpected\))?', line))))
              for outcome in outcomes[-3:]:
                  print('::notice::' + name + ': ' + outcome.replace('%', '%25'))
              if not errors and lines:
                  tail = next((line for line in reversed(lines) if line.strip()), '')
                  print('::notice::Ultima riga ' + name + ': ' + tail[:900].replace('%', '%25'))
          PYLOG
      - name: Schermate della demo per revisione visiva
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-anteprima
          path: |
            app/build/screenshots/*.png
            app/build/screenshots/manifest.json
            app/build/compact-screenshots/*.png
            app/build/compact-screenshots/manifest.json
          retention-days: 1
          if-no-files-found: ignore
      - name: IPA unica per Signulous
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-IPA-per-Signulous
          path: app/download/
          retention-days: 7
          if-no-files-found: error
      - name: Log e risultati anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-diagnostica
          path: |
            app/build/*.log
            app/build/Tests.xcresult
            app/build/Focused.xcresult
            app/build/Compact.xcresult
          retention-days: 1
          if-no-files-found: ignore
