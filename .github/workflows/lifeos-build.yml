name: Life OS - App nativa
on:
  workflow_dispatch:
  push:
    paths: ['lifeos-native.zip', '.github/workflows/lifeos-build.yml', '.github/workflows/ios.yml', 'Sources/**', 'Shared/**', 'Widgets/**', 'Tests/**', 'UITests/**', '*.entitlements', 'Assets.xcassets/**', 'project.yml']
permissions:
  contents: read
concurrency:
  group: lifeos-native-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    if: github.event.repository.private == false
    runs-on: macos-15
    timeout-minutes: 75
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Seleziona SDK Apple recente
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re
          found = []
          for path in pathlib.Path('/Applications').glob('Xcode_*.app'):
              match = re.fullmatch(r'Xcode_([0-9.]+)\.app', path.name)
              if match:
                  version = tuple(map(int, match[1].split('.')))
                  if version[0] >= 26: found.append((version, path))
          assert found, 'Serve Xcode 26 o successivo per il design Apple attuale.'
          path = max(found, key=lambda x: x[0])[1]
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('DEVELOPER_DIR=' + str(path / 'Contents/Developer') + '\n')
          print('Xcode selezionato:', path.name)
          PY
      - name: Prepara progetto
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, pathlib, zipfile
          source = pathlib.Path('lifeos-native.zip')
          if source.is_file():
              assert hashlib.sha256(source.read_bytes()).hexdigest() == 'ab5d1dfe473feeeffea2a81164f4b78d41cdbad862460804d0db94f9fba4918c', 'ZIP sorgenti diverso da quello previsto'
              with zipfile.ZipFile(source) as archive:
                  for name in archive.namelist():
                      p = pathlib.PurePosixPath(name)
                      assert not p.is_absolute() and '..' not in p.parts
                  archive.extractall('app')
          elif pathlib.Path('project.yml').is_file():
              import shutil
              pathlib.Path('app').mkdir()
              for name in ['Sources', 'Shared', 'Widgets', 'Tests', 'UITests', 'Assets.xcassets']:
                  shutil.copytree(name, 'app/' + name)
              shutil.copy2('project.yml', 'app/project.yml')
              for name in ['LifeOS.entitlements', 'Widget.entitlements']:
                  shutil.copy2(name, 'app/' + name)
              pathlib.Path('app/scripts').mkdir(exist_ok=True)
              shutil.copy2('scripts/check-design-system.py', 'app/scripts/check-design-system.py')
          else:
              raise SystemExit('Manca lifeos-native.zip nella radice del repository.')
          PY
      - name: Verifica design system
        working-directory: app
        run: python3 scripts/check-design-system.py
      - name: Genera progetto Xcode
        working-directory: app
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate
          mkdir -p build
      - name: Verifica contratto nativo sul database condiviso
        if: github.repository == 'azeroualit-cloud/LifeOS'
        working-directory: app
        env:
          LIFEOS_TEST_PASSWORD: ${{ secrets.LIFEOS_TEST_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime, http.cookiejar, json, os, pathlib, subprocess, tempfile, time, urllib.request
          origin = 'https://lifeos-native-test.a-zeroual-it.workers.dev'
          client = urllib.request.build_opener(urllib.request.HTTPCookieProcessor(http.cookiejar.CookieJar()))
          def request(path, value):
              r = urllib.request.Request(origin + path, data=json.dumps(value).encode(), method='POST', headers={'Origin':origin,'Content-Type':'application/json','User-Agent':'LifeOS-Native-Check/1.0'})
              with client.open(r, timeout=90) as response:
                  assert response.status == 200 and response.headers.get('X-LifeOS-Data-Source') == 'shared'
                  return response.read()
          stage = 'login'
          try:
              password = os.environ['LIFEOS_TEST_PASSWORD']
              assert password
              request('/auth/login', {'user':'nas','password':password})
              now = datetime.datetime.now(datetime.timezone.utc)
              with tempfile.TemporaryDirectory(prefix='lifeos-contract-') as tmp:
                  folder = pathlib.Path(tmp)
                  start = time.monotonic()
                  stage = 'finance-overview'
                  finance = request('/api/getFinanceOverview', [now.year, now.month])
                  elapsed = time.monotonic()-start
                  light = json.loads(finance)
                  assert isinstance(light['planning'], dict)
                  (folder/'finance.json').write_bytes(finance)
                  stage = 'native-validator'
                  (folder/'Verify.swift').write_text('import Foundation\n@main struct Verify { static func main() { do { _ = try NativeValidation.snapshot(Data(contentsOf: URL(fileURLWithPath: CommandLine.arguments[1]))); print("NATIVE_FINANCE_CONTRACT_OK") } catch { print("NATIVE_FINANCE_CONTRACT_FAILED"); exit(1) } } }')
                  clean = dict(os.environ); clean.pop('LIFEOS_TEST_PASSWORD', None)
                  result = subprocess.run(['swiftc','-swift-version','5','-parse-as-library','Sources/Models.swift','Sources/NativeModels.swift',str(folder/'Verify.swift'),'-o',str(folder/'verify')],env=clean,stdout=subprocess.PIPE,stderr=subprocess.PIPE)
                  assert result.returncode == 0, 'Compilazione validatore non riuscita'
                  subprocess.run([str(folder/'verify'),str(folder/'finance.json')],env=clean,check=True)
                  stage = 'life-data'
                  life = json.loads(request('/api/getLifeData',[now.strftime('%Y-%m')]))
                  assert isinstance(life['tasks'],list) and isinstance(life['categories'],list)
                  assert isinstance(json.loads(finance)['extraPlan']['allocations'],list)
                  assert len(json.loads(finance)['forecastHistory']) == 6
                  stage = 'finance-full'
                  full = json.loads(request('/api/getFinanceData', [now.year, now.month]))
                  assert isinstance(full['forecastPlan']['allocations'], list)
                  assert isinstance(full['planning'], dict)
                  assert light['planning']['goal'] == full['planning']['goal']
                  assert light['planning'].get('savingsTarget') == full['planning'].get('savingsTarget')
                  print('Contratto condiviso verificato; riepilogo: %.3f secondi, %d byte.' % (elapsed,len(finance)))
          except Exception as error:
              raise SystemExit('Verifica contratto fallita: stage=%s class=%s HTTP=%s. Nessun dato o credenziale pubblicato.' % (stage,type(error).__name__,getattr(error,'code','n/a')))
          PY
      - name: Compila app e test Apple
        timeout-minutes: 12
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); keys=sorted((k for k in d["devices"] if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); print(next(x["udid"] for k in keys for x in d["devices"][k] if "iPhone" in x["name"]))')
          xcodebuild build-for-testing -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compile.log
      - name: Verifica mirata Finanza su compatto
        timeout-minutes: 15
        working-directory: app
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; r=[x for x in json.load(sys.stdin)["runtimes"] if x.get("isAvailable") and x["name"].startswith("iOS")]; print(sorted(r,key=lambda x:tuple(map(int,x["version"].split("."))),reverse=True)[0]["identifier"])')
          COMPACT=$(xcrun simctl create 'LifeOS compact' 'com.apple.CoreSimulator.SimDeviceType.iPhone-SE-3rd-generation' "$RUNTIME")
          echo "COMPACT=$COMPACT" >> "$GITHUB_ENV"
          xcodebuild test-without-building -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$COMPACT" -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testFinanceOverviewSupportsLargeTextAndEmptySnapshot -resultBundlePath build/Focused.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/focused-tests.log
      - name: Compila ed esegui tutti i test
        timeout-minutes: 35
        working-directory: app
        run: |
          set -euo pipefail
          DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,re,sys; d=json.load(sys.stdin); keys=sorted((k for k in d["devices"] if "iOS" in k),key=lambda k:tuple(map(int,re.findall(r"\d+",k))),reverse=True); print(next(x["udid"] for k in keys for x in d["devices"][k] if "iPhone" in x["name"]))')
          xcodebuild test -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$DEVICE" -parallel-testing-enabled NO -resultBundlePath build/Tests.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/tests.log
      - name: Esporta anteprima principale
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -d build/Tests.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Tests.xcresult --output-path build/screenshots
          elif [ -d build/Focused.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Focused.xcresult --output-path build/screenshots
          fi
      - name: Anteprima principale durante la verifica compatta
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-anteprima-principale
          path: app/build/screenshots/
          retention-days: 1
          if-no-files-found: ignore
      - name: Verifica interfaccia su iPhone compatto
        timeout-minutes: 25
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild test -test-timeouts-enabled YES -default-test-execution-time-allowance 300 -maximum-test-execution-time-allowance 600 -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$COMPACT" -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testFourSectionsInBothThemes -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testCalendarEventCanBeCreatedAfterBoundaryScroll -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testLargeTextAndSixWeekCalendar -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeSummaryAndVerticalRoutinesInBothThemes -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testCalendarSelectionUpdatesImmediatelyAndKeepsEventIndex -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeEmptyStatesRemainActionable -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeManyEventsAndTasksStayBoundedAndReachable -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testSharedRowsAndCategoryChoicesKeepAccessibleTargets -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testNavigationKeepsSelectionAndGeometryWhenChangingTabs -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testFinanceOverviewSupportsLargeTextAndEmptySnapshot -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeRestoresNeutralNextTimeWithoutArabicNames -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testReducedMotionKeepsChecklistAndFinanceActionsFunctional -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testCalendarTodayRestoresMonthAndSelection -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testNativeToolbarRespondsAcross44PointTouchRegion -resultBundlePath build/Compact.xcresult CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compact.log
      - name: Esporta schermate del simulatore
        if: always()
        continue-on-error: true
        working-directory: app
        run: |
          if [ -d build/Compact.xcresult ]; then
            xcrun xcresulttool export attachments --path build/Compact.xcresult --output-path build/compact-screenshots
          fi
      - name: Crea una sola IPA per iPhone
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild archive -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -configuration Release -destination 'generic/platform=iOS' -archivePath build/LifeOS.xcarchive CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/archive.log
          test -d build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app
          python3 - <<'PYWIDGET'
          import pathlib, plistlib
          app = pathlib.Path('build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app')
          extension = app / 'PlugIns/LifeOSDayWidget.appex'
          assert extension.is_dir(), 'Estensione widget assente dall’app archiviata'
          main = plistlib.loads((app/'Info.plist').read_bytes())
          widget = plistlib.loads((extension/'Info.plist').read_bytes())
          assert widget['NSExtension']['NSExtensionPointIdentifier'] == 'com.apple.widgetkit-extension'
          assert widget['CFBundleIdentifier'] == main['CFBundleIdentifier'] + '.widget'
          assert widget['CFBundleVersion'] == main['CFBundleVersion']
          assert any('lifeos' in entry.get('CFBundleURLSchemes', []) for entry in main['CFBundleURLTypes'])
          print('WIDGET_EMBEDDED_AND_VERSIONED_OK')
          PYWIDGET
          mkdir -p build/Payload download
          cp -R build/LifeOS.xcarchive/Products/Applications/LifeOSProbe.app build/Payload/
          cd build
          zip -qr ../download/LifeOS-unsigned.ipa Payload
          cd ../download
          shasum -a 256 LifeOS-unsigned.ipa > SHA256.txt
      - name: Errori XCTest in annotazioni
        if: always()
        working-directory: app
        run: |
          python3 - <<'PYLOG'
          import pathlib, re
          for name in ['compile.log', 'focused-tests.log', 'tests.log', 'compact.log', 'archive.log']:
              path = pathlib.Path('build') / name
              if not path.exists(): continue
              lines = path.read_text(errors='replace').splitlines()
              errors = [line for line in lines if re.search(r'\.swift:\d+(?::\d+)?: error:|^xcodebuild: error:', line) or ('Test Case ' in line and ' failed ' in line)]
              for line in errors[:12]:
                  message = line.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::error::' + message)
              outcomes = list(dict.fromkeys(match.group(0) for line in lines if (match := re.search(r'Executed \d+ tests, with \d+ failures(?: \(\d+ unexpected\))?', line))))
              for outcome in outcomes[-3:]:
                  print('::notice::' + name + ': ' + outcome.replace('%', '%25'))
              if not errors and lines:
                  tail = next((line for line in reversed(lines) if line.strip()), '')
                  print('::notice::Ultima riga ' + name + ': ' + tail[:900].replace('%', '%25'))
          PYLOG
      - name: Schermate della demo per revisione visiva
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-anteprima
          path: |
            app/build/screenshots/*.png
            app/build/screenshots/manifest.json
            app/build/compact-screenshots/*.png
            app/build/compact-screenshots/manifest.json
          retention-days: 1
          if-no-files-found: ignore
      - name: IPA unica per Signulous
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-IPA-per-Signulous
          path: app/download/
          retention-days: 7
          if-no-files-found: error
      - name: Log e risultati anche in caso di errore
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: LifeOS-diagnostica
          path: |
            app/build/*.log
            app/build/Tests.xcresult
            app/build/Focused.xcresult
            app/build/Compact.xcresult
          retention-days: 1
          if-no-files-found: ignore
