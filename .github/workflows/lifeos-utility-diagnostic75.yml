name: LifeOS 75 synthetic UI diagnostic
on:
  push:
    paths: ['.github/workflows/lifeos-utility-diagnostic75.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: validation75-ios27
          run-id: 41544986385
          github-token: ${{ github.token }}
          path: diagnostic
      - name: Inspect failed synthetic chart UI attachments
        run: |
          RESULT=$(find diagnostic -name Validation.xcresult -type d | head -1)
          test -n "$RESULT"
          xcrun xcresulttool export attachments --path "$RESULT" --output-path screenshots
          python3 - <<'PY'
          import json,pathlib,base64,subprocess,plistlib
          root=pathlib.Path('screenshots')
          def strings(node):
              if isinstance(node,dict):
                  for value in node.values():yield from strings(value)
              elif isinstance(node,list):
                  for value in node:yield from strings(value)
              elif isinstance(node,str):yield node
          def matches(node):
              if isinstance(node,dict):
                  if any('testHealthChartsAllowVerticalScrollAndNativeSelection' in v for v in node.values() if isinstance(v,str)):yield node
                  else:
                      for value in node.values():yield from matches(value)
              elif isinstance(node,list):
                  for value in node:yield from matches(value)
          manifest=json.loads((root/'manifest.json').read_text())
          paths=[]
          for match in matches(manifest):
              for value in strings(match):
                  if (root/value).is_file() and value not in paths:paths.append(value)
          print('SYNTHETIC_ATTACHMENTS',paths)
          print('SYNTHETIC_ATTACHMENT_TYPES',[(n,subprocess.check_output(['file','-b',str(root/n)],text=True).strip()) for n in paths[:16]])
          def is_image(name):
              data=(root/name).read_bytes()[:16]
              return data.startswith(b'\x89PNG') or data.startswith(b'\xff\xd8') or b'ftypheic' in data
          for name in paths:
              p=root/name
              if p.read_bytes().startswith(b'bplist'):
                  doc=plistlib.loads(p.read_bytes()); objects=doc.get('$objects',[])
                  def resolve(v,seen=frozenset()):
                      if isinstance(v,plistlib.UID):
                          if v.data in seen:return '<cycle>'
                          return resolve(objects[v.data],seen|{v.data})
                      if isinstance(v,dict):
                          if 'NS.keys' in v and 'NS.objects' in v:
                              return {str(resolve(k,seen)):resolve(x,seen) for k,x in zip(v['NS.keys'],v['NS.objects'])}
                          return {k:resolve(x,seen) for k,x in v.items() if k!='$class'}
                      if isinstance(v,list):return [resolve(x,seen) for x in v]
                      if isinstance(v,bytes):return {'bytes':len(v)}
                      return v
                  tree=resolve(doc.get('$top',doc))
                  def find(v):
                      if isinstance(v,dict):
                          if any('health-weight-chart' in str(x) or 'health-weight-selection' in str(x) for x in v.values() if isinstance(x,str)):print('CHART_AX_NODE',json.dumps(v,default=str)[:10000])
                          for x in v.values():find(x)
                      elif isinstance(v,list):
                          for x in v:find(x)
                  find(tree)
                  print('CHART_ARCHIVE_KEYS',list(doc),str(tree)[:2000])
          videos=[root/n for n in paths if pathlib.Path(n).suffix=='.mp4']
          if videos:
              pathlib.Path('/tmp/chart-frame.swift').write_text('import AVFoundation\nimport AppKit\nlet asset=AVURLAsset(url:URL(fileURLWithPath:CommandLine.arguments[1]))\nlet generator=AVAssetImageGenerator(asset:asset)\ngenerator.appliesPreferredTrackTransform=true\nlet t=CMTime(seconds:max(0,asset.duration.seconds-5),preferredTimescale:600)\nlet img=try generator.copyCGImage(at:t,actualTime:nil)\nlet data=NSBitmapImageRep(cgImage:img).representation(using:.png,properties:[:])!\ntry data.write(to:URL(fileURLWithPath:"chart-failure.png"))\n')
              subprocess.run(['swift','/tmp/chart-frame.swift',str(videos[0])],check=True)
              (root/'chart-failure.png').write_bytes(pathlib.Path('chart-failure.png').read_bytes());paths.insert(0,'chart-failure.png')
          selected=[p for p in paths if is_image(p)][:4]+[p for p in paths if pathlib.Path(p).suffix=='.txt'][:1]
          for index,name in enumerate(selected):
              p=root/name
              if is_image(name):
                  subprocess.run(['sips','-s','format','png','-Z','1100',str(p),'--out','preview.png'],check=True)
                  data=base64.b64encode(pathlib.Path('preview.png').read_bytes()).decode()
                  print('QA_IMAGE_START utility-'+str(index))
                  for i in range(0,len(data),16000):print('QA_IMAGE_DATA '+data[i:i+16000])
                  print('QA_IMAGE_END utility-'+str(index))
              elif p.suffix.lower() in ['.txt','.json']:print(p.read_text(errors='replace')[:40000])
          if not paths:print(json.dumps(manifest)[:20000])
          PY
