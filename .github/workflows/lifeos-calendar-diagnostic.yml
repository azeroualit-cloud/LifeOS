name: LifeOS calendar diagnostic
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Existing run with LifeOS-diagnostica
        default: '41506255193'
        required: true
  push:
    paths: ['.github/workflows/lifeos-calendar-diagnostic.yml']
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: calendar-probe27
          run-id: ${{ inputs.run_id || '41506255193' }}
          github-token: ${{ github.token }}
          path: diagnostic
      - name: Export selected calendar preview
        run: |
          RESULT=$(find diagnostic -name Validation.xcresult -type d | head -1)
          test -n "$RESULT"
          xcrun xcresulttool export attachments --path "$RESULT" --output-path screenshots
          python3 - <<'PY'
          import json,pathlib,base64,subprocess
          root=pathlib.Path('screenshots')
          def strings(node):
              if isinstance(node,dict):
                  for value in node.values():yield from strings(value)
              elif isinstance(node,list):
                  for value in node:yield from strings(value)
              elif isinstance(node,str):yield node
          def matches(node):
              if isinstance(node,dict):
                  if any('testLargeTextAndSixWeekCalendar' in value for value in node.values() if isinstance(value,str)):
                      yield node
                  else:
                      for value in node.values():yield from matches(value)
              elif isinstance(node,list):
                  for value in node:yield from matches(value)
          manifest=json.loads((root/'manifest.json').read_text())
          paths=[]
          for match in matches(manifest):
              for value in strings(match):
                  if value.endswith('.png') and (root/value).is_file() and value not in paths:paths.append(value)
          print('DIAGNOSTIC_ATTACHMENTS',paths)
          for index,name in enumerate(paths[:6]):
              subprocess.run(['sips','-Z','1100',str(root/name),'--out','preview.png'],check=True)
              data=base64.b64encode(pathlib.Path('preview.png').read_bytes()).decode()
              print('QA_IMAGE_START preview-'+str(index))
              for i in range(0,len(data),16000): print('QA_IMAGE_DATA '+data[i:i+16000])
              print('QA_IMAGE_END preview-'+str(index))
          if not paths: print(json.dumps(manifest)[:20000])
          PY
