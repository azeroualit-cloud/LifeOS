name: Life OS - Piani, solo test
on:
  workflow_dispatch:
    inputs:
      focus:
        description: Ripeti tutti i controlli o il solo flusso fondo
        type: choice
        options: [all, fund, regressions, visual]
        default: all
  push:
    branches: ['feature/plans-v2', 'fix/platform-parity']
    paths: ['lifeos-native.zip', 'backend/plans/**/*.mjs', '.github/workflows/lifeos-plans-tests.yml']
permissions:
  contents: read
concurrency:
  group: plans-tests-${{ github.ref }}-${{ inputs.focus }}
  cancel-in-progress: false
jobs:
  server:
    if: inputs.focus != 'fund' && inputs.focus != 'visual'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test --test-isolation=none backend/plans/*.test.mjs
  ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode
        run: |
          python3 - <<'PY'
          import pathlib,re,os
          choices=[]
          for p in pathlib.Path('/Applications').glob('Xcode_*.app'):
            m=re.fullmatch(r'Xcode_([0-9.]+).app',p.name)
            if m and int(m[1].split('.')[0])>=26: choices.append((tuple(map(int,m[1].split('.'))),p))
          assert choices
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('DEVELOPER_DIR='+str(max(choices)[1]/'Contents/Developer')+'\n')
          PY
      - name: Unpack source
        run: |
          python3 - <<'PY'
          import zipfile,pathlib
          with zipfile.ZipFile('lifeos-native.zip') as z:
            assert all(not pathlib.PurePosixPath(n).is_absolute() and '..' not in pathlib.PurePosixPath(n).parts for n in z.namelist())
            z.extractall('app')
          PY
          cp verification/HealthChartVisualTests.swift app/UITests/
          python3 app/scripts/check-design-system.py
          brew install xcodegen
          cd app
          xcodegen generate
      - name: Select latest available iOS simulator
        timeout-minutes: 3
        working-directory: app
        run: |
          set -euo pipefail
          mkdir -p build
          xcrun simctl list devices available -j > build/devices.json
          python3 - <<'PY'
          import json,os,re
          data=json.load(open('build/devices.json'))
          runtimes=sorted((k for k in data['devices'] if 'iOS' in k),key=lambda k:tuple(map(int,re.findall(r'\d+',k))),reverse=True)
          devices=[d for runtime in runtimes for d in data['devices'][runtime] if d.get('isAvailable') and d['name'].startswith('iPhone')]
          assert devices
          preferred=devices[0]
          print('Simulator:',preferred['name'],preferred['udid'])
          with open(os.environ['GITHUB_ENV'],'a') as f:f.write('PLAN_SIMULATOR='+preferred['udid']+'\n')
          open('build/simulator-id','w').write(preferred['udid'])
          PY
      - name: Compile app and tests for simulator, without archive
        timeout-minutes: 15
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$PLAN_SIMULATOR" -derivedDataPath build/Derived CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/compile.log
      - name: Unit tests
        if: inputs.focus != 'fund'
        timeout-minutes: 10
        working-directory: app
        run: |
          set -euo pipefail
          UNIT_FILTERS="-only-testing:LifeOSProbeTests"
          if [ "${{ inputs.focus }}" = visual ]; then
            UNIT_FILTERS="-only-testing:LifeOSProbeTests/NativeHealthTests/testMaintenanceRecoversRecordedIntake"
          fi
          xcodebuild test-without-building -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$PLAN_SIMULATOR" -derivedDataPath build/Derived -resultBundlePath build/Unit.xcresult -parallel-testing-enabled NO $UNIT_FILTERS -test-timeouts-enabled YES -default-test-execution-time-allowance 60 -maximum-test-execution-time-allowance 90 CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/unit-tests.log
      - name: Plan flows and regressions, without IPA
        timeout-minutes: 20
        working-directory: app
        run: |
          set -euo pipefail
          if [ "${{ inputs.focus }}" = fund ]; then
            FILTERS="-only-testing:LifeOSProbeUITests/NativeInterfaceTests/testPlansFundCanEditFutureQuotaAndLinkAnExistingMovement"
          elif [ "${{ inputs.focus }}" = visual ]; then
            FILTERS="-only-testing:LifeOSProbeUITests/HealthChartVisualTests/testEntireHomeHealthChartIsVisible"
          elif [ "${{ inputs.focus }}" = regressions ]; then
            FILTERS="-only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHealthChartTransitionAndFinanceMonthRoundTrip -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testAnalysisShowsFourChartsAndCategoryPeriods"
          else
            FILTERS="-only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHabitIntervalAndWeekdaySchedulingPersistInManagement -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHomeHealthCardRemainsCompactAndOpensDetail -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testPlansInfoAndMonthOnlyAdvanceFlow -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testPlansGoalPaymentWithOptionalOverageRecovery -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testPlansFundCanEditFutureQuotaAndLinkAnExistingMovement -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testHealthScenarioCanBeEditedWithoutAddingNavigationTab -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testAnalysisShowsFourChartsAndCategoryPeriods -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testExtraActualPaymentUsesSavingsAndKeepsMonthlyBudget -only-testing:LifeOSProbeUITests/NativeInterfaceTests/testNegativeBudgetAndGroupedAmounts"
          fi
          xcodebuild test-without-building -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$PLAN_SIMULATOR" -derivedDataPath build/Derived -resultBundlePath build/Plans.xcresult -parallel-testing-enabled NO $FILTERS -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 240 CODE_SIGNING_ALLOWED=NO 2>&1 | tee build/plans-tests.log
      - name: Verification summary
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          log=Path('app/build/plans-tests.log')
          if log.exists():
            text=log.read_text(errors='replace')
            for line in text.splitlines():
              if re.search(r'error:|failed|Executed .* tests|Test Suite .*passed|TEST SUCCEEDED',line):print(line[:1000])
          PY
      - name: Export interface screenshots
        if: always()
        run: |
          if [ -d app/build/Plans.xcresult ]; then
            xcrun xcresulttool export attachments --path app/build/Plans.xcresult --output-path app/build/screenshots || true
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Plans-test-results-no-IPA
          path: |
            app/build/Plans.xcresult
            app/build/Unit.xcresult
            app/build/plans-tests.log
            app/build/unit-tests.log
            app/build/compile.log
            app/build/devices.json
            app/build/screenshots
          retention-days: 7
