name: Debug palette large text spindumps
on:
  push:
    branches: [diagnostics/palette-91]
    paths: [.github/workflows/debug-palette91.yml]
permissions:
  actions: read
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print gate failure details
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: "43999971306"
        run: |
          set -euo pipefail
          name=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.name | startswith("lifeos-candidate91-diagnostics")) | .name' | head -1)
          gh run download "$RUN" -R "${{ github.repository }}" -n "$name" -D d
          find d -type f | head -50
          for f in $(find d -name '*.json' -o -name '*.txt'); do
            if grep -q -E "failureText|error:|failed" "$f"; then echo "=== $f"; python3 - "$f" <<'PY'
          import json,sys
          p=sys.argv[1]
          try:
              s=json.load(open(p))
          except Exception:
              print(open(p).read()[:6000]); sys.exit()
          if isinstance(s,dict) and "testFailures" in s:
              for t in s["testFailures"]: print("FAIL", t.get("testIdentifierString"), "|", (t.get("failureText") or "")[:1500])
          PY
            fi
          done
          grep -rhoE "(Movimenti irraggiungibili|Spesa irraggiungibile|home-finance)[^\"]{0,400}" d | sort -u | head -20 || true
