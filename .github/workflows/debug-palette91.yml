name: Debug palette large text spindumps
on:
  push:
    branches: [diagnostics/palette-91]
    paths: [.github/workflows/debug-palette91.yml]
permissions:
  actions: read
  contents: read
jobs:
  tree:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Print finance diagnostic tree
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: "44024746135"
        run: |
          set -u
          sudo apt-get install -y zstd >/dev/null
          name=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.name | startswith("lifeos-development-preview")) | .name' | head -1)
          gh run download "$RUN" -R "${{ github.repository }}" -n "$name" -D art
          for f in $(find art -path '*xcresult/Data/data.*' -type f); do
            if head -c 4 "$f" | od -An -tx1 | grep -q "28 b5 2f fd"; then zstd -dqc "$f" > t 2>/dev/null || continue; else cp "$f" t; fi
            if grep -aq "FINANCE_DIAG_TREE" t; then
              echo "=== $f"
              grep -a -A20000 "FINANCE_DIAG_TREE" t | grep -a -E "^ *(→)?[A-Z][A-Za-z]+, 0x[0-9a-f]+, " | grep -a -v -E "^ *Other, 0x[0-9a-f]+, \{\{[^}]*\}\}$" | cut -c1-230 | head -150
              break
            fi
          done
