name: Debug palette large text spindumps
on:
  push:
    branches: [diagnostics/palette-91]
    paths: [.github/workflows/debug-palette91.yml]
permissions:
  actions: read
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print focused summary
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: "43992193382"
        run: |
          set -euo pipefail
          name=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.name | startswith("lifeos-development-diagnostics")) | .name' | head -1)
          gh run download "$RUN" -R "${{ github.repository }}" -n "$name" -D d
          cat d/failures-and-counts.txt || true
          python3 - <<'PY'
          import json
          s=json.load(open("d/summary.json"))
          print({k:v for k,v in s.items() if not isinstance(v,(list,dict))})
          for t in s.get("testFailures",[]): print("FAIL", t.get("testIdentifierString"), "|", (t.get("failureText") or "")[:400])
          PY
