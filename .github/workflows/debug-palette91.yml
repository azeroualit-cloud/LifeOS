name: Debug palette large text spindumps
on:
  push:
    branches: [diagnostics/palette-91]
    paths: [.github/workflows/debug-palette91.yml]
permissions:
  actions: read
  contents: read
jobs:
  spindumps:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - run: "43987674222"
            prefix: "lifeos-development-shift-render"
    steps:
      - name: Download artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name=$(gh api "repos/${{ github.repository }}/actions/runs/${{ matrix.run }}/artifacts" --jq '.artifacts[] | select(.name | startswith("${{ matrix.prefix }}")) | .name' | head -1)
          gh run download "${{ matrix.run }}" -R "${{ github.repository }}" -n "$name" -D art
          find art -maxdepth 2 | head -40
      - name: Print app main-thread stacks from every spindump
        run: |
          set -u
          sudo apt-get install -y zstd >/dev/null
          mkdir -p out
          n=0
          for f in $(find art -path '*xcresult/Data/data.*' -type f); do
            if head -c 4 "$f" | od -An -tx1 | grep -q "28 b5 2f fd"; then zstd -dqc "$f" > out/tmp 2>/dev/null || continue; else cp "$f" out/tmp; fi
            if grep -q "^Process: *LifeOSProbe \[" out/tmp 2>/dev/null; then
              n=$((n+1))
              echo "=================== $f"
              grep -m3 -E "^(Date/Time|Duration|Steps|Reason|Command):" out/tmp || true
              awk '/^Process: *LifeOSProbe \[/{p=1} p&&/^Process:/&&!/LifeOSProbe \[/{exit} p' out/tmp > out/app.txt || true
              awk '/^ *Thread 0x.*com.apple.main-thread/{m=1;next} /^ *Thread 0x/{m=0} m' out/app.txt > out/main.txt
              echo "--- app frames on main thread (max samples per symbol)"
              grep -E "LifeOSProbe.debug.dylib" out/main.txt | sed -E 's/^ *([0-9]+) +(.*) \(([^()]*) in LifeOSProbe.debug.dylib.*/\1|\3|\2/' \
                | awk -F'|' '{ if (!($3 in best) || $1+0 > best[$3]+0) best[$3]=$1"|"$2 } END { for (k in best) print best[k]"|"k }' | sort -t'|' -k1,1nr | cut -c1-260 | head -60
              echo "--- SwiftUI/UIKit hot symbols on main thread"
              sed -E 's/^ *([0-9]+) +(.*) \(([A-Za-z.]+) \+ [0-9]+\).*/\1|\3|\2/' out/main.txt | grep -E '^[0-9]+\|' \
                | grep -E 'Layout|Lazy|Scroll|Inset|Preference|Geometry|onChange|Animat|Transaction|Safe|Frame|Accessib|Observ|State|Binding|Text|Font|Size' \
                | awk -F'|' '{ if (!($3 in best) || $1+0 > best[$3]+0) best[$3]=$1"|"$2 } END { for (k in best) print best[k]"|"k }' | sort -t'|' -k1,1nr | cut -c1-220 | head -70
              echo "--- leaf frames"
              awk '{print}' out/main.txt | sed -E 's/^( *)([0-9]+) +(.*)/\2|\3/' | grep -E '^[0-9]+\|' | cut -c1-200 | tail -n +1 | awk -F'|' '{c[$2]+=$1} END{for(k in c) print c[k]"|"k}' | sort -t'|' -k1,1nr | head -25
            fi
          done
          echo "spindumps found: $n"
