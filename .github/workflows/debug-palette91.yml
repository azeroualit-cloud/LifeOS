name: Debug palette large text spindumps
on:
  push:
    branches: [diagnostics/palette-91]
    paths: [.github/workflows/debug-palette91.yml]
permissions:
  actions: read
  contents: read
jobs:
  summary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Print gate failure details
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: "43999971306"
        run: |
          set -euo pipefail
          name=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN/artifacts" --jq '.artifacts[] | select(.name | startswith("lifeos-candidate91-diagnostics")) | .name' | head -1)
          gh run download "$RUN" -R "${{ github.repository }}" -n "$name" -D d
          for f in d/regression-tests.log d/preflight-tests.log; do
            echo "=================== $f"
            grep -n -E "error: -\[|Test Case .*(failed|started)|Tap \"home-finance|finance-scroll|other-back|Movimenti|primary-add|all-movements|Assertion Failure" "$f" | cut -c1-600 | grep -B3 -A25 -E "testCalendarReturnsToDashboardAndFinanceOpens\]' started|testFinanceOverviewSupportsLargeTextAndEmptySnapshot\]' started" | head -120 || true
          done
          grep -n -E "error: -\[" d/preflight-tests.log | head || true
