name: Life OS - Worker Raw sincronizzato
on:
  workflow_dispatch:
  push:
    paths: ['worker.js', 'backend/worker/**', 'backend/plans/**', 'shared/**', 'scripts/platform-contract.py', 'lifeos-native.zip', '.github/workflows/lifeos-worker.yml']
  pull_request:
    paths: ['worker.js', 'backend/worker/**', 'backend/plans/**', 'shared/**', 'scripts/platform-contract.py', 'lifeos-native.zip', '.github/workflows/lifeos-worker.yml']
permissions:
  contents: read
jobs:
  verify-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Reject stale Worker bundles
        run: node backend/worker/build.mjs --check
      - name: Verify the iOS and web contract and identical forecast models
        run: |
          python3 -m zipfile -e lifeos-native.zip work/native
          python3 scripts/platform-contract.py --check
          python3 scripts/generate-demo.py --check
          node --test backend/worker/finance-model.test.mjs backend/worker/local-model.test.mjs backend/worker/weight-transfer.test.mjs backend/worker/habits.test.mjs
      - name: Validate editor compatibility
        run: npx --yes --package typescript@5.9.3 tsc --allowJs --checkJs --noEmit --target es2022 --module esnext --lib es2022,webworker worker.js
      - name: Test the actual deliverable, including D1 integration
        env:
          LIFEOS_PRIVATE_WORKER: ${{ github.workspace }}/worker.js
        run: node --test --test-isolation=none backend/plans/*.test.mjs
      - name: Install browser for web regressions
        run: |
          npm install --prefix "$RUNNER_TEMP/lifeos-web" --no-save playwright@1.56.1
          "$RUNNER_TEMP/lifeos-web/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify actual embedded web interface on desktop and mobile
        env:
          LIFEOS_PLAYWRIGHT_MODULE: ${{ runner.temp }}/lifeos-web/node_modules/playwright/index.mjs
          LIFEOS_WEB_SCREENSHOTS: ${{ runner.temp }}/lifeos-web/screenshots
        run: |
          node backend/worker/plans-web.test.mjs
          node backend/worker/platform-parity.test.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: worker-web-screenshots
          path: ${{ runner.temp }}/lifeos-web/screenshots
          if-no-files-found: ignore
      - name: Publish verified copy and checksum
        run: sha256sum worker.js > worker.js.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: worker-js-verified
          path: |
            worker.js
            worker.js.sha256
