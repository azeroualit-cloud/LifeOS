name: LifeOS screen tour
# Build 95 review loop: compile and photograph every main screen in dark and light mode.
# Never packages or releases; the screenshots are the review material for the user.
on:
  push:
    branches: ['codex/build93']
    paths: ['native-next/**', '.github/workflows/lifeos-screens.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lifeos-screens-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tour:
    if: ${{ !contains(github.event.head_commit.message, '[no-tour]') }}
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/native-compat76
        with:
          variant: primary
      - name: Compile
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/tour-compile.log 2>&1 || {
            grep -E "error:" build/tour-compile.log | sed -E 's#^/Users/runner/work/[^ ]*/##' | sort -u | head -n 20 | while IFS= read -r line; do echo "::error title=Compilazione::${line:0:900}"; done
            tail -n 60 build/tour-compile.log; exit 1; }
      - name: Photograph every screen
        working-directory: app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          xcodebuild test-without-building -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -only-testing:LifeOSProbeUITests/NativeScreenTourUITests -resultBundlePath build/Tour.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/tour-tests.log 2>&1 || { grep -E "error: -\[" build/tour-tests.log | head -n 10 || true; }
      - name: Export screenshots
        if: ${{ !cancelled() }}
        run: |
          if [ -f app/build/Tour.xcresult/Info.plist ]; then
            xcrun xcresulttool export attachments --path app/build/Tour.xcresult --output-path app/build/tour-screens
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lifeos-screens-${{ github.sha }}
          retention-days: 7
          path: |
            app/build/tour-screens
            app/build/tour-*.log
