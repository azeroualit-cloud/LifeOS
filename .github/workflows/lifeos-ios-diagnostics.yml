name: LifeOS iOS calendar and Health reference diagnostics
on:
  workflow_dispatch:
    inputs:
      test_case:
        description: Diagnostic test to run
        type: choice
        options: [health, calendar]
        default: health
        required: true
permissions:
  contents: read
concurrency:
  group: lifeos-ios-diagnostics-${{ github.ref }}
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 40
    env:
      DIAGNOSTIC_CASE: ${{ inputs.test_case }}
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/native-compat76
        with:
          variant: primary
      - name: Compile simulator app and tests
        working-directory: app
        run: |
          set -euo pipefail
          xcodebuild build-for-testing -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/ios-diagnostics-build.log 2>&1 || { tail -n 100 build/ios-diagnostics-build.log; exit 1; }
      - name: Run selected diagnostic test
        working-directory: app
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$MAIN_DEVICE" -b
          case "$DIAGNOSTIC_CASE" in
            calendar) selector='LifeOSProbeUITests/NativeInterfaceTests/testCalendarEventCanBeCreatedAfterBoundaryScroll' ;;
            health) selector='LifeOSProbeUITests/NativeAppleHealthReferenceUITests/testCaptureAppleHealthReference' ;;
            *) printf 'Unsupported diagnostic case: %s\n' "$DIAGNOSTIC_CASE" >&2; exit 1 ;;
          esac
          printf 'Diagnostic case: %s\nUI selector: %s\n' "$DIAGNOSTIC_CASE" "$selector"
          result=0
          if [ "$DIAGNOSTIC_CASE" = calendar ]; then
            # Separate invocation ensures the unit target is not lost among UI selectors.
            if ! xcodebuild test-without-building -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 420 -only-testing:LifeOSProbeTests/NativeActivityTests -resultBundlePath build/IOSDiagnosticsUnit.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/ios-diagnostics-unit.log 2>&1; then
              tail -n 120 build/ios-diagnostics-unit.log
              result=1
            fi
          fi
          if ! xcodebuild test-without-building -derivedDataPath simulator-build -project LifeOSProbe.xcodeproj -scheme LifeOSProbe -destination "platform=iOS Simulator,id=$MAIN_DEVICE" -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 420 "-only-testing:$selector" -resultBundlePath build/IOSDiagnostics.xcresult CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- > build/ios-diagnostics-tests.log 2>&1; then
            tail -n 120 build/ios-diagnostics-tests.log
            result=1
          fi
          exit "$result"
      - name: Export test diagnostics
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -u
          mkdir -p app/build/ios-diagnostics
          if [ -f app/build/IOSDiagnostics.xcresult/Info.plist ]; then
            for kind in summary tests; do
              if xcrun xcresulttool get test-results "$kind" --path app/build/IOSDiagnostics.xcresult > "app/build/ios-diagnostics/$kind.json.tmp" 2> "app/build/ios-diagnostics/$kind-error.txt"; then
                mv "app/build/ios-diagnostics/$kind.json.tmp" "app/build/ios-diagnostics/$kind.json"
                rm "app/build/ios-diagnostics/$kind-error.txt"
              else
                rm -f "app/build/ios-diagnostics/$kind.json.tmp"
              fi
            done
            xcrun xcresulttool export attachments --path app/build/IOSDiagnostics.xcresult --output-path app/build/ios-diagnostics-attachments > app/build/ios-diagnostics-export.log 2>&1 || true
          else
            printf 'UI result bundle unavailable or incomplete.\n' > app/build/ios-diagnostics/missing-result.txt
          fi
          if [ "$DIAGNOSTIC_CASE" = calendar ]; then
            if [ -f app/build/IOSDiagnosticsUnit.xcresult/Info.plist ]; then
              if ! xcrun xcresulttool get test-results summary --path app/build/IOSDiagnosticsUnit.xcresult > app/build/ios-diagnostics/unit-summary.json 2> app/build/ios-diagnostics/unit-summary-error.txt; then
                rm -f app/build/ios-diagnostics/unit-summary.json
              fi
            else
              printf 'Unit result bundle unavailable or incomplete.\n' > app/build/ios-diagnostics/missing-unit-result.txt
            fi
          fi
          {
            printf '## LifeOS iOS diagnostics\n\nCommit: `%s` · Run: `%s`\n\n' "$GITHUB_SHA" "$GITHUB_RUN_ID"
            printf 'Selected case: `%s`. Simulator evidence; no IPA, release or deploy.\n\n' "$DIAGNOSTIC_CASE"
            for log in app/build/ios-diagnostics-unit.log app/build/ios-diagnostics-tests.log; do
              if [ -f "$log" ]; then
                printf 'Failures and counts in `%s` (complete log in artifact):\n\n```text\n' "$log"
                grep -E 'error:|Test Case .*failed|Executed [0-9]+ tests?, with [0-9]+ failures?' "$log" || true
                printf '\n```\n'
              elif [ "$log" = app/build/ios-diagnostics-tests.log ] || [ "$DIAGNOSTIC_CASE" = calendar ]; then
                printf 'Expected log `%s` unavailable; test may not have started.\n' "$log"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: lifeos-ios-diagnostics-${{ github.sha }}-${{ github.run_attempt }}
          retention-days: 7
          path: |
            app/build/ios-diagnostics-*.log
            app/build/ios-diagnostics
            app/build/ios-diagnostics-attachments
            app/build/IOSDiagnostics.xcresult
            app/build/IOSDiagnosticsUnit.xcresult
