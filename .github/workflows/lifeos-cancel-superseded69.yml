name: Stop superseded Life OS check
on:
  push:
    paths: ['.github/workflows/lifeos-cancel-superseded69.yml']
permissions:
  actions: write
jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Stop only the superseded build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api --method POST repos/azeroualit-cloud/LifeOS/actions/runs/41074975622/force-cancel
