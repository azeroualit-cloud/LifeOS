name: LifeOS site category tools 96 (audit, deploy)
# CATEGORY-TOOLS-96 (26/11/2026: «Sposta ... nulla è stato spostato», D1 daily limit at 91 %). Site Worker `lifeos`
# only (DEPLOY-WORKERS-93): first the two server methods, then the site page from codex/revision77 at a pinned
# commit, one after the other in the same job so the two uploads never overwrite each other. Both start from the
# live module, write nothing if their anchors are not found exactly once, verify the upload and roll back on failure.
# A push that changes this file is the deliberate start.
# Attempt 1
on:
  push:
    branches: ['codex/build93']
    paths: ['.github/workflows/lifeos-category-tools96.yml']
concurrency:
  group: lifeos-site-deploy93
  cancel-in-progress: false
permissions:
  contents: read
env:
  SITE_COMMIT: 2f9813ec148db74392a7c5c060f7907f4d067165
jobs:
  deploy:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.ref == 'refs/heads/codex/build93'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Site page and diary from the pinned site commit
        run: |
          set -euo pipefail
          git fetch --quiet origin +refs/heads/codex/revision77:refs/remotes/origin/codex/revision77
          git merge-base --is-ancestor "$SITE_COMMIT" origin/codex/revision77
          mkdir -p site
          git show "$SITE_COMMIT:web/app.html" > site/app.html
          git show "$SITE_COMMIT:web/life-api.js" | python3 -c "import sys; t=sys.stdin.read(); i=t.index('let ndReady = null;'); sys.stdout.write(t[i:])" > site/diary.js
          python3 - <<'PY'
          import re, pathlib
          html = pathlib.Path('site/app.html').read_text(encoding='utf-8')
          assert 'getFinanceCategoryUsage' in html and 'moveFinanceCategory' in html
          for i, script in enumerate(re.findall(r'<script[^>]*>(.*?)</script>', html, re.S)):
              pathlib.Path(f'/tmp/ui-{i}.js').write_text(script, encoding='utf-8')
          PY
          for f in /tmp/ui-*.js; do node --check "$f"; done
          echo "SITE_SOURCE_READY commit=$SITE_COMMIT"
      - name: Check the live site Worker (no writes)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: |
          python3 scripts/deploy-category-tools-96.py
          python3 scripts/deploy-site-93.py
      - name: Add the category methods to lifeos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-category-tools-96.py
      - name: Update the site page on lifeos
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-site-93.py
