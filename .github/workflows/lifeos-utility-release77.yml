name: LifeOS deploy current-month utility budget correction
on:
  push:
    branches: ['codex/revision77']
    paths: ['.github/workflows/lifeos-utility-release77.yml']
permissions:
  contents: read
concurrency:
  group: lifeos-utility-code-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify exact synthetic implementation before deployment
        env:
          LIFEOS_UTILITY_WORKER: manual/build-75/worker.js
          LIFEOS_ROUTING_WORKER: manual/build-75/worker.js
          LIFEOS_ACTIVITY_WORKER: manual/build-75/worker.js
        run: |
          python3 scripts/build-worker-68.py
          python3 scripts/build-worker-70.py
          python3 scripts/build-worker-75.py
          python3 backend/utilities/tests/test_transform.py
          node backend/utilities/tests/competence.test.mjs
          node backend/utilities/tests/budget.test.mjs
          node backend/utilities/tests/routing.test.mjs
          node backend/expense-routing/tests/routing.test.mjs
          node backend/activities/tests/worker.test.mjs
      - name: Recheck live context without writes or financial queries
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_BACKEND_AUDIT_ONLY: '1'
        run: python3 scripts/deploy-utilities-75.py
      - name: Deploy only guarded LifeOS source changes and verify exact content
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/deploy-utilities-75.py
