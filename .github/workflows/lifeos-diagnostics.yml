name: Life OS - Diagnosi sincronizzazione
on:
  workflow_dispatch:
  push:
    paths: ['scripts/diagnose-lifeos.py', '.github/workflows/lifeos-diagnostics.yml']
permissions:
  contents: read
jobs:
  diagnose:
    if: github.repository == 'azeroualit-cloud/LifeOS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Confronto privato e misure API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          LIFEOS_TEST_PASSWORD: ${{ secrets.LIFEOS_TEST_PASSWORD }}
          CLOUDFLARE_ACCOUNT_ID: '1728c3b1b852eb6285646842db7256de'
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: python3 scripts/diagnose-lifeos.py
