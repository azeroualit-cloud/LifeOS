name: Debug build 92 failures
on:
  push:
    branches: [diagnostics/build92]
    paths: [.github/workflows/debug-build92.yml]
permissions:
  actions: read
  contents: write
jobs:
  failures:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Extract failure lines into the branch
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: "44215021291"
        run: |
          set -u
          rm -rf diag; mkdir -p diag
          gh api "repos/${{ github.repository }}/actions/runs/$RUN/artifacts" --jq '.artifacts[].name' > diag/artifacts.txt
          for name in $(cat diag/artifacts.txt); do gh run download "$RUN" -R "${{ github.repository }}" -n "$name" -D "art/$name" || true; done
          find art -maxdepth 4 | head -80 > diag/tree.txt
          for f in $(find art -name '*.log' -o -name '*failure*.txt' -o -name '*.md' | head -40); do
            echo "=== $f" >> diag/logs.txt
            grep -a -n -B40 -E "error: -\[" "$f" | grep -a -v -E "^[0-9]+-\s*$" | cut -c1-260 | head -900 >> diag/logs.txt; grep -a -h -E "error: -\[|Executed [0-9]+ tests|failed \(" "$f" | head -40 >> diag/summary.txt
          done
          for f in $(find art -name 'failures-and-counts.txt' -o -name 'final-tests.log' -o -name 'regression-tests.log' -o -name 'preflight-summary.json'); do echo "=== TAIL $f" >> diag/tails.txt; tail -n 40 "$f" | cut -c1-300 >> diag/tails.txt; done
          git config user.name lifeos-diag; git config user.email diag@lifeos.invalid
          rm -f diag/logs.txt.old; git add -A diag && git commit -m "Build 92 failure lines [diagnostics]" && git push origin HEAD:diagnostics/build92
