name: Independently verify public IPA 76 and synthetic Release screenshots
on:
  push:
    paths: ['.github/workflows/lifeos-public-proof76.yml']
permissions:
  contents: read
  actions: read
jobs:
  proof:
    if: contains(github.event.head_commit.message, '[public-proof-76]')
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5
      - name: Wait for all compatibility tests and delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run watch 41612277726 --repo azeroualit-cloud/LifeOS --exit-status --interval 30
      - name: Download the public IPA and independently verify it
        run: |
          set -euo pipefail
          mkdir public76
          cd public76
          curl -fLsS https://github.com/azeroualit-cloud/LifeOS/releases/download/ios-0.10.15-build76/LifeOS-76.ipa -o LifeOS-76.ipa
          curl -fLsS https://github.com/azeroualit-cloud/LifeOS/releases/download/ios-0.10.15-build76/SHA256.txt -o SHA256.txt
          sha256sum -c SHA256.txt
          python3 ../scripts/verify-native-package.py LifeOS-76.ipa --version 0.10.15 --build 76
          python3 ../scripts/verify-startup-imports.py LifeOS-76.ipa
          cat SHA256.txt
          echo PUBLIC_IPA_76_DOWNLOAD_VERIFIED
      - name: Retrieve synthetic Release visual evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 41612277726 --repo azeroualit-cloud/LifeOS --name LifeOS-76-primary --dir evidence76
      - name: Export four synthetic startup screenshots for review
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import io,base64
          for name in ['fresh','synthetic-upgrade','synthetic-populated-upgrade','synthetic-session-upgrade']:
              files=list(Path('evidence76').rglob(name+'.png'));assert len(files)==1,(name,files)
              image=Image.open(files[0]);image.thumbnail((430,1000))
              out=io.BytesIO();image.save(out,format='PNG')
              data=base64.b64encode(out.getvalue()).decode()
              print('QA_IMAGE_START '+name)
              for i in range(0,len(data),4000):print('QA_IMAGE_DATA '+data[i:i+4000])
              print('QA_IMAGE_END '+name)
          PY
