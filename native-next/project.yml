name: LifeOSProbe
options:
  developmentLanguage: it
  bundleIdPrefix: com.nas.lifeos
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
targets:
  LifeOSProbe:
    type: application
    platform: iOS
    sources: [Sources, Assets.xcassets]
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: com.nas.lifeos.weight
            CFBundleTypeRole: Editor
            CFBundleURLSchemes: [lifeos]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nas.lifeos.probe
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_ENTITLEMENTS: LifeOS.entitlements
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: Life OS salva in Apple Health le pesate che inserisci, solo su tua richiesta.
        INFOPLIST_KEY_NSHealthShareUsageDescription: Life OS legge peso e calorie alimentari per mostrare andamento e scenari di peso, solo sul dispositivo.
        MARKETING_VERSION: '0.10.2'
        CURRENT_PROJECT_VERSION: '63'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Life OS
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    dependencies:
      - sdk: libsqlite3.tbd
      - sdk: HealthKit.framework
      - target: LifeOSWidget
        embed: true
  LifeOSWidget:
    type: app-extension
    platform: iOS
    sources: [Widget]
    info:
      path: WidgetInfo.plist
      properties:
        CFBundleDisplayName: Life OS Azioni rapide
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nas.lifeos.probe.quickactions
        MARKETING_VERSION: '0.10.2'
        CURRENT_PROJECT_VERSION: '63'
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
  LifeOSProbeTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: LifeOSProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  LifeOSProbeUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: LifeOSProbe
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LifeOSProbe:
    build:
      targets:
        LifeOSProbe: all
        LifeOSProbeTests: [test]
        LifeOSProbeUITests: [test]
    test:
      targets: [LifeOSProbeTests, LifeOSProbeUITests]
