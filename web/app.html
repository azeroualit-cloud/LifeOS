One design system owns layout and components. Finance and Life OS logic are preserved. -->

/* =====================================================================
   Life OS Web - design system v3
   Un solo foglio di stile. Struttura:
   1 token  2 base  3 componenti (button, field, card, row, chip, tab, modal)
   4 shell  5 viste  6 grafici/calendario  7 responsive
   Riferimento visivo: NativeDesign.swift (accento platino, superfici neutre,
   rosso/verde finanziari attenuati, un colore per sezione).
   ===================================================================== */

/* 1. TOKEN ----------------------------------------------------------- */
:root{
  color-scheme:dark;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  /* superfici */
  --canvas:#070708;--surface:#0e0e10;--surface-2:#141416;--surface-3:#1d1d21;
  --line:#1f1f23;--line-soft:#151518;
  /* testo */
  --ink:#e4e4e7;--ink-2:#a1a1a8;--ink-3:#6b6b73;
  /* interazione */
  --accent:#cfcfd3;--on-accent:#111113;--focus:#8fb0ff;
  /* semantica finanziaria (solo direzione) */
  --pos:#8cbaa1;--neg:#d4928f;--warn:#e0b574;
  /* colore di sezione */
  --sec-finance:#a3adbd;--sec-nutrition:#8de1b5;--sec-calendar:#f2ba87;--sec-neutral:var(--ink);
  --section:var(--sec-neutral);
  /* misure */
  --r-sm:6px;--r-md:10px;--r-lg:16px;--r-pill:999px;
  --s1:4px;--s2:6px;--s3:10px;--s4:16px;--s5:16px;--s6:26px;--s7:26px;--s8:42px;--s9:68px;
  --tap:36px;--gutter:20px;--sidebar:224px;--nav-h:68px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
  --shadow:0 1px 0 #ffffff08 inset;
  --t-fast:.14s;--t:.2s;
  /* alias per i moduli JS esistenti */
  --os-bg:var(--canvas);--os-panel:var(--surface);--os-panel-2:var(--surface-2);
  --os-accent:var(--accent);--os-focus:var(--focus);--muted:var(--ink-2);
  --green:var(--pos);--red:var(--neg);--blue:var(--accent);--card-radius:var(--r-lg);--space:var(--s4);
  font-family:var(--font);font-size:14px;line-height:1.45;
  background:var(--canvas);color:var(--ink);
}
html[data-theme="light"]{
  color-scheme:light;
  --canvas:#f2f2f7;--surface:#ffffff;--surface-2:#f0f0f4;--surface-3:#e4e4ea;
  --line:#dcdce2;--line-soft:#e9e9ee;
  --ink:#1b1b1f;--ink-2:#5e5e66;--ink-3:#8b8b93;
  --accent:#3b3b3b;--on-accent:#ffffff;--focus:#1a5fd1;
  --pos:#387354;--neg:#a14947;--warn:#9a6a1c;
  --sec-finance:#174dab;--sec-nutrition:#146647;--sec-calendar:#9a5a1f;
  --shadow:0 1px 2px #0000000a;
}
/* i colori dei turni mantengono il loro significato */
[data-kind="morning"]{--shift-color:#6191bd}[data-kind="afternoon"]{--shift-color:#659b72}
[data-kind="night"]{--shift-color:#666870}[data-kind="rest"]{--shift-color:#ce916d}
[data-kind="holiday"]{--shift-color:#d7bf52}
html[data-theme="light"] [data-kind="morning"]{--shift-color:#b4c6e7}
html[data-theme="light"] [data-kind="afternoon"]{--shift-color:#c6e0b4}
html[data-theme="light"] [data-kind="night"]{--shift-color:#8a8e9c}
html[data-theme="light"] [data-kind="rest"]{--shift-color:#f4b084}
html[data-theme="light"] [data-kind="holiday"]{--shift-color:#efd96a}

/* 2. BASE ------------------------------------------------------------ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--canvas);color:var(--ink)}
h1,h2,h3,p{margin:0}
h1{font-size:26px;line-height:1.15;letter-spacing:-.6px;font-weight:650}
h2{font-size:16px;line-height:1.3;letter-spacing:-.2px;font-weight:650}
h3{font-size:14px;line-height:1.35;font-weight:650}
small,.hint{font-size:14px;color:var(--ink-2)}
.hint{margin-top:var(--s3)}
b,strong{font-weight:650;font-variant-numeric:tabular-nums}
a{color:var(--focus)}
svg{display:block}svg:not([width]){max-width:100%}
summary{cursor:pointer;list-style:none}summary::-webkit-details-marker{display:none}
.hidden,[hidden]{display:none!important}
.view{display:none}.view.active{display:block}
.muted,.empty,.os-empty,.os-task-empty{color:var(--ink-2)}
.empty,.os-empty,.os-task-empty{padding:var(--s4) 0}
.income,.positive{color:var(--pos)}
.outgo,.outgoings,.negative,.danger{color:var(--neg)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

/* 3. COMPONENTI ------------------------------------------------------ */
/* 3.1 Bottoni - un solo sistema: .btn per default su ogni <button>.
   Varianti: primary (.save .primary), ghost (.ghost .os-button), icon, danger. */
button{
  font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;
  display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);
  min-height:var(--tap);padding:0 var(--s4);
  background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-md);
  font-weight:650;font-size:14px;line-height:1.2;
  transition:background-color var(--t-fast),opacity var(--t-fast),transform var(--t-fast),border-color var(--t-fast);
}
button:hover:not(:disabled){background:var(--surface-3)}
button:active:not(:disabled){transform:scale(.98);opacity:.8}
button:disabled{opacity:.4;cursor:default}
.save,.primary,.os-button.primary{background:var(--accent);color:var(--on-accent)}
.save:hover:not(:disabled),.primary:hover:not(:disabled),.os-button.primary:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.ghost,.os-button:not(.primary),.os-row-action,.extra-pay-action{background:transparent;color:var(--ink-2);font-weight:400}
.ghost:hover:not(:disabled),.os-button:not(.primary):hover:not(:disabled),.os-row-action:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.os-button:not(.primary),.os-row-action,.extra-pay-action{color:var(--section,var(--ink));}
.danger,.os-task-delete,.os-delete-completed{color:var(--neg);background:transparent}
.os-icon-button,.privacy-toggle,.os-wait,.os-drag-handle,.small-arrow,.theme-toggle,.fab-button,.movement-tools button{
  width:var(--tap);min-width:var(--tap);padding:0;border-radius:var(--r-pill);flex:none;background:transparent;color:var(--ink-2)}
.os-icon-button:hover:not(:disabled),.privacy-toggle:hover:not(:disabled),.os-wait:hover:not(:disabled),.small-arrow:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.theme-toggle,.fab-button{background:var(--surface-2);border:1px solid var(--line);color:var(--ink)}
.theme-toggle{font-size:19px;line-height:1}
.theme-toggle:hover:not(:disabled),.fab-button:hover:not(:disabled){background:var(--surface-3)}
.fab-button{color:var(--on-accent);background:var(--accent);border-color:transparent;font-size:22px}
.fab-button:hover:not(:disabled){background:var(--accent);filter:brightness(1.08)}
.fab-button svg,.privacy-toggle svg{width:22px;height:22px}
.os-drag-handle{width:28px;min-width:28px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.os-drag-handle svg{width:14px;height:22px}.os-wait{width:36px;min-width:36px}.os-wait svg{width:17px;height:19px}
.small-arrow{width:32px;min-width:32px;min-height:32px}
.movement-tools button{width:36px;min-width:36px;min-height:36px}.movement-tools svg{width:17px;height:17px}
.os-check{width:26px;min-width:26px;min-height:26px;height:26px;border:1.5px solid var(--ink-3);border-radius:50%;padding:0;background:transparent}
.os-check.checked{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.os-check.checked::after{content:"✓";font-size:14px}

/* 3.2 Campi */
input,select,textarea{
  font:inherit;color:var(--ink);display:block;width:100%;min-width:0;min-height:var(--tap);
  padding:10px var(--s3);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);
  transition:border-color var(--t-fast),box-shadow var(--t-fast);
}
textarea{min-height:92px;resize:vertical}
input::placeholder,textarea::placeholder{color:var(--ink-3)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--focus);box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 25%,transparent)}
input[type=checkbox]{width:20px;min-height:20px;height:20px;accent-color:var(--accent)}
label{font-size:14px;color:var(--ink-2)}

/* 3.3 Card e righe */
.card,.os-card,.extra-card,.overview-essential>section:not(.overview-flow),.overview-flow>div{
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);min-width:0;box-shadow:var(--shadow)}
.pad,.os-card,.extra-card{padding:var(--s4) var(--s5)}
.card-title,.os-topline,.overview-section-heading,.extra-card-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4);min-height:36px}
.card-title .actions,.actions,.chart-range{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.kv{display:grid;grid-template-columns:minmax(0,1fr) max-content;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line-soft);align-items:baseline}
.kv:last-child{border-bottom:0}.kv>span{min-width:0;overflow-wrap:anywhere;color:var(--ink-2)}
.kv>strong{white-space:nowrap;text-align:right}.kv.total>span{color:var(--ink);font-weight:650}
.plan-list-row,.finance-movement,.home-next-time,.home-habit{
  display:flex;justify-content:space-between;align-items:center;gap:var(--s4);width:100%;text-align:left;
  min-height:56px;padding:var(--s3) 0;background:transparent;border:0;border-bottom:1px solid var(--line-soft);border-radius:0;font-weight:400}
.plan-list-row:hover:not(:disabled),.finance-movement:hover:not(:disabled),.home-next-time:hover:not(:disabled),.home-habit:hover:not(:disabled){background:transparent;opacity:.85}
.plan-list-row>span:first-child,.finance-movement>span{min-width:0;overflow-wrap:anywhere}
.plan-list-row small,.finance-movement small{display:block;margin-top:2px}
.plan-list-row strong,.finance-movement>b{flex:none;white-space:nowrap}
.state-tag{font-size:12px;border-radius:var(--r-sm);background:var(--surface-2);padding:4px 10px;color:var(--ink-2)}
.errorbox{background:color-mix(in srgb,var(--neg) 12%,var(--surface));border:1px solid var(--neg);color:var(--neg);padding:var(--s3) var(--s4);border-radius:var(--r-md);margin-bottom:var(--s4)}
.due-badge{display:inline-block;font-size:12px;color:var(--ink-2);margin-left:var(--s2)}.due-badge.overdue{color:var(--neg)}

/* 3.4 Segmenti e schede */
.chart-range,.wealth-series{margin:var(--s2) 0 var(--s3)}
.finance-tabs,.os-category-tabs,.chart-range,.wealth-series{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:3px;background:var(--surface-2);border-radius:var(--r-md);width:max-content;max-width:100%}
.finance-tabs::-webkit-scrollbar,.os-category-tabs::-webkit-scrollbar{display:none}
.chart-range button,.wealth-series button,.os-category-tabs button{min-height:34px;padding:0 var(--s3);font-size:14px;background:transparent;color:var(--ink-2);border-radius:var(--r-sm);white-space:nowrap;flex:none}
.chart-range button.active,.wealth-series button.active,.os-category-tabs button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #0003}
.os-category-navigation{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s4)}
.os-category-navigation .os-category-tabs{margin:0;width:auto;flex:1;min-width:0}
.os-category-add,.os-category-tabs .add{width:34px;min-width:34px;padding:0;font-size:19px}
.finance-tabs:not(.hidden){background:transparent;padding:0;margin-bottom:var(--s4)}
.finance-tabs button{background:transparent;color:var(--section,var(--ink));padding:0 var(--s2) 0 0;font-weight:650;min-height:36px}
.finance-tabs button:hover:not(:disabled){background:transparent;opacity:.8}

/* 3.5 Dettagli ripiegabili */
details.card>summary,.budget-settings-wrap>summary,.annual-card>summary,.budget-history summary,.budget-calculation>summary{
  display:flex;align-items:center;justify-content:space-between;gap:var(--s3);min-height:28px;font-weight:650}
details>summary{display:flex;align-items:center;justify-content:space-between;gap:var(--s3)}
details>summary::after{content:"+";color:var(--ink-3);font-size:19px;line-height:1}
details[open]>summary::after{content:"−"}
.os-more-menu>summary::after,.os-event-options>summary::after,.os-home-times>summary::after,.os-tools-drawer>summary::after,.os-completed>summary::after{content:none}
.os-more-menu{position:relative}
.os-more-menu>summary{display:grid;place-items:center;width:var(--tap);height:var(--tap);border:1px solid var(--line);border-radius:50%;color:var(--ink-2);background:var(--surface-2)}
.os-more-menu>div{position:absolute;top:calc(var(--tap) + 6px);right:0;z-index:60;min-width:210px;padding:var(--s2);background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-md);box-shadow:0 14px 34px #0005}
.os-more-menu>div button{display:flex;justify-content:flex-start;width:100%;background:transparent;white-space:nowrap;font-size:14px}

/* 3.6 Modale: foglio dal basso su mobile, finestra centrata su desktop */
.modal-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:var(--s6);background:#000a;overflow-y:auto;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal{width:min(620px,100%);max-height:calc(100svh - 48px);overflow-y:auto;padding:var(--s6);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 30px 80px #0007}
.modal-top{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);margin-bottom:var(--s5)}
.modal-top h2{font-size:22px}
.os-form,.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.os-form label,.form-grid label{display:grid;gap:6px}
.os-form .wide,.form-grid .full,.form-grid .wide{grid-column:1/-1}
.form-actions,.os-form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s2)}
.form-actions{position:sticky;bottom:calc(-1 * var(--s6));padding:var(--s3) 0 0;background:linear-gradient(transparent,var(--surface) 28%);z-index:2}
.os-form-error{grid-column:1/-1;color:var(--neg);font-size:14px}
.loading-overlay{position:fixed;inset:0;z-index:120;display:grid;place-items:center;background:#0006}
.loading-panel{display:grid;gap:var(--s3);justify-items:center;padding:var(--s6) var(--s7);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg)}
.loading-spinner{width:26px;height:26px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* 4. SHELL ----------------------------------------------------------- */
.shell{display:grid;grid-template-columns:var(--sidebar) minmax(0,1fr);min-height:100svh}
.sidebar{position:sticky;top:0;height:100svh;display:flex;flex-direction:column;padding:var(--s6) var(--s3) var(--s5);background:var(--surface);border-right:1px solid var(--line-soft)}
.brand{display:flex;align-items:center;gap:10px;padding:0 var(--s3);margin-bottom:var(--s7);font-size:19px;font-weight:650;letter-spacing:-.3px}
.brand .mark,.brand .mark svg{width:26px;height:30px}
.nav{display:grid;gap:2px}
.nav button,#admin-link{justify-content:flex-start;gap:var(--s3);min-height:40px;padding:0 var(--s3);background:transparent;color:var(--ink-2);font-weight:400;font-size:14px;border-radius:var(--r-md)}
.nav button:hover:not(:disabled),#admin-link:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.nav button.active,#admin-link.active{background:var(--surface-2);color:var(--ink)}
.nav button.active .nav-symbol{color:var(--section-nav,var(--ink))}
.nav-symbol{width:20px;height:20px;flex:none}
.nav button[data-view=overview].active .nav-symbol{color:var(--sec-finance)}
.nav button[data-view=calendar].active .nav-symbol{color:var(--sec-calendar)}
.sidebar-foot{margin-top:auto;display:grid;gap:var(--s2)}
.sidebar-foot>span{padding:0 var(--s3);font-size:12px;color:var(--ink-3)}
#admin-link{font-size:14px}
main{width:100%;max-width:1240px;margin:0 auto;padding:var(--s7) var(--s8) 68px;min-width:0}
/* sezione corrente -> colore del titolo, come nell'app */
main:has(#overview.active,#budget.active,#analysis.active,#extras.active,#movements.active){--section:var(--sec-finance)}
main:has(#calendar.active){--section:var(--sec-calendar)}
main:has(#overview.active,#budget.active,#analysis.active,#extras.active,#movements.active) h1,
main:has(#calendar.active) h1{color:var(--section)}

/* intestazione di pagina: titolo a sinistra, azioni a destra, mese sotto */
.top{margin-bottom:var(--s6)}
.page-heading{display:flex;align-items:center;gap:var(--s3);min-height:var(--tap)}
.page-heading h1{flex:1;min-width:0;order:1}
.header-tools{order:2;display:flex;align-items:center;gap:var(--s2)}
.page-heading>.theme-toggle{order:3}
.page-actions{display:flex;gap:var(--s2)}.page-actions:empty{display:none}
.header-tools .page-fab{position:static}
.page-fab{position:fixed;right:var(--s6);bottom:var(--s6);z-index:35}
.header-tools .page-fab .fab-button{width:var(--tap);height:var(--tap);min-height:var(--tap)}
body:has(.modal-wrap:not(.hidden)) .page-fab{visibility:hidden}
.header-meta{margin-top:var(--s3)}
.home-context{display:none;color:var(--ink-2);font-size:14px}.dashboard-mode .home-context{display:block}
body:not(.dashboard-mode) .header-meta:has(.top-right.hidden){display:none}
.top-right{display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.sync{font-size:12px;color:var(--ink-3)}
/* selettore del mese: capsula con etichetta cliccabile */
.period{position:relative;display:inline-flex;align-items:center;gap:2px;padding:3px;background:var(--surface-2);border:1px solid var(--line-soft);border-radius:var(--r-pill)}
.period button{width:32px;min-width:32px;min-height:32px;padding:0;background:transparent;border-radius:50%;font-size:22px;color:var(--ink-2)}
.period strong{min-width:120px;text-align:center;font-size:14px;font-weight:650;text-transform:capitalize}
#period-pick{position:absolute;left:36px;right:36px;top:0;bottom:0;width:auto;min-height:0;height:100%;opacity:0;cursor:pointer;padding:0;border:0}

/* 5. VISTE ----------------------------------------------------------- */
/* 5.1 Dashboard */
.home-native{display:grid;gap:var(--s4);max-width:1100px;grid-template-columns:repeat(2,minmax(0,1fr));align-items:stretch}
.home-native>*{min-width:0}
.home-native>.os-card{display:flex;flex-direction:column;gap:var(--s2);padding:var(--s5)}
.home-native .card-title{margin:0 0 var(--s2)}
.home-native .card-title h2{font-size:16px;font-weight:650}
.dash-kpis{grid-column:1/-1;display:grid;align-items:stretch;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s4)}
.dash-kpi{display:grid;justify-content:stretch;align-self:stretch;align-content:start;justify-items:start;text-align:left;gap:4px;min-height:112px;height:auto;padding:var(--s4) var(--s5);background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);min-width:0}
.dash-kpi small{font-size:12px;font-weight:650;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-3)}
.dash-kpi strong{font-size:31px;font-weight:650;letter-spacing:-1px;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap}
.dash-kpi span{font-size:14px;color:var(--ink-2);line-height:1.3}
.dash-kpi.k-shift{border-top:3px solid var(--sh-morning,#6b9ac4)}.dash-kpi.k-money{border-top:3px solid var(--sec-finance)}.dash-kpi.k-tasks{border-top:3px solid var(--sec-tasks,var(--ink-3))}.dash-kpi.k-sun{border-top:3px solid var(--sh-afternoon,#659b72)}.dash-kpi.k-weather{border-top:3px solid var(--sh-holiday,#d7bf52)}.dash-kpi.k-habits{border-top:3px solid var(--sec-habits,var(--ink-3))}
.dash-kpi:hover:not(:disabled):not([aria-disabled]){background:var(--surface-2)}
.dash-kpi[aria-disabled]{cursor:default}
/* recap */
.home-recap-card .hint{margin:0;font-size:14px}
.home-recap-card .card-title .hint{color:var(--ink-3)}
.home-recap{font-size:19px;line-height:1.5;letter-spacing:-.2px;color:var(--ink-2)}
.home-recap p+p{margin-top:var(--s2)}
.home-recap b{color:var(--ink);font-weight:650}
.home-recap p.cur::after{content:"";display:inline-block;width:2px;height:1.05em;margin-left:2px;vertical-align:-.15em;background:var(--ink);animation:caret 1s steps(2,start) infinite}
@keyframes caret{50%{opacity:0}}
.next-up{display:grid;gap:var(--s2);margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line-soft)}.next-up>small{font-size:12px;font-weight:650;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-3)}
.home-solar{align-self:flex-start;margin-top:auto;min-height:32px;padding:0 var(--s3);font-size:14px;background:var(--surface-2);color:var(--ink-2);border-radius:var(--r-pill)}
.home-solar b{color:var(--ink)}
/* 7 giorni */
.dw-list{display:grid;gap:4px}
.dw-row{display:grid;grid-template-columns:76px 104px 1fr auto;align-items:center;gap:var(--s3);min-height:44px;padding:0 var(--s3);background:transparent;border-radius:var(--r-md);text-align:left;justify-content:stretch}
.dw-row:hover:not(:disabled){background:var(--surface-2)}
.dw-row.today{background:var(--surface-2);box-shadow:inset 3px 0 0 var(--ink)}
.dw-day{display:flex;align-items:baseline;gap:6px}.dw-day small{font-size:12px;text-transform:uppercase;color:var(--ink-3);width:32px}.dw-day b{font-size:19px;font-weight:650}
.dw-row .dw-shift{display:inline-flex;align-items:center;justify-content:center;justify-self:start;width:auto;min-width:92px;max-width:none;height:28px;padding:0 var(--s3);font-size:14px;font-weight:650;border-radius:var(--r-pill);background:var(--shift-color);color:#0b0b0b}
.dw-row .dw-shift.no-shift{background:transparent;color:var(--ink-3);min-width:92px}
.dw-meta{font-size:14px;color:var(--ink-2)}.dw-ev{display:inline-flex;align-items:center;justify-content:flex-end;gap:var(--s2);font-size:14px;color:var(--ink-2)}
.dw-dot{width:8px;height:8px;border-radius:50%;background:var(--sec-finance,var(--ink));flex:0 0 auto}
.home-habit{min-height:48px}
.home-habit span{font-size:19px;width:24px;text-align:center}
.home-habits{grid-column:1/-1}
main:has(#today.active) .home-context{display:none}
.home-head{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:var(--s4)}
.home-head .home-recap{font-size:19px;margin:0}.home-head .home-solar{margin:0;flex:0 0 auto}
.home-native>.home-habits{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:var(--s3)}
.home-habits>.card-title,.home-habits>.os-empty{grid-column:1/-1}
.home-habits .home-habit{display:flex;align-items:center;justify-content:flex-start;gap:var(--s3);text-align:left;margin:0;padding:0 var(--s4);background:var(--surface-2);border:1px solid transparent;border-radius:var(--r-md);font-weight:400}
.home-habits .home-habit[aria-pressed="true"]{border-color:var(--pos);color:var(--ink-2)}
.home-habits .home-habit[aria-pressed="true"] span{color:var(--pos)}
.home-native .os-empty{margin:var(--s3) 0;color:var(--ink-3)}
@media(max-width:1000px){.dash-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.dash-kpi strong{font-size:26px}}
@media(max-width:760px){
  .home-native{grid-template-columns:minmax(0,1fr);gap:var(--s3)}
  .dash-kpis{gap:var(--s3)}.dash-kpi{min-height:96px;padding:var(--s3) var(--s4)}.dash-kpi strong{font-size:26px}
  .home-native>.os-card{padding:var(--s4)}.home-recap{font-size:16px}
  .dw-row{grid-template-columns:44px auto 1fr auto;gap:var(--s2);padding:0 var(--s2)}.dw-ev{font-size:0;gap:0}.dw-ev .dw-dot{width:10px;height:10px}
}
.os-home{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.os-home-prayer{grid-column:1/-1}
.os-routine{display:flex;gap:var(--s4);align-items:center;margin-top:var(--s4);padding-top:var(--s4);border-top:1px solid var(--line-soft)}
.os-routine-items{display:flex;gap:var(--s2);flex-wrap:wrap}
.os-routine-check{min-height:40px;padding:0 var(--s3);font-size:14px;background:var(--surface-2)}
.os-routine-tick{display:grid;place-items:center;width:18px;height:18px;border:1.5px solid var(--ink-3);border-radius:4px;flex:none}
.os-routine-check.checked .os-routine-tick{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.os-home-task{display:flex;align-items:center;gap:var(--s3);min-height:52px;padding:var(--s2) 0}
.os-home-task+.os-home-task{border-top:1px solid var(--line-soft)}
.os-home-task-title,.os-task-title{flex:1;min-width:0;justify-content:flex-start;text-align:left;background:transparent;min-height:32px;padding:0;font-weight:400;font-size:16px;overflow-wrap:anywhere}
.os-agenda-entry{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) 0;border-top:1px solid var(--line-soft)}
.os-agenda-row{display:flex;justify-content:flex-start;gap:var(--s3);flex:1;min-width:0;background:transparent;text-align:left;padding:0}
.os-agenda-date{text-align:center;width:36px;flex:none}.os-agenda-date b,.os-agenda-date small{display:block}
.os-agenda-title{flex:1;min-width:0}.os-agenda-title small{display:block;margin-top:2px}
.os-money-primary{container-type:inline-size}
.os-money-primary strong{display:block;font-size:min(40px,calc(100cqw / var(--money-units,6)));line-height:1.1;letter-spacing:-1.2px;white-space:nowrap}
.os-home-money{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s3);align-items:start;padding-bottom:var(--s4);border-bottom:1px solid var(--line-soft)}
.os-home-submoney{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s5);padding-top:var(--s4)}
.os-home-metric>span{display:block;font-size:14px;color:var(--ink-2);margin-bottom:4px}.os-home-metric>b{font-size:19px;white-space:nowrap}
.os-home-daygrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s4)}
.os-home-daygrid>div{border-left:3px solid var(--shift-color,var(--accent));padding-left:var(--s3)}
.os-home-daygrid h2{font-size:26px;margin-top:4px}
.os-sunline-meta{display:flex;justify-content:space-between;gap:var(--s3);color:var(--ink-2);font-size:14px}
.os-prayer-list{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3);margin-top:var(--s3)}
.os-prayer{display:flex;justify-content:space-between;font-size:14px;gap:var(--s2)}.os-prayer.next{color:var(--ink);font-weight:650}

/* 5.2 Attività */
#tasks{max-width:820px}
.os-category-page{padding:0}
.os-task{display:grid;grid-template-columns:28px 26px minmax(0,1fr) 36px;gap:var(--s2);align-items:center;min-height:52px;padding:var(--s2) 0}
.os-task+.os-task{border-top:1px solid var(--line-soft)}
.os-task-section{border-top:1px solid var(--line-soft);padding-top:var(--s4);margin-top:var(--s2)}
.os-task-section h3,.details-label{color:var(--ink-2);font-size:14px;font-weight:650;margin:var(--s4) 0 var(--s1)}
.os-task-section .os-task,.os-completed .os-task{grid-template-columns:26px minmax(0,1fr) 36px}
.os-task.is-dragging{opacity:.55}
.os-completed{border-top:1px solid var(--line-soft);padding:var(--s4) 0}.os-completed summary{font-size:14px;color:var(--ink-2)}

/* 5.3 Calendario */
#calendar{max-width:none}
#calendar>.os-card{background:transparent;border:0;box-shadow:none;padding:0}
.os-month-header{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;margin-bottom:var(--s4)}
.os-month-header h2{text-align:center;text-transform:capitalize;font-size:26px;letter-spacing:-.4px}
.os-month-header button{background:transparent;color:var(--ink-2);font-size:26px;padding:0;border-radius:50%}
.os-weekdays{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;font-size:12px;color:var(--ink-2);margin-bottom:var(--s2)}
.os-days{display:grid;gap:0}
.os-calendar-week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line-soft)}
.os-day{display:grid;grid-template-rows:26px 20px 12px;justify-items:center;align-items:center;align-content:center;gap:3px;width:100%;height:72px;min-height:72px;padding:4px 0;background:transparent;border-radius:0;font-weight:400}
.os-day b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;font-size:14px;color:var(--ink)}
.os-day .os-shift{font-size:12px;font-weight:650;width:calc(100% - 10px);max-width:48px;height:20px;display:flex;align-items:center;justify-content:center;border-radius:6px;color:#101215}
.os-day .os-shift:not(.no-shift){background:var(--shift-color)}.os-day .os-shift.no-shift{background:transparent}
.os-day[data-kind="night"] .os-shift{color:#fff}
.os-day-mark{display:grid;place-items:center;min-height:10px;height:12px;font-size:12px;font-weight:650;color:var(--shift-color,var(--ink-2))}
.os-day-mark.dot::after{content:"";width:4px;height:4px;border-radius:50%;background:currentColor}
.os-day-mark.event-count{min-width:18px;border-radius:4px;color:var(--ink)}
.os-day:hover:not(:disabled){background:transparent}.os-day:active:not(:disabled){transform:none;opacity:1}
.os-day:hover:not(.selected):not(:disabled) b{background:var(--surface-3)}
.os-day.today b{outline:1px solid var(--ink-3)}
.os-day.selected b{background:var(--accent);color:var(--on-accent);outline:0}
.os-day.other{opacity:.4}
.os-calendar-week>.os-day:nth-child(n+6):not(.selected) b{color:var(--ink-2)}
.os-calendar-details{margin-top:var(--s5);padding-top:var(--s5);border-top:1px solid var(--line-soft)}
.os-calendar-details>h3{margin-bottom:var(--s4);font-size:16px}
.os-mini{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line-soft)}
.os-mini:last-child{border:0}.os-mini>div:first-child{flex:1;min-width:0}.os-mini small{display:block}
.os-section-label{color:var(--ink-2);margin-top:var(--s4);font-size:14px}
.os-event-options,.os-tools-drawer{font-size:14px;color:var(--ink-2)}
.os-tools-drawer{margin-top:var(--s4)}.os-event-options>summary,.os-tools-drawer>summary{padding:var(--s2) 0}
.os-palette{display:flex;gap:var(--s2);flex-wrap:wrap}
.os-palette button.active{border-color:var(--accent)}
.os-palette-state{padding:var(--s3) 0}

/* 5.4 Finanza: panoramica */
.finance-open{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4);align-items:stretch}
.finance-hero{grid-column:1;padding:var(--s6) var(--s5);text-align:center;display:flex;flex-direction:column;justify-content:center;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg)}

.finance-hero p{font-size:14px}
.finance-account{grid-column:2;display:flex;align-items:center;flex-wrap:wrap;gap:var(--s3);padding:var(--s5);align-content:center;
  background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg)}
.finance-account>div{flex:1;min-width:0}
.finance-account h2{color:var(--ink-2);font-size:14px;font-weight:400}

.finance-account>small{flex-basis:100%}
.finance-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:var(--s2)}

.finance-actions button:hover:not(:disabled){background:var(--surface-2)}
.finance-actions .primary-pill{background:var(--sec-finance);color:var(--on-accent,#0b0b0b);border-color:transparent;font-weight:650}
.finance-actions span{font-size:16px;line-height:1}
.budget-flow{grid-column:1/-1;display:block!important;margin-bottom:var(--s4)}.budget-flow h3{margin:0 0 var(--s2);font-size:16px}.budget-flow .hint{margin:0 0 var(--s3)}
.budget-flow svg{width:100%;height:auto;display:block;margin:var(--s3) 0}
.bf-name{fill:var(--ink-2);font-size:14px}.bf-val{fill:var(--ink);font-size:14px;font-weight:650}
.bf-in rect,.bf-total rect{fill:var(--sec-finance)}.bf-fix rect{fill:var(--ink-3)}.bf-out rect{fill:var(--negative,#d98a80)}.bf-neg rect{fill:var(--negative,#d98a80)}
.bf-kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s3)}
.bf-kpis>div{display:grid;gap:2px;padding:var(--s3);border-radius:var(--r-md);background:var(--surface-2)}
.bf-kpis small{font-size:12px;color:var(--ink-3)}.bf-kpis b{font-size:19px;font-weight:650;letter-spacing:-.4px}.bf-kpis span{font-size:12px;color:var(--ink-2)}
@media(max-width:760px){.bf-name,.bf-val{font-size:19px}.oc-tick{font-size:16px}.bf-kpis b{font-size:16px}.bf-kpis>div{padding:var(--s2)}}
.finance-charts{grid-column:1/-1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s4)}
.finance-chart{padding:var(--s5);background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);min-width:0}

.oc-line{fill:none;stroke:var(--sec-finance);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}.oc-dot{fill:var(--sec-finance)}
.oc-tick{fill:var(--ink-3);font-size:12px}
.oc-legend{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2) var(--s4);margin-top:var(--s2);font-size:12px;color:var(--ink-2)}
.oc-legend i{display:inline-block;width:16px;height:0;border-top:2.5px solid var(--sec-finance);margin-right:6px;vertical-align:middle}.oc-legend i.k-pace{border-top:2px dashed var(--ink-3)}
.oc-bar{display:grid;grid-template-columns:minmax(70px,.9fr) 2fr auto 38px;align-items:center;gap:var(--s3);padding:6px 0;font-size:14px}

.finance-recent{grid-column:1/-1;padding:var(--s5);background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg)}
.finance-heading{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);margin-bottom:var(--s2)}
.finance-heading>button{background:transparent;color:var(--sec-finance);padding:0 var(--s2)}
.finance-movement:last-child{border-bottom:0}

/* 5.5 Finanza: movimenti, budget, analisi, piani */
.filters{display:flex;gap:var(--s3);margin-bottom:var(--s4)}.filters .search{flex:1;min-width:0}.filters select{width:auto;min-width:180px}
.table-scroll,.chart-scroll,.sankey-scroll{overflow-x:auto;min-width:0}
.tabular{border-collapse:collapse;width:100%;font-size:14px}

.tabular th:first-child,.tabular td:first-child{padding-left:0}.tabular .num{text-align:right;white-space:nowrap}
.tx-description-row{display:flex;justify-content:space-between;gap:var(--s3)}.tx-description-text small{display:block}

.plans-web,.budget-flow,.extra-grid{display:grid;gap:var(--s4)}
.plans-web{max-width:760px}
.plans-web>.card-title{grid-column:1/-1;margin-bottom:0}
.plans-web>details.card{grid-column:1/-1}
.plans-web button,.plans-web input,.plans-web select{min-height:var(--tap)}
.budget-flow{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}

.extra-toolbar{display:none}

.extra-card-controls{display:flex;gap:var(--s2);flex-wrap:wrap}

#fund-surplus{background:color-mix(in srgb,var(--accent) 40%,var(--surface-2))}

.planning-inputs,.budget-settings{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--s3)}

.daily-budget{display:grid;gap:6px;padding-top:var(--s4)}.daily-budget>span{font-size:14px;color:var(--ink-2)}.daily-budget strong{font-size:26px}
.edit-line{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);padding:var(--s3) 0;border-bottom:1px solid var(--line-soft)}
.edit-line small{display:block;margin-top:2px}.edit-controls{display:flex;align-items:center;gap:var(--s2)}.edit-input{width:110px}
.balance-settings-column{display:grid;gap:var(--s5);align-content:start}

    <script id="lifeos-admin">
      /* Admin. Solo letture; le esportazioni restano nel browser. */
      const adm = { status: null, busy: "", error: "", progress: "" };
      const fmtBytes = (n) =>
        n == null ? "—" : n > 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
      const fmtNum = (n) => new Intl.NumberFormat("it-IT").format(n || 0);
      const csvCell = (v) => {
        const t = v == null ? "" : String(v);
        return /[";\n\r]/.test(t) ? '"' + t.replaceAll('"', '""') + '"' : t;
      };
      function downloadFile(name, text, type) {
        const url = URL.createObjectURL(new Blob([text], { type }));
        const a = Object.assign(document.createElement("a"), { href: url, download: name });
        document.body.append(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 4000);
      }
      async function exportTable(table, onPage) {
        const rows = [];
        for (let offset = 0; ; offset += 200) {
          const page = await workerRequest("getAdminExport", [table, offset]);
          rows.push(...page.rows);
          if (onPage) onPage(rows.length);
          if (page.done) return rows;
        }
      }
      async function renderAdmin() {
        const root = document.getElementById("admin");
        if (!root) return;
        if (!adm.status && !adm.busy) {
          adm.busy = "status"; adm.error = "";
          const started = performance.now();
          try {
            adm.status = await workerRequest("getAdminStatus", []);
            adm.latency = Math.round(performance.now() - started);
          } catch (e) { adm.error = String(e.message || e); }
          adm.busy = "";
        }
        const s = adm.status;
        const used = s?.bytes ? Math.min(100, (s.bytes / s.limits.storageBytes) * 100) : 0;
        const tables = (s?.tables || []).slice().sort((a, b) => b.rows - a.rows);
        const maxRows = Math.max(1, ...tables.map((t) => t.rows));
        root.innerHTML = `<div class="adm-grid">
          ${adm.error ? `<div class="errorbox adm-wide">${escapeHtml(adm.error)}</div>` : ""}
          <section class="card pad"><div class="card-title"><h2>Stato</h2><button data-adm="refresh">Aggiorna</button></div>
            <div class="kv"><span>Accesso</span><strong>${escapeHtml(s?.auth || "—")}</strong></div>
            <div class="kv"><span>Ultimo movimento</span><strong>${escapeHtml(s?.lastMovement || "—")}</strong></div>
            <div class="kv"><span>Latenza Worker</span><strong>${adm.latency ? adm.latency + " ms" : "—"}</strong></div>
            <div class="kv"><span>Controllo</span><strong>${s && !isNaN(new Date(s.time)) ? escapeHtml(new Date(s.time).toLocaleString("it-IT")) : "—"}</strong></div>
          </section>
          <section class="card pad"><div class="card-title"><h2>Spazio database</h2></div>

      /** Trasporto JSON same-origin con timeout; nessun retry automatico delle scritture. */
      async function workerRequest(method, args) {
        // A stalled read must not trap navigation. Never automatically retry writes:
        // a dropped response does not prove the server rolled the operation back.
        const controller = new AbortController(),
          timer = setTimeout(() => controller.abort(), 20000);
        try {
          const r = await fetch("/api/" + method, {
            method: "POST",
            headers: { "content-type": "application/json", "X-LifeOS-Plans-Version": "2" },
            body: JSON.stringify(args),
            signal: controller.signal,
          });
          if (!r.ok) {
            const raw = (await r.text()).slice(0, 500);
            let message = raw;
            try { message = JSON.parse(raw).error || raw; } catch {}
            if(r.headers.get('content-type')?.includes('text/html')||/<(?:!doctype|html|head|body)\b/i.test(raw))
              message=[429,500,502,503,504].includes(r.status)?'Il server è momentaneamente occupato. Riprova tra poco.':'Il server non ha restituito dati validi. Verifica l’accesso e riprova.';
            if (method.includes("FinancePlan") && (r.status === 404 || message.trim() === "Operazione non disponibile.")) message = lifeOSContract.plansUnavailable;
            throw Error(r.status === 401 ? "Sessione scaduta. Riapri l’app e accedi." : message);
          }
          if (
            !(r.headers.get("content-type") || "").includes("application/json")
          )
            throw Error("Sessione non disponibile. Riapri l’app e accedi.");
          return await r.json();
        } catch (error) {
          if (error.name === "AbortError")
            throw Error(
              method.startsWith("get")
                ? "Connessione lenta. Riprova a caricare la schermata."
                : "Risposta non ricevuta. Aggiorna e verifica il salvataggio prima di riprovare.",
            );
          throw error;
        } finally {
          clearTimeout(timer);
        }
      }

        script: {
          run: new Proxy(
            {},
            {
              get(_target, name) {
                if (
                  name === "withSuccessHandler" ||
                  name === "withFailureHandler"
                )
                  return (callback) => {
                    const runner = {
                      success: name === "withSuccessHandler" ? callback : null,
                      failure: name === "withFailureHandler" ? callback : null,
                    };
                    const proxy = new Proxy(runner, {
                      get(obj, key) {
                        if (key === "withSuccessHandler")
                          return (cb) => {
                            obj.success = cb;
                            return proxy;
                          };
                        if (key === "withFailureHandler")

                            obj.failure = cb;

                          };
                        return (...args) =>
                          workerRequest(String(key), args)
                            .then((v) => obj.success?.(v))
                            .catch((e) => obj.failure?.(e));
                      },
                    });
                    return proxy;
                  };
              },
            },
          ),
        },
      };

    <script>
      /* Offline solar calculation for Empoli. Angles and minute adjustments are configured settings.
   Solar position follows the public PrayTimes formulas; no network or location access. */
      const osPrayerConfig = Object.freeze({
        latitude: 43.7179,
        longitude: 10.9478,
        timeZone: "Europe/Rome",
        fajrAngle: 14.5,
        ishaAngle: 14.8,
        asrFactor: 1,
        adjustments: {
          fajr: 0,
          sunrise: -2,
          dhuhr: 1,
          asr: 1,
          maghrib: 2,
          isha: 0,
        },
      });
      const osDeg = Math.PI / 180;

      /** Calcolo astronomico locale per Empoli; restituisce orari, senza geolocalizzazione o richieste. */
      function osPrayerTimes(day, config = osPrayerConfig) {
        if (!/^\d{4}-\d{2}-\d{2}$/.test(day)) throw Error("Data non valida");
        const [y, m, d] = day.split("-").map(Number),
          lat = config.latitude,
          lon = config.longitude;
        const jd = Date.UTC(y, m - 1, d) / 86400000 + 2440587.5 - lon / 360;
        const norm = (x, n) => ((x % n) + n) % n;
        const sin = (x) => Math.sin(x * osDeg),
          cos = (x) => Math.cos(x * osDeg),
          tan = (x) => Math.tan(x * osDeg);

        /** Declinazione solare ed equazione del tempo per il giorno giuliano corrente. */
        function sun(t) {
          const D = jd + t / 24 - 2451545,
            g = norm(357.529 + 0.98560028 * D, 360),
            q = norm(280.459 + 0.98564736 * D, 360);
          const L = norm(q + 1.915 * sin(g) + 0.02 * sin(2 * g), 360),
            e = 23.439 - 0.00000036 * D;
          const RA = norm(Math.atan2(cos(e) * sin(L), cos(L)) / osDeg / 15, 24);
          return { decl: Math.asin(sin(e) * sin(L)) / osDeg, eqt: q / 15 - RA };
        }

        /** Mezzogiorno solare normalizzato sulle 24 ore. */
        function noon(t) {
          return norm(12 - sun(t).eqt, 24);
        }

        /** Converte un angolo solare in ora; restituisce NaN se non esiste un attraversamento. */
        function angleTime(angle, t, before) {
          const decl = sun(t).decl,
            den = cos(decl) * cos(lat);
          const ratio = (-sin(angle) - sin(decl) * sin(lat)) / den;
          if (!Number.isFinite(ratio) || Math.abs(ratio) > 1) return NaN;
          const delta =
            Math.acos(Math.max(-1, Math.min(1, ratio))) / osDeg / 15;
          return noon(t) + (before ? -delta : delta);
        }

        /** Calcola il tempo pomeridiano dal fattore d’ombra configurato. */
        function asr(t) {
          const decl = sun(t).decl,
            alt =
              -Math.atan(1 / (config.asrFactor + tan(Math.abs(lat - decl)))) /
              osDeg;
          return angleTime(alt, t, false);
        }
        let times = {
          fajr: 5,
          sunrise: 6,
          dhuhr: 12,
          asr: 13,
          maghrib: 18,
          isha: 18,
        };
        for (let i = 0; i < 2; i++) {
          const t = Object.fromEntries(
            Object.entries(times).map(([k, v]) => [k, v / 24]),
          );
          times = {
            fajr: angleTime(config.fajrAngle, t.fajr, true),
            sunrise: angleTime(0.833, t.sunrise, true),
            dhuhr: noon(t.dhuhr),
            asr: asr(t.asr),
            maghrib: angleTime(0.833, t.maghrib, false),
            isha: angleTime(config.ishaAngle, t.isha, false),
          };
        }
        const noonUtc = new Date(Date.UTC(y, m - 1, d, 12)),
          parts = new Intl.DateTimeFormat("en-GB", {
            timeZone: config.timeZone,
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23",
          }).formatToParts(noonUtc);

          Object.entries(times).map(([key, value]) => {
            if (!Number.isFinite(value))

            const minutes = norm(
              Math.round(
                (value + utcOffset - lon / 15) * 60 +
                  (config.adjustments[key] || 0),
              ),
              1440,
            );

              key,
              {
                minutes,
                label:
                  String(Math.floor(minutes / 60)).padStart(2, "0") +
                  ":" +
                  String(minutes % 60).padStart(2, "0"),
              },
            ];
          }),
        );
      }

      /** Azione principale flottante; opzioni secondarie vicino al titolo. */
      function osPageActions() {
        const view = state.view, active = life.data?.categories.find(c => c.key === life.category);
        let action = 'data-new-transaction="Spesa"', label = 'Aggiungi spesa', secondary = '';
        if (view === 'tasks') {
          action = 'data-life-task="new"'; label = 'Aggiungi attività';
          secondary = '';
        } else if (view === 'calendar') {
          action = 'data-life-event="new"'; label = 'Aggiungi evento';
        } else if (['overview','movements','budget','extras'].includes(view)) {
          if (['extras','budget'].includes(view)) { action = 'data-new-extra="1"'; label = 'Nuovo piano'; }
          secondary = '';
        }
        document.getElementById('page-actions').innerHTML = secondary;
        document.getElementById('page-fab').innerHTML = `<button type="button" class="os-button primary fab-button" ${action} aria-label="${label}" title="${label}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>`;
      }

      /** Ricrea solo la vista Life OS attiva; non eseguire su ogni clic generico. */
      function renderLifeOS() {
        osPageActions();
        if (!life.data) return;
        osUpdateHeader();
        const view = typeof state !== "undefined" ? state.view : "today";
        if (view === "today")
          document.getElementById("today").innerHTML = osToday();
        if (view === "tasks")
          document.getElementById("tasks").innerHTML = osTasks();
        if (view === "calendar") {
          document.getElementById("calendar").innerHTML = osCalendar();
          document.body.dataset.calendarRows = Math.ceil(
            document.querySelectorAll(".os-day").length / 7,
          );
          document.body.style.setProperty(
            "--calendar-rows",
            document.body.dataset.calendarRows,
          );
        }
      }

      /** Aggiorna la sintesi finanziaria della home per il mese corrente a Roma. */
      async function osLoadHomeFinance() {
        const revision = life.homeFinanceRevision = (life.homeFinanceRevision || 0) + 1;
        try {
          const day = new Date().toLocaleDateString("sv-SE", {
            timeZone: "Europe/Rome",
          });
          const fresh = await osRequest(
            "getFinanceOverview",
            Number(day.slice(0, 4)),
            Number(day.slice(5, 7)),
          );
          if (revision !== life.homeFinanceRevision) return;
          life.finance = fresh;
          life.financeError = false;
          if (life.data) document.getElementById("today").innerHTML = osToday();
        } catch (e) {
          if (revision !== life.homeFinanceRevision) return;
          life.financeError = true;
          if (life.data) document.getElementById("today").innerHTML = osToday();
        }
      }

      /** Aggiorna il meteo nell’intestazione, senza ricreare la pagina. */
      function osUpdateHeader() {
        if (typeof document === "undefined") return;
        document.getElementById("home-weather").textContent = osWeatherText();
      }

      /** Etichetta meteo compatta da dati già caricati. */
      function osWeatherText() {
        const w = life.weather;
        if (!w) return "Meteo —";
        const condition = [0].includes(w.code)
          ? "sereno"
          : [1, 2].includes(w.code)
            ? "poco nuvoloso"
            : [3].includes(w.code)
              ? "nuvoloso"
              : [45, 48].includes(w.code)
                ? "nebbia"
                : [51, 53, 55, 61, 63, 65, 80, 81, 82, 95, 96, 99].includes(
                      w.code,
                    )
                  ? "pioggia"
                  : "meteo";
        const rain = w.rain ? ` · pioggia ${w.rain}` : ` · ${condition}`;
        return Math.round(w.temp) + " °C" + rain;
      }

      /** Meteo facoltativo con timeout breve e intervallo minimo di 30 minuti. */
      async function osLoadWeather() {
        if (life.weatherAt && Date.now() - life.weatherAt < 30 * 60000) return;
        life.weatherAt = Date.now();
        const controller = new AbortController(),
          timer = setTimeout(() => controller.abort(), 6000);
        try {
          const url =
            "https://api.open-meteo.com/v1/forecast?latitude=43.7179&longitude=10.9478&current=temperature_2m,weather_code&hourly=rain,precipitation_probability&forecast_hours=18&timezone=Europe%2FRome";
          const response = await fetch(url, { signal: controller.signal });
          if (!response.ok) throw Error("Meteo non disponibile");
          const data = await response.json(),
            temp = Number(data.current?.temperature_2m);
          if (!Number.isFinite(temp)) throw Error("Temperatura assente");
          const now = new Intl.DateTimeFormat("sv-SE", {
            timeZone: "Europe/Rome",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23",
          })
            .format(new Date())
            .replace(" ", "T");
          const times = data.hourly?.time || [],
            amounts = data.hourly?.rain || [],
            prob = data.hourly?.precipitation_probability || [];
          const i = times.findIndex(
            (t, j) =>
              t >= now && Number(amounts[j]) >= 0.1 && Number(prob[j]) >= 40,
          );
          const rain =
            i < 0
              ? ""
              : times[i].slice(0, 10) === now.slice(0, 10)
                ? times[i].slice(11, 16)
                : "domani " + times[i].slice(11, 16);
          life.weather = {
            temp,
            code: Number(data.current.weather_code),
            rain,
          };
        } catch {
          life.weather = null;
        } finally {
          clearTimeout(timer);
          osUpdateHeader();
          if (life.data) document.getElementById("today").innerHTML = osToday();
        }
      }

      /** Markup dashboard: routine, oggi/domani, tre attività, eventi e saldi. */
      function osToday() {
        const d = life.data,
          day = d.today,
          shift = d.shifts.find((s) => s.day === day),

          ),

        const finance = life.finance?.summary;
        const shiftLabel = (v) =>
          v
            ? {
                morning: 'Mattina',
                afternoon:
