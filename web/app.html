            )
            .concat(
              tasks
                .slice(0, Math.max(0, 3 - upcoming.length))
                .map(
                  (t) =>
                    `<div class="os-home-task"><button class="os-check" data-life-complete="${t.id}" aria-label="Completa ${osSafe(t.title)}"></button><button class="os-home-task-title" data-life-task="${t.id}">${osSafe(t.title)}${osDueBadge(t.due_date || t.scheduled_date, t.status)}</button></div>`,
                ),
            )
            .slice(0, 3)
            .join("") || '<p class="os-empty">Nessun evento o attività.</p>';
        const routine = habits
          .map(
            (h) =>
              `<button type="button" class="os-routine-check ${h.checked ? "checked" : ""}" data-life-routine="${h.id}" aria-pressed="${!!h.checked}" aria-label="${h.checked ? "Annulla" : "Completa"} ${osSafe(h.title)}"><span class="os-routine-tick" aria-hidden="true">${h.checked ? "✓" : ""}</span>${osSafe(h.title)}</button>`,
          )
          .join("");
        const exactMoney = (n) =>
          new Intl.NumberFormat("it-IT", {
            style: "currency",
            currency: "EUR",
            useGrouping: "always",
          }).format(n);
        return `<div class="os-home">
    <section class="os-card os-day-dashboard" aria-label="La giornata"><div class="os-home-daygrid"><div data-kind="${shift?.kind || ""}"><span class="os-home-label">Oggi</span><h2>${shiftLabel(shift)}</h2></div><div class="os-home-tomorrow" data-kind="${tomorrow?.kind || ""}"><span>Domani</span><strong>${shiftLabel(tomorrow)}</strong></div></div>
      <div class="os-routine"><div class="os-routine-head"><span>Routine <b>${complete}/${habits.length}</b></span><button type="button" class="os-routine-manage" data-life-routine-manage>Gestisci</button></div><div class="os-routine-items">${routine || '<button class="os-home-routine-add" data-life-routine-manage>Aggiungi routine</button>'}</div></div>
    </section>
    <section class="os-card os-home-agenda"><div class="os-topline"><h2>In evidenza</h2><button class="os-button" data-life-nav="tasks">Tutte le attività</button></div>${featured}</section>
    <section class="os-card os-home-finance" aria-label="Denaro">
      ${finance ? `<div class="os-home-money"><div class="os-money-primary" style="--money-units:${exactMoney(finance.monthlyRemaining).length*0.62}"><small>Budget del mese</small><strong>${state.assetsVisible ? exactMoney(finance.monthlyRemaining) : "•••• €"}</strong></div>${privacyButton()}</div><div class="os-home-submoney ${Math.abs(finance.budget)>=100000 || Math.abs(finance.monthlyCommitted)>=100000?"large-amount":""}"><div class="os-home-metric"><span>Impegnato</span><b>${exactMoney(finance.monthlyCommitted)}</b></div><div class="os-home-metric os-home-private"><span>Saldo</span><b>${state.assetsVisible ? exactMoney(finance.budget) : "•••• €"}</b></div></div>` : life.financeError ? '<p class="os-empty">Saldo non disponibile.</p><button class="os-button" data-life-nav="overview">Riprova in Finanza</button>' : '<p class="os-empty" role="status">Caricamento…</p>'}
    </section>
    <section class="os-card os-home-prayer"><div class="os-solar-inline">${osPrayerCard(day, new Date(), life.timesOpen)}</div></section>
  </div>`;
      }

      /** Apre il foglio di gestione delle routine; non modifica le spunte. */
      function osManageRoutines() { return lifeOSHabits.open(); }

      /** Scadenza esplicita Domani/Oggi/Scaduto; nessun badge per completate. */
      function osDueBadge(day, status) {
        if (!day || status === "done" || !life.data) return "";
        const today = life.data.today;
        let label = "",
          kind = "";
        if (day < today) {
          label = "Scaduto";
          kind = "overdue";
        } else if (day === today) {
          label = "Oggi";
          kind = "today";
        } else if (day === osNextDay(today)) {
          label = "Domani";
          kind = "tomorrow";
        }
        return label
          ? `<span class="due-badge due-${kind}">${label}</span>`
          : "";
      }

      /** Riga attività; escaping obbligatorio per titolo e attributi utente. */
      function osTaskRow(t) {
        const waiting = t.status === "waiting";
        return `<div class="os-task ${t.status === "done" ? "done" : ""}" data-life-drag-row="${t.id}">${t.status === "todo" ? `<button type="button" class="os-drag-handle" data-life-drag-handle="${t.id}" aria-label="Riordina ${osSafe(t.title)}. Trascina o usa Alt più freccia su o giù" title="Trascina per riordinare"><svg viewBox="0 0 20 24" width="16" height="22" fill="currentColor" aria-hidden="true"><circle cx="6" cy="5" r="1.4"/><circle cx="14" cy="5" r="1.4"/><circle cx="6" cy="12" r="1.4"/><circle cx="14" cy="12" r="1.4"/><circle cx="6" cy="19" r="1.4"/><circle cx="14" cy="19" r="1.4"/></svg></button>` : ""}<button class="os-check" data-life-status="${t.id}:${t.status === "done" ? (t.section_status === "waiting" ? "waiting" : "todo") : "done"}" aria-label="${t.status === "done" ? "Riapri" : "Completa"} ${osSafe(t.title)}">${t.status === "done" ? "✓" : ""}</button><button class="os-task-title" data-life-task="${t.id}">${osSafe(t.title)}${osDueBadge(t.due_date || t.scheduled_date, t.status)}</button>${t.status !== "done" ? `<button class="os-wait ${waiting ? "waiting" : ""}" data-life-status="${t.id}:${waiting ? "todo" : "waiting"}" title="${waiting ? "Riporta in Da fare" : "Metti in attesa"}" aria-label="${waiting ? "Riporta in Da fare" : "Metti in attesa"} ${osSafe(t.title)}" aria-pressed="${waiting}"><svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3v4c0 2 2 3 5 5-3 2-5 3-5 5v4M17 3v4c0 2-2 3-5 5 3 2 5 3 5 5v4"/></svg></button>` : `<button class="os-task-delete" data-life-delete-task="${t.id}" aria-label="Elimina ${osSafe(t.title)}" title="Elimina attività"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 4h4M6 7l1 13h10l1-13M10 11v5M14 11v5"/></svg></button>`}</div>`;
      }

      /** Lista della categoria selezionata; azioni secondarie nel menu Opzioni. */
      function osTasks() {
  const d = life.data;
  if (!d.categories.some(c => c.key === life.category)) life.category = d.categories[0]?.key || "action";
  const today = new Intl.DateTimeFormat("sv-SE", {timeZone:"Europe/Rome"}).format(new Date());
  const dayAfter = n => new Date(Date.parse(today + "T12:00:00Z") + n * 864e5).toISOString().slice(0,10);
  const tomorrow = dayAfter(1), last = dayAfter(7);
  const items = d.tasks.filter(t => t.list_kind === life.category);
  const ready = t => !t.scheduled_date || t.scheduled_date <= today;
  const todo = items.filter(t => t.status === "todo" && ready(t));
  const waiting = items.filter(t => t.status === "waiting" && ready(t));
  const done = items.filter(t => t.status === "done");
  const seen = new Set();
  const events = life.category !== "action" ? [] : [...(d.activityEvents || []),...d.events,...(d.upcomingEvents || [])].filter(e => {
    const key = e.id + ":" + e.day;
    if (seen.has(key) || e.day < today || e.day > last || (e.occurrence_status || "open") !== "open") return false;
    seen.add(key); return true;
  }).sort((a,b) => a.day.localeCompare(b.day) || (a.start_time || "").localeCompare(b.start_time || "") || a.id-b.id);
  const eventRow = e => `<div class="os-task os-task-event"><span aria-hidden="true"></span><button class="os-check" data-life-occurrence="${e.id}:${e.day}:done" aria-label="Completa ${osSafe(e.title)}"></button><button class="os-task-title" data-life-event="${e.id}">${osSafe(e.title)}<small>${osDate(e.day)}${e.start_time ? " · " + osSafe(e.start_time) : ""}</small></button></div>`;
  const active = events.filter(e => e.day <= tomorrow).map(eventRow).join("") + todo.map(osTaskRow).join("");
  const pending = waiting.map(osTaskRow).join("") + events.filter(e => e.day > tomorrow).map(eventRow).join("");
  return `<div class="card-title"><h2>Categorie</h2><div class="actions"><button data-life-reorder aria-pressed="${life.reorder}">${life.reorder ? "Fine" : "Riordina"}</button><button data-life-category aria-label="Gestisci categorie" title="Gestisci categorie"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button></div></div><div class="os-category-navigation"><nav class="os-category-tabs" aria-label="Categorie attività">${d.categories.map(c => `<button data-life-select-category="${osSafe(c.key)}" class="${life.category === c.key ? "active" : ""}" aria-current="${life.category === c.key ? "page" : "false"}">${osSafe(c.label)}</button>`).join("")}</nav></div><div class="os-category-page ${life.reorder ? "is-reordering" : ""}">${active ? '<h3 class="details-label">Attivo</h3>' + active : ""}${pending ? `<section class="os-task-section"><h3>In attesa</h3>${pending}</section>` : ""}${done.length ? `<details class="os-completed"><summary>Completate · ${done.length}</summary>${done.map(osTaskRow).join("")}</details>` : ""}${!active && !pending && !done.length ? '<p class="os-task-empty">Nessuna attività da mostrare</p>' : ""}</div>`;
}

      /** Editor evento o serie; una modifica da qui passa split_from al server. */
      function osEventForm() {
        const ev = life.editingEvent
          ? life.data.events.find((e) => e.id === life.editingEvent) ||
            life.data.upcomingEvents?.find((e) => e.id === life.editingEvent) || life.data.activityEvents?.find((e) => e.id === life.editingEvent)
          : null;
        if (!life.creatingEvent && !ev) return "";
        return `<div class="os-inline-event" id="os-event-editor"><div class="os-topline"><h3>${life.editingSplitFrom ? "Modifica da qui" : ev ? "Modifica serie" : "Nuovo evento"}</h3><button class="os-icon-button" data-life-close aria-label="Chiudi modulo evento">×</button></div><form id="life-form" data-kind="event" class="os-form"><input type="hidden" name="record_id" value="${ev?.id || ""}">${life.editingSplitFrom ? `<input type="hidden" name="split_from" value="${life.editingSplitFrom}">` : ""}<label class="wide">Titolo *<input name="title" maxlength="140" required value="${osSafe(ev?.title || "")}"></label><label class="wide">Giorno *<input type="date" name="day" required value="${life.editingSplitFrom || ev?.series_day || ev?.day || life.selected || life.data.today}"></label><label>Inizio<input type="time" name="start_time" value="${ev?.start_time || ""}"></label><label>Fine<input type="time" name="end_time" value="${ev?.end_time || ""}"></label><label>Ripeti<select name="frequency">${[
          ["none", "Mai"],
          ["weekly", "Ogni settimana"],
          ["monthly", "Ogni mese"],
          ["yearly", "Ogni anno"],
        ]
          .map(
            ([v, t]) =>
              `<option value="${v}" ${(ev?.frequency || "none") === v ? "selected" : ""}>${t}</option>`,
          )
          .join(
            "",
          )}</select></label><label>Fino al (facoltativo)<input type="date" name="until_day" value="${ev?.until_day || ""}"></label><p class="hint wide">${life.editingSplitFrom ? "Le occorrenze precedenti restano invariate." : "Modifica tutte le occorrenze. Nei mesi più corti: ultimo giorno disponibile."}</p><label class="wide">Luogo<input name="location" maxlength="160" value="${osSafe(ev?.location || "")}"></label><label class="wide">Note<textarea name="notes" maxlength="1000">${osSafe(ev?.notes || "")}</textarea></label><div class="os-form-error hidden" role="alert"></div><div class="os-form-actions">${ev ? `<button class="os-button danger" type="button" data-life-delete-event="${ev.id}">Elimina</button>` : ""}<button class="os-button primary" type="button" data-life-save onclick="osSubmit(this.form);return false">Salva evento</button></div></form></div>`;
      }

      /** Calendario lunedì-domenica, giorni adiacenti e dettagli solo su selezione. */
      function osCalendar() {
        if (!life.selected && life.data?.today && life.data.today.slice(0, 7) === life.month) life.selected = life.data.today;
        const [year, month] = life.month.split("-").map(Number),
          first = new Date(Date.UTC(year, month - 1, 1)),
          days = new Date(Date.UTC(year, month, 0)).getUTCDate(),
          offset = (first.getUTCDay() + 6) % 7,
          shiftMap = new Map(life.data.shifts.map((s) => [s.day, s.kind])),
          events = life.data.events.filter((e) => e.day === life.selected),
          tasks = life.data.tasks.filter(
            (t) =>
              t.status !== "done" &&
              (t.scheduled_date === life.selected ||
                t.due_date === life.selected),
          ),
          shift = shiftMap.get(life.selected);
        const eventCounts = new Map(),
          taskDays = new Set();
        for (const event of life.data.events)
          eventCounts.set(event.day, (eventCounts.get(event.day) || 0) + 1);
        for (const task of life.data.tasks)
          if (task.status !== "done") {
            if (task.scheduled_date) taskDays.add(task.scheduled_date);
            if (task.due_date) taskDays.add(task.due_date);
          }
        let cells = "";
        for (let i = 0; i < Math.ceil((offset + days) / 7) * 7; i++) {
          const n = i - offset + 1,
            date = new Date(Date.UTC(year, month - 1, n)),
            day = date.toISOString().slice(0, 10),
            kind = shiftMap.get(day),
            dayEventCount = eventCounts.get(day) || 0,
            hasTask = taskDays.has(day);
          if (i % 7 === 0) cells += '<div class="os-calendar-week">';
          cells += `<button class="os-day ${date.getUTCMonth() !== month - 1 ? "other" : ""} ${day === life.data.today ? "today" : ""} ${day === life.selected ? "selected" : ""}" data-life-day="${day}" data-kind="${kind || ""}" aria-label="${osDate(day)}${kind ? " · " + osShift[kind] : ""}${dayEventCount ? " · " + dayEventCount + " eventi" : ""}${hasTask ? " · attività" : ""}" title="${day}${kind ? " · " + osShift[kind] : ""}"><b>${date.getUTCDate()}</b><span class="os-shift ${kind ? "" : "no-shift"}">${kind ? `<i class="sh-i">${osShiftInitial[kind]}</i><i class="sh-t">${osShiftAbbr[kind] || ""}</i>` : ""}</span><span class="os-day-mark" aria-hidden="true">${"<i></i>".repeat(Math.min(dayEventCount, 3))}${hasTask ? '<i class="t"></i>' : ""}</span></button>`;
          if (i % 7 === 6) cells += "</div>";
        }
        document.body.style.setProperty(
          "--calendar-rows",
          Math.ceil((offset + days) / 7),
        );
        return `<div class="os-card"><div class="os-month-header"><button data-life-month="-1" aria-label="Mese precedente">‹</button><h2>${first.toLocaleDateString("it-IT", { month: "long", year: "numeric", timeZone: "UTC" })}</h2><button data-life-month="1" aria-label="Mese successivo">›</button></div><div class="os-weekdays">${["Lun", "Mar", "Mer", "Gio", "Ven", "Sab", "Dom"].map((x) => `<span>${x}</span>`).join("")}</div><div class="os-days">${cells}</div>${life.selected ? `<div class="os-calendar-details">` : ""}${life.selected ? `<h3>${osDate(life.selected)}${shift ? `<span class="os-day-shift" data-kind="${shift}">${osShiftAbbr[shift] || ""}</span>` : ""}</h3>${events.length ? events.map((e) => `<div class="os-mini"><div><strong>${osSafe(e.title)}</strong><small>${e.start_time || "Tutto il giorno"}${e.end_time ? "–" + e.end_time : ""}${e.location ? " · " + osSafe(e.location) : ""}${e.occurrence_status === "done" ? " · Fatto" : ""}</small></div><button class="os-row-action" ${e.day < life.data.today ? `data-life-event="${e.id}"` : `data-life-occurrence="${e.id}:${e.day}:${e.occurrence_status === "done" ? "open" : "done"}"`}>${e.day < life.data.today ? "Riprogramma" : e.occurrence_status === "done" ? "Riapri" : "Fatto"}</button><details class="os-event-options"><summary aria-label="Opzioni evento">Opzioni</summary><button class="os-row-action" data-life-occurrence="${e.id}:${e.day}:skipped" aria-label="Elimina questa occorrenza">Elimina questa</button>${e.frequency && e.frequency !== "none" ? `<button class="os-row-action" data-life-split-event="${e.id}:${e.day}">Modifica da qui</button>` : ""}<button class="os-row-action" data-life-event="${e.id}" aria-label="Modifica serie">Modifica</button></details></div>`).join("") : '<p class="os-empty">Nessun evento.</p>'}${tasks.length ? '<div class="os-section-label">Attività</div>' + tasks.map((t) => `<div class="os-mini"><strong>${osSafe(t.title)}</strong><button class="os-row-action" data-life-task="${t.id}" aria-label="Modifica attività">···</button></div>`).join("") : ""}` : ""}${life.selected ? "</div>" : ""}${osEventForm()}</div><details class="os-palette-wrap os-tools-drawer" ${life.paletteOpen || life.tool ? "open" : ""}><summary>Dipingi turni${life.tool ? " · " + osSafe(osShiftAbbr[life.tool] || life.tool) : ""}</summary><div class="os-palette-state" role="status">${life.tool ? `Pennello attivo: <strong>${osSafe(osShiftAbbr[life.tool] || (life.tool === "event" ? "Evento" : "Cancella"))}</strong>` : "Scegli un turno, poi tocca i giorni."}</div><div class="os-palette" aria-label="Pennello calendario">${Object.entries(
          osShift,
        )
          .map(
            ([key, val]) =>
              `<button data-life-tool="${key}" title="${val}" aria-label="${val}" class="${life.tool === key ? "active" : ""}" aria-pressed="${life.tool === key}">${osSafe(osShiftAbbr[key] || val)}</button>`,
          )
          .join(
            "",
          )}<button data-life-tool="event" class="${life.tool === "event" ? "active" : ""}" aria-pressed="${life.tool === "event"}">+ Evento</button><button data-life-tool="erase" class="${life.tool === "erase" ? "active" : ""}" aria-pressed="${life.tool === "erase"}">Cancella</button>${life.tool ? '<button class="os-palette-stop" data-life-tool="none" aria-label="Disattiva pennello">Fine</button>' : ""}${life.undo ? '<button data-life-undo aria-label="Annulla ultimo turno">↶</button>' : ""}</div></details>`;
      }

      /** Accetta solo l’ultima lettura del mese corrente; scarta risposte tardive. */
      async function osRefresh() {
        const revision = ++life.readRevision,
          month = life.month;
        const fresh = await osRequest("getLifeData", month);
        if (revision !== life.readRevision || month !== life.month) return;
        life.data = fresh;
        renderLifeOS();
      }
      // Serialize brush writes. Roll back only this day if no newer paint supersedes it.

      /** Aggiornamento ottimistico del turno, scritture serializzate e recupero errore. */
      function osPaint(day, kind) {
        const previous =
          life.data.shifts.find((s) => s.day === day)?.kind || null;
        const revision = ++life.paintRevision;
        ++life.readRevision;
        life.data.shifts = life.data.shifts.filter((s) => s.day !== day);
        if (kind !== "erase") life.data.shifts.push({ day, kind });
        renderLifeOS();
        life.paintQueue = life.paintQueue
          .then(() => osRequest("paintShift", { day, kind }))
          .catch((err) => {
            if (revision === life.paintRevision) {
              life.data.shifts = life.data.shifts.filter((s) => s.day !== day);
              if (previous) life.data.shifts.push({ day, kind: previous });
              renderLifeOS();
            }
            osError(err);
          });
        return life.paintQueue;
      }
      // A successful write followed by a failed refresh is still a successful write.
      // Do not restore stale data or invite a second submission in that case.

      /** Mutex scritture Life OS; distingue errore di scrittura da errore di aggiornamento. */
      async function osWrite(method, arg, optimistic) {
        if (life.busy) return;
        life.busy = true;
        ++life.readRevision;
        const previous = life.data ? structuredClone(life.data) : null;
        try {
          if (optimistic) {
            optimistic();
            renderLifeOS();
          }
          const result = await osRequest(method, arg);
          try {
            await osRefresh();
          } catch (error) {
            osError(
              Error("Salvato. Aggiornamento non riuscito: " + error.message),
            );
          }
          return result;
        } catch (error) {
          life.data = previous;
          renderLifeOS();
          osError(error);
        } finally {
          life.busy = false;
        }
      }

      /** Only direct draggable rows belong to the todo ordering contract. */
      function osTodoOrderIds(parent) {
        return [...parent.children]
          .filter(row => row.matches("[data-life-drag-row]") && row.querySelector("[data-life-drag-handle]"))
          .map(row => Number(row.dataset.lifeDragRow));
      }

      /** Salva l’ordine completo delle attività aperte della categoria. */
      async function osCommitOrder(category, ids) {
        if (life.busy) return;
        const visible = new Set(ids); const hidden = life.data.tasks.filter(t => t.list_kind === category && t.status === "todo" && !visible.has(t.id)).sort((a,b) => (a.sort_order||0)-(b.sort_order||0) || a.id-b.id).map(t=>t.id); await osWrite("reorderTasks", { category, ids: [...ids,...hidden] });
      }
      let osDrag = null;
      document.addEventListener("pointerdown", (e) => {
        const handle = e.target.closest("[data-life-drag-handle]");
        if (!handle || (e.pointerType === "mouse" && e.button !== 0) || life.busy) return;
        const row = handle.closest("[data-life-drag-row]");
        osDrag = {
          handle,
          row,
          category: life.category,
          startY: e.clientY,
          active: false,
        };
        handle.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      document.addEventListener("pointermove", (e) => {
        if (!osDrag) return;
        const d = osDrag;
        if (Math.abs(e.clientY - d.startY) > 5) d.active = true;
        if (!d.active) return;
        d.row.classList.add("is-dragging");
        const at = document
          .elementFromPoint(e.clientX, e.clientY)
          ?.closest("[data-life-drag-row]");
        if (
          at &&
          at !== d.row &&
          at.parentElement === d.row.parentElement &&
          at.querySelector("[data-life-drag-handle]")
        ) {
          const midpoint = at.getBoundingClientRect().top + at.offsetHeight / 2;
          at.parentElement.insertBefore(
            d.row,
            e.clientY < midpoint ? at : at.nextSibling,
          );
        }
        if (e.clientY > innerHeight - 75) scrollBy(0, 15);
        else if (e.clientY < 75) scrollBy(0, -15);
        e.preventDefault();
      });
      document.addEventListener("pointercancel", () => {
        if (osDrag) {
          osDrag.row.classList.remove("is-dragging");
          osDrag = null;
          renderLifeOS();
        }
      });
      document.addEventListener("pointerup", (e) => {
        if (!osDrag) return;
        const d = osDrag;
        osDrag = null;
        d.row.classList.remove("is-dragging");
        if (!d.active) return;
        const ids = osTodoOrderIds(d.row.parentElement);
        osCommitOrder(d.category, ids);
      });
      document.addEventListener("keydown", (e) => {
        const handle = e.target.closest("[data-life-drag-handle]");
        if (!handle || !e.altKey || !["ArrowUp", "ArrowDown"].includes(e.key))
          return;
        e.preventDefault();
        const row = handle.closest("[data-life-drag-row]"),
          peer =
            e.key === "ArrowUp"
              ? row.previousElementSibling
              : row.nextElementSibling;
        if (
          !peer?.matches("[data-life-drag-row]") ||
          !peer.querySelector("[data-life-drag-handle]")
        )
          return;
        const parent = row.parentElement;
        parent.insertBefore(row, e.key === "ArrowUp" ? peer : peer.nextSibling);
        const ids = osTodoOrderIds(parent);
        osCommitOrder(life.category, ids).then(() =>
          document
            .querySelector(
              '[data-life-drag-handle="' + row.dataset.lifeDragRow + '"]',
            )
            ?.focus(),
        );
      });

      /** Editor creazione/modifica attività, con valori HTML escapati. */
      function osOpenTask(id) {
        const t = life.data.tasks.find((t) => t.id === Number(id)),
          d = document.getElementById("life-dialog");
        d.innerHTML = `<div class="modal os-dialog" role="dialog" aria-modal="true"><div class="os-topline"><h2>${t ? "Modifica attività" : "Nuova attività"}</h2><button class="os-icon-button" data-life-close aria-label="Chiudi">×</button></div><form id="life-form" data-kind="task" class="os-form"><input type="hidden" name="record_id" value="${t?.id || ""}"><label class="wide">Titolo *<input name="title" maxlength="160" required value="${osSafe(t?.title || "")}"></label><label>Categoria *<select name="list_kind" required>${life.data.categories.map((c) => `<option value="${osSafe(c.key)}" ${t?.list_kind === c.key || (!t && c.key === life.category) ? "selected" : ""}>${osSafe(c.label)}</option>`).join("")}</select></label><label>In calendario<input type="date" name="scheduled_date" value="${osSafe(t?.scheduled_date || "")}"></label><label>Scadenza<input type="date" name="due_date" value="${osSafe(t?.due_date || "")}"></label><label class="wide">Note<textarea name="notes" maxlength="1000">${osSafe(t?.notes || "")}</textarea></label><div class="os-form-actions">${t && t.status !== "done" ? `<button class="os-button" type="button" data-life-status="${t.id}:${t.status === "waiting" ? "todo" : "waiting"}">${t.status === "waiting" ? "Riporta in Da fare" : "Metti in attesa"}</button>` : ""}${t ? `<button class="os-button danger" type="button" data-life-delete-task="${t.id}">Elimina</button>` : ""}<button class="os-button primary" type="submit">Salva</button></div></form></div>`;
        d.classList.remove("hidden");
        if (!matchMedia("(pointer:coarse)").matches)
          d.querySelector("[name=title]").focus();
      }

      /** Controlli Su/Giù per l’ordine delle categorie; estremi disabilitati. */
      function osCategoryOrder() {
        return `<section class="category-order"><h3>Ordine categorie</h3>${life.data.categories.map((c, i) => `<div><span>${osSafe(c.label)}</span><button type="button" data-life-rename-category="${osSafe(c.key)}">Modifica</button><button type="button" data-category-order="${i}:-1" ${i === 0 ? "disabled" : ""} aria-label="Sposta ${osSafe(c.label)} prima">Su</button><button type="button" data-category-order="${i}:1" ${i === life.data.categories.length - 1 ? "disabled" : ""} aria-label="Sposta ${osSafe(c.label)} dopo">Giù</button></div>`).join("")}</section>`;
      }

      /** Editor nome categoria e ordine; chiavi stabili indipendenti dall’etichetta. */
      function osOpenCategory(key) {
        const current = key
          ? life.data.categories.find((c) => c.key === key)
          : null;
        const d = document.getElementById("life-dialog");
        d.innerHTML = `<div class="modal os-dialog" role="dialog" aria-modal="true"><div class="os-topline"><h2>${current ? "Rinomina categoria" : "Nuova categoria"}</h2><button class="os-icon-button" data-life-close aria-label="Chiudi">×</button></div><form id="life-form" data-kind="category" class="os-form"><input type="hidden" name="key" value="${osSafe(current?.key || "")}"><label class="wide">Nome *<input name="label" maxlength="40" required value="${osSafe(current?.label || "")}"></label><div class="os-form-actions"><button class="os-button primary" type="submit">${current ? "Salva nome" : "Aggiungi categoria"}</button></div></form>${current && life.data.categories.length>1 ? `<div class="os-form"><label>Trasferisci attività a<select name="categoryDestination">${life.data.categories.filter(c=>c.key!==current.key).map(c=>`<option value="${osSafe(c.key)}">${osSafe(c.label)}</option>`).join("")}</select></label><button type="button" class="os-button danger" data-life-delete-category="${osSafe(current.key)}">Elimina categoria</button></div>` : ""}${osCategoryOrder()}</div>`;
        d.classList.remove("hidden");
        if (!matchMedia("(pointer:coarse)").matches)
          d.querySelector("[name=label]").focus();
      }

      /** Seleziona l’evento o l’occorrenza e apre il relativo editor nel calendario. */
      function osOpenEvent(id, splitFrom = null) {
        life.editingSplitFrom = splitFrom;
        life.editingEvent = id === "new" ? null : Number(id);
        life.creatingEvent = id === "new";
        if (life.editingEvent) {
          const ev =
            life.data.events.find((e) => e.id === life.editingEvent) ||
            life.data.upcomingEvents?.find((e) => e.id === life.editingEvent) || life.data.activityEvents?.find((e) => e.id === life.editingEvent);
          if (ev) {
            life.month = (splitFrom || ev.day).slice(0, 7);
            life.selected = splitFrom || ev.day;
          }
        }
        life.tool = "event";
        setView("calendar");
        document
          .getElementById("os-event-editor")
          ?.scrollIntoView({ behavior: "smooth", block: "center" });
        document.querySelector("#os-event-editor [name=title]")?.focus();
      }

      /** Chiude il foglio Life OS e termina la modifica evento. */
      function osClose() {
        document.getElementById("life-dialog").classList.add("hidden");
        life.creatingEvent = false;
        life.editingEvent = null;
        life.editingSplitFrom = null;
        if (life.tool === "event") life.tool = null;
        renderLifeOS();
      }
      document.addEventListener("click", (e) => {
        const el = e.target.closest(
          "[data-life-reorder],[data-life-nav],[data-life-task],[data-life-event],[data-life-split-event],[data-life-category],[data-life-rename-category],[data-life-delete-category],[data-life-delete-completed],[data-life-select-category],[data-life-close],[data-life-save],[data-life-status],[data-life-complete],[data-life-delete-task],[data-life-delete-event],[data-life-occurrence],[data-life-month],[data-life-day],[data-life-tool],[data-life-undo],[data-life-routine],[data-life-routine-manage],[data-life-routine-edit],[data-life-routine-delete]",
        );
        if (!el) return;
        if (el.hasAttribute("data-life-routine")) {
          const id = Number(el.dataset.lifeRoutine),
            habit = life.data.routines.find((h) => h.id === id);
          if (!habit) return;
          const checked = !habit.checked,
            day = life.data.today;
          habit.checked = checked ? 1 : 0;
          life.routinePending++;
          life.routineRevision++;
          document.getElementById("today").innerHTML = osToday();
          life.routineQueue = life.routineQueue
            .then(() => osRequest("setRoutineCheck", { id, checked, day }))
            .catch(osError)
            .finally(async () => {
              life.routinePending--;
              if (!life.routinePending) {
                const revision = life.routineRevision;
                const fresh = await osRequest("getLifeData", life.month);
                if (revision === life.routineRevision) {
                  life.data = fresh;
                  renderLifeOS();
                }
              }
            })
            .catch(osError);
          return;
        }
        if (el.hasAttribute("data-life-routine-manage"))
          return osManageRoutines();
        if (el.hasAttribute("data-life-routine-edit")) {
          const h = life.data.routines.find(
            (x) => x.id === Number(el.dataset.lifeRoutineEdit),
          );
          if (!h) return;
          lifeOSHabits.edit(h);
          return;
        }
        if (el.hasAttribute("data-life-routine-delete")) {
          if (!confirm("Eliminare questa voce e le sue spunte?")) return;
          return osWrite(
            "deleteRoutine",
            Number(el.dataset.lifeRoutineDelete),
          ).then((saved) => {
            if (saved) osManageRoutines();
          });
        }
        if (el.hasAttribute("data-life-reorder")) {
          life.reorder = !life.reorder;
          renderLifeOS();
          return;
        }
        if (el.hasAttribute("data-life-nav"))
          return setView(el.dataset.lifeNav);
        if (el.hasAttribute("data-life-task"))
          return osOpenTask(el.dataset.lifeTask);
        if (el.hasAttribute("data-life-split-event")) {
          const [id, day] = el.dataset.lifeSplitEvent.split(":");
          return osOpenEvent(id, day);
        }
        if (el.hasAttribute("data-life-event"))
          return osOpenEvent(el.dataset.lifeEvent);
        if (el.hasAttribute("data-life-delete-category")) {
          const key=el.dataset.lifeDeleteCategory, destination=document.querySelector("[name=categoryDestination]")?.value;
          osWrite("deleteCategory",{key,destination}).then(()=>osClose());return;
        }
        if (el.hasAttribute("data-life-category")) return osOpenCategory();
        if (el.hasAttribute("data-life-rename-category"))
          return osOpenCategory(el.dataset.lifeRenameCategory);
        if (el.hasAttribute("data-life-delete-completed")) {
          if (confirm("Eliminare tutte le completate di questa categoria?"))
            return osWrite("deleteCompletedTasks", {
              category: el.dataset.lifeDeleteCompleted,
            });
          return;
        }
        if (el.hasAttribute("data-life-select-category")) {
          const top = window.scrollY,
            left = document.querySelector(".os-category-tabs").scrollLeft;
          life.category = el.dataset.lifeSelectCategory;
          renderLifeOS();
          document.querySelector(".os-category-tabs").scrollLeft = left;
          window.scrollTo({ top, behavior: "instant" });
          return;
        }
        if (el.hasAttribute("data-life-close")) return osClose();
        if (el.hasAttribute("data-life-save")) {
          if (!e.defaultPrevented) {
            e.preventDefault();
            osSubmit(el.closest("form"));
          }
          return;
        }
        if (el.hasAttribute("data-life-status")) {
          const [id, status] = el.dataset.lifeStatus.split(":");
          if (el.closest(".os-dialog")) osClose();
          return osWrite("setTaskStatus", { id: Number(id), status }, () => {
            const t = life.data.tasks.find((t) => t.id === Number(id));
            t.status = status;
            t.completed_at =
              status === "done" ? new Date().toISOString() : null;
          });
        }
        if (el.hasAttribute("data-life-complete"))
          return osWrite(
            "setTaskStatus",
            { id: Number(el.dataset.lifeComplete), status: "done" },
            () => {
              life.data.tasks.find(
                (t) => t.id === Number(el.dataset.lifeComplete),
              ).status = "done";
            },
          );
        if (el.hasAttribute("data-life-delete-task")) {
          if (confirm("Eliminare questa attività?")) {
            osClose();
            return osWrite("deleteTask", Number(el.dataset.lifeDeleteTask));
          }
          return;
        }
        if (el.hasAttribute("data-life-occurrence")) {
          const [id, day, status] = el.dataset.lifeOccurrence.split(":");
          if (
            status === "skipped" &&
            !confirm("Eliminare solo questa occorrenza?")
          )
            return;
          return osWrite("setEventOccurrence", { id: Number(id), day, status });
        }
        if (el.hasAttribute("data-life-delete-event")) {
          if (confirm("Eliminare questo evento e tutte le sue ricorrenze?")) {
            osClose();
            return osWrite("deleteEvent", Number(el.dataset.lifeDeleteEvent));
          }
          return;
        }
        if (el.hasAttribute("data-life-tool")) {
          life.tool =
            el.dataset.lifeTool === "none" || life.tool === el.dataset.lifeTool
              ? null
              : el.dataset.lifeTool;
          if (life.tool !== "event") {
            life.creatingEvent = false;
            life.editingEvent = null;
          }
          return renderLifeOS();
        }
        if (el.hasAttribute("data-life-month")) {
          const [y, m] = life.month.split("-").map(Number);
          life.month = new Date(
            Date.UTC(y, m - 1 + Number(el.dataset.lifeMonth), 1),
          )
            .toISOString()
            .slice(0, 7);
          life.selected = null;
          life.creatingEvent = false;
          life.editingEvent = null;
          return loadLifeOS();
        }
        if (el.hasAttribute("data-life-day")) {
          const day = el.dataset.lifeDay,
            old = life.data.shifts.find((s) => s.day === day)?.kind || null;
          life.selected = day;
          if (!life.tool) {
            renderLifeOS();
            return;
          }
          if (life.tool === "event") {
            life.creatingEvent = true;
            life.editingEvent = null;
            renderLifeOS();
            document
              .getElementById("os-event-editor")
              ?.scrollIntoView({ behavior: "smooth", block: "center" });
            return;
          }
          life.undo = { day, kind: old };
          return osPaint(day, life.tool);
        }
        if (el.hasAttribute("data-life-undo") && life.undo) {
          const { day, kind } = life.undo;
          life.undo = null;
          return osPaint(day, kind || "erase");
        }
      });

      /** Valida il form e invia una sola scrittura; evita il reinvio di eventi già salvati. */
      async function osSubmit(form) {
        if (!form || form.getAttribute("id") !== "life-form") return;
        const formMessage = form.querySelector(".os-form-error");
        if (!form.reportValidity()) {
          if (formMessage) {
            formMessage.textContent = "Completa i campi indicati con *.";
            formMessage.classList.remove("hidden");
          }
          return;
        }
        const values = Object.fromEntries(new FormData(form).entries()),
          kind = form.dataset.kind;
        if (values.record_id) values.id = Number(values.record_id);
        delete values.record_id;
        if (kind === "category") {
          const saved = await osWrite(
            values.key ? "renameCategory" : "addCategory",
            { key: values.key, label: values.label },
          );
          if (saved) {
            life.category = values.key || saved.key;
            osClose();
            renderLifeOS();
          }
          return;
        }
        if (kind === "event") {
          if (form.dataset.saving === "true") return;
          form.dataset.saving = "true";
          const button = form.querySelector("[data-life-save]"),
            message = form.querySelector(".os-form-error");
          let savedOnServer = form.dataset.saved === "true";
          try {
            if (values.end_time && !values.start_time)
              throw Error("Indica anche l’ora di inizio.");
            button.disabled = true;
            button.textContent = "Salvataggio…";
            message.textContent = "Salvataggio in corso…";
            message.classList.add("is-pending");
            message.classList.remove("hidden");
            if (!savedOnServer) {
              await osRequest(
                values.split_from ? "splitEventSeries" : "saveEvent",
                values,
              );
              savedOnServer = true;
              form.dataset.saved = "true";
            }
            const eventMonth = values.day.slice(0, 7);
            const fresh = await osRequest("getLifeData", eventMonth);
            life.month = eventMonth;
            life.selected = values.day;
            life.data = fresh;
            life.creatingEvent = false;
            life.editingEvent = null;
            life.tool = null;
            renderLifeOS();
            document

      // A monotone cubic spline keeps the curves smooth without inventing peaks.

      /** Genera una curva SVG dai punti senza dipendenze esterne. */
      function chartCurve(points) {
        if (!points.length) return "";
        const chunks = [];
        let current = [];
        const flush = () => {
          if (!current.length) return;
          if (current.length === 1) {
            chunks.push("M" + current[0].x + " " + current[0].y);
            current = [];
            return;
          }
          const slope = current
            .slice(1)
            .map((p, i) => (p.y - current[i].y) / (p.x - current[i].x));
          const tangent = current.map((_, i) => {
            if (i === 0) return slope[0];
            if (i === current.length - 1) return slope[slope.length - 1];
            return slope[i - 1] * slope[i] <= 0
              ? 0
              : (2 * slope[i - 1] * slope[i]) / (slope[i - 1] + slope[i]);
          });
          let path = "M" + current[0].x + " " + current[0].y;
          for (let i = 0; i < current.length - 1; i++) {
            const a = current[i],
              b = current[i + 1],
              dx = (b.x - a.x) / 3,
              lo = Math.min(a.y, b.y),
              hi = Math.max(a.y, b.y);
            const c1 = Math.max(lo, Math.min(hi, a.y + tangent[i] * dx));
            const c2 = Math.max(lo, Math.min(hi, b.y - tangent[i + 1] * dx));
            path +=
              " C" +
              (a.x + dx).toFixed(1) +
              " " +
              c1.toFixed(1) +
              " " +
              (b.x - dx).toFixed(1) +
              " " +
              c2.toFixed(1) +
              " " +
              b.x +
              " " +
              b.y;
          }
          chunks.push(path);
          current = [];
        };
        for (const point of points) {
          if (point) current.push(point);
          else flush();
        }
        flush();
        return chunks.join(" ");
      }

      /** Grafici entrate/uscite e liquidità; nasconde dati privati quando richiesto. */
      function cashFlowChart(d) {
        const compact = window.matchMedia("(max-width:760px)").matches,
          limit = state.chartMonths ?? (compact ? 6 : 12),
          series = limit ? d.lifetime.series.slice(-limit) : d.lifetime.series;
        const W = compact ? 420 : 820,
          H = compact ? 250 : 260,
          L = 46,
          R = W - 16,
          T = 22,
          B = H - 40;
        const x = (i) => L + ((i + 0.5) * (R - L)) / series.length,
          slot = (R - L) / series.length,
          bw = Math.min(12, slot * 0.32);
        const max =
            Math.max(100, ...series.flatMap((m) => [m.income, m.spent])) * 1.1,
          y = (v) => B - (v / max) * (B - T);
        const grid = Array.from({ length: 4 }, (_, i) => (max * i) / 3)
          .map(
            (v) =>
              '<line x1="' +
              L +
              '" x2="' +
              R +
              '" y1="' +
              y(v) +
              '" y2="' +
              y(v) +
              '" class="grid-line"/><text x="' +
              (L - 8) +
              '" y="' +
              (y(v) + 4) +
              '" text-anchor="end">' +
              Math.round(v / 100) / 10 +
              "k</text>",
          )
          .join("");
        const labels = series
          .map((m, i) =>
            i % Math.max(1, Math.ceil(series.length / (compact ? 4 : 8))) &&
            i !== series.length - 1
              ? ""
              : '<text x="' +
                x(i) +
                '" y="' +
                (H - 12) +
                '" text-anchor="middle">' +
                shortMonth(m.month) +
                "</text>",
          )
          .join("");
        const bars = series
          .map((m, i) =>
            ["income", "spent"]
              .map(
                (k, j) =>
                  '<rect data-chart-month="' +
                  m.month +
                  '" data-month="' +
                  m.month +
                  '" data-series="' +
                  k +
                  '" x="' +
                  (x(i) + (j ? 1 : -bw - 1)) +
                  '" y="' +
                  y(m[k]) +
                  '" width="' +
                  bw +
                  '" height="' +
                  Math.max(0, B - y(m[k])) +
                  '" rx="2" fill="' +
                  (j ? "#ff9da4" : "var(--os-accent)") +
                  '"><title>' +
                  shortMonth(m.month) +
                  " · " +
                  (j ? "Uscite " : "Entrate ") +
                  euro(m[k]) +
                  "</title></rect>",
              )
              .join(""),
          )
          .join("");
        const visible = state.assetsVisible,
          totalMode = false;
        const valueOf = (m) => (totalMode ? m.liquidWealth : m.wealth);
        const known = series.filter((m) => Number.isFinite(valueOf(m)));
        const wm = Math.max(100, ...known.map(valueOf)),
          wl = Math.min(0, ...known.map(valueOf));
        const wy = (v) => B - ((v - wl) / (wm - wl || 1)) * (B - T);
        const path = chartCurve(
          series.map((m, i) =>
            Number.isFinite(valueOf(m)) ? { x: x(i), y: wy(valueOf(m)) } : null,
          ),
        );
        const dots = known
          .map(
            (m) =>
              `<circle cx="${x(series.indexOf(m))}" cy="${wy(valueOf(m))}" r="4" class="wealth-dot"><title>${shortMonth(m.month)} · ${euro(valueOf(m))}</title></circle>`,
          )
          .join("");
        const wg = Array.from({ length: 4 }, (_, i) => wl + ((wm - wl) * i) / 3)
          .map(
            (v) =>
              `<line x1="${L}" x2="${R}" y1="${wy(v)}" y2="${wy(v)}" class="grid-line"/><text x="${L - 8}" y="${wy(v) + 4}" text-anchor="end">${Math.round(v / 100) / 10}k</text>`,
          )
          .join("");
        const liquid = visible
          ? known.length
            ? `<div class="chart-scroll"><svg class="trend-svg is-compact wealth-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Patrimonio">${wg}<path class="wealth-record-line" d="${path}"/>${dots}${labels}</svg></div><p class="hint">Dati verificati da ${shortMonth(known[0].month)}.</p>`
            : '<p class="empty">Nessun saldo verificato nel periodo.</p>'
          : '<button type="button" class="ghost" data-toggle-assets>Mostra patrimonio</button>';
        const wealthControls = "";
        const selected =
          series.find((m) => m.month === state.chartSelectedMonth) ||
          series.at(-1);
        const selectedValues = selected
          ? '<div class="trend-values"><b>' +
            shortMonth(selected.month) +
            "</b><span>Entrate <strong>" +
            euro(selected.income) +
            "</strong></span><span>Uscite <strong>" +
            euro(selected.spent) +
            "</strong></span></div>"
          : "";
        const controls =
          '<div class="chart-range" role="group" aria-label="Periodo del grafico">' +
          [
            [3, "3 mesi"],
            [6, "6 mesi"],
            [12, "12 mesi"],
            [0, "Tutto"],
          ]
            .map(
              ([n, label]) =>
                '<button type="button" data-chart-range="' +
                n +
                '" aria-pressed="' +
                (limit === n) +
                '">' +
                label +
                "</button>",
            )
            .join("") +
          "</div>";
        const table = series
          .map(
            (m) =>
              '<tr><th scope="row">' +
              shortMonth(m.month) +
              "</th><td>" +
              euro(m.income) +
              "</td><td>" +
              euro(m.spent) +
              "</td><td>" +
              (Number.isFinite(valueOf(m)) ? privateAmount(valueOf(m)) : "—") +
              "</td></tr>",
          )
          .join("");
        return (
          '<div class="integrated-chart chart-pair"><section class="card pad flow-card"><div class="card-title"><h2>Entrate e uscite</h2></div>' +
          controls +
          '<div class="flow-legend"><span class="income-key">Entrate</span><span class="spent-key">Uscite</span></div><div class="chart-scroll"><svg class="trend-svg is-compact" viewBox="0 0 ' +
          W +
          " " +
          H +
          '" role="img" aria-label="Entrate e uscite mensili">' +
          grid +
          bars +
          labels +
          "</svg></div>" +
          selectedValues +
          '</section><section class="card pad wealth-chart-card"><div class="card-title liquid-chart-heading"><div><h2>Patrimonio</h2><small>' +
          "Patrimonio" +
          " · " +
          privateAmount(totalMode ? d.summary.totalAssets : d.summary.assets) +
          "</small></div>" +
          privacyButton() +
          "</div>" +
          wealthControls +
          liquid +
          '<details class="chart-values"><summary>Valori mensili</summary><div class="chart-scroll"><table><thead><tr><th>Mese</th><th>Entrate</th><th>Uscite</th><th>Patrimonio</th></tr></thead><tbody>' +
          table +
          "</tbody></table></div></details></section></div>"
        );
      }

      document.addEventListener("click", (e) => {
        const range = e.target.closest("[data-chart-range]"),
          month = e.target.closest("[data-chart-month]"),
          wealth = e.target.closest("[data-wealth-series]");
        if (!range && !month && !wealth) return;
        if (wealth) state.wealthSeries = wealth.dataset.wealthSeries;

        if (chart && state.data) chart.outerHTML = cashFlowChart(state.data);
      });

      /** Ripartizione spese storiche con dettaglio; le stime non alterano il saldo. */
      function sankeyCard(d) {
        const compact =
          typeof window !== "undefined" &&
          window.matchMedia("(max-width:760px)").matches;
        const income = Math.max(0, d.lifetime.income),
          out = Math.max(0, d.lifetime.spent),
          total = out;
        if (!total)
          return (
            '<div class="card pad"><h2>Cash flow · ' +
            d.year +
            '</h2><p class="empty">Nessun movimento disponibile.</p></div>'
          );
        const spent = Object.fromEntries(
          d.lifetime.expenseGroups.map((x) => [x.name, x.amount]),
        );
        const cats = Object.entries(spent)
            .filter((r) => r[1] > 0)

        return (

      /** Aggiorna i soli campi della proiezione, senza ricreare il form. */
      function renderProjection(p) {
        const set = (id, v) => {
          const el = document.getElementById(id);
          if (el) el.textContent = v;
        };
        if (!state.assetsVisible) {
          set("surplus-now", "•••• €");
          set("projected-total", "•••• €");

          document
            .querySelector(".fund-meter")
            .removeAttribute("aria-valuenow");

          document.getElementById("fund-surplus").style.width = "0%";

        }
        set("surplus-now", p.surplusNow === null ? "—" : euro(p.surplusNow));
        set("projected-total", euro(p.projection));
        set(

            ? "Imposta il fondo"

        );
        set(
          "fund-label",
          p.goal === null
            ? "Fondo da impostare"
            : p.missing > 0
              ? "Coperto " + euro(p.now) + " su " + euro(p.goal)
              : "Fondo " + euro(p.goal),
        );
        set(
          "surplus-label",
          p.goal === null
            ? ""
            : p.missing > 0
              ? "Mancano " + euro(p.missing)
              : "Avanzano " + euro(p.surplusNow),
        );
        document
          .querySelector(".fund-meter")
          .setAttribute("aria-valuenow", Math.min(100, Math.round(p.covered)));
        document.getElementById("fund-covered").style.width = p.covered + "%";
        document.getElementById("fund-surplus").style.width = p.surplus + "%";
      }

      /** Local preview uses the reconciled TR balance already loaded in Finance.
       * Input does not trigger database reads. Draft survives chart/theme redraws. */
      function projectPlanning(p, goal, saving) {
        const total =
          Math.round((p.now + saving * p.monthsRemaining) * 100) / 100;
        const base = Math.max(1, goal || 0, p.now);
        return {
          ...p,
          goal,
          monthlySaving: saving,
          projection: total,
          surplusNow:
            goal === null
              ? null
              : Math.max(0, Math.round((p.now - goal) * 100) / 100),
          projectedSurplus:
            goal === null
              ? null
              : Math.max(0, Math.round((total - goal) * 100) / 100),
          missing:
            goal === null
              ? null
              : Math.max(0, Math.round((goal - p.now) * 100) / 100),
          covered:
            goal === null
              ? 0
              : (Math.max(0, Math.min(goal, p.now)) / base) * 100,
          surplus: goal === null ? 0 : (Math.max(0, p.now - goal) / base) * 100,
        };
      }
      function updateProjection() {
        const p = state.data?.planning,
          goal = document.getElementById("goal-input"),
          saving = document.getElementById("saving-input");
        if (!p || !goal || !saving) return;
        state.planningDraft = { goal: goal.value, saving: saving.value, target: document.getElementById("target-input")?.value ?? "" };
        const valid = goal.validity.valid && saving.validity.valid;
        document.getElementById("save-plan").disabled = !valid || state.busy;
        const status = document.getElementById("planning-status");
        status.textContent = valid ? "" : "Importo non valido.";
        if (!valid) {
          document.getElementById("projected-total").textContent = "—";
          return;
        }
        renderProjection(
          projectPlanning(
            p,
            goal.value === "" ? null : Number(goal.value),
            Number(saving.value),
          ),
        );
      }

      /** Anello SVG proporzionale agli importi, indipendente dai CSS del vecchio donut. */
      function categoryCard(d) {
        const key = d.year + '-' + String(state.categoryMonth).padStart(2, '0');
        const data = d.monthlyBreakdowns?.[key] || {};
        const top = (Array.isArray(data.items) ? data.items : []).map(x => ({...x, amount:Number(x.amount)})).filter(x => Number.isFinite(x.amount) && x.amount > 0);
        const total = top.reduce((sum,x) => sum + x.amount,0);
        const colors = ['var(--os-accent)','#6e9cc1','#c79a58','#a788b8','#b9777b','#8b929b'];
        let offset = 0;

        return `<div class="card pad tr-category-card"><div class="card-title"><h2>Uscite</h2><div class="actions"><button class="small-arrow" data-cat="-1" aria-label="Mese precedente">‹</button><span class="category-month">${shortMonth(key)}</span><button class="small-arrow" data-cat="1" aria-label="Mese successivo">›</button></div></div>${total > 0 ? `<div class="breakdown"><div class="category-ring"><svg viewBox="0 0 120 120" role="img" aria-label="Uscite: ${euro(total)}"><circle cx="60" cy="60" r="48" fill="none" stroke="var(--line)" stroke-width="12"/>${segments}</svg><div class="category-ring-label"><small>Uscite</small><strong>${euro(total)}</strong></div></div><div class="category-legend">${top.map((x,i) => `<div class="bar-row"><span><i class="category-swatch" style="background:${colors[i % colors.length]}"></i>${escapeHtml(x.name)}</span><b>${euro(x.amount)}</b><div class="bar"><i style="width:${x.amount/max*100}%;background:${colors[i % colors.length]}"></i></div></div>`).join('')}</div></div>` : '<div class="empty">Nessuna uscita registrata.</div>'}<div class="details-label">Già impegnato · ${euro(Number(data.commitmentTotal)||0)}</div>${(Array.isArray(data.commitments)?data.commitments:[]).map(x => kv(x.name,x.amount)).join('')}</div>`;
      }
      const extraPriority = {
        Programmato: 0,
        Anticipato: 1,
        Previsto: 2,
        Annullato: 3,
        Pagato: 4,
      };

      /** Ordine stabile delle straordinarie per stato e periodo. */
      function orderedExtras(extras) {
        return [...extras].sort(
          (a, b) =>
            (extraPriority[a.status] ?? 3) - (extraPriority[b.status] ?? 3) ||

      /** Panoramica essenziale: saldo Trade Republic, impegnato, spendibile, patrimonio e flussi TR. */
      function overview(d) {
        const s = d.summary, daily = dailyBudgetRange(s);
        const recent = (d.transactions || []).slice(0, 3);
        return `<div class="finance-open">
        ${finHero(d, daily)}

        ${budgetSankey(d)}
        <section class="finance-recent"><div class="finance-heading"><h2>Ultimi movimenti</h2><button data-view="movements">Vedi tutti</button></div>${recent.length ? recent.map(t => `<button class="finance-movement" data-edit-movement="${Number(t.row)}"><span><strong>${escapeHtml(t.name)}</strong><small>${escapeHtml(t.date || '')} · ${escapeHtml(t.category || t.type || '')}</small></span><b class="${amountClass(t.amount)}">${state.assetsVisible ? exactEuro(t.amount) : '•••• €'}</b></button>`).join('') : '<p class="empty">Nessun movimento nel mese.</p>'}</section>${overviewCharts(d)}</div>`;
      }

      /** Nome categoria allineato all'elenco attuale (le vecchie categorie dello storico vengono ricondotte). */
      const CAT_RULES = [[/affitt/i, "Affitto"], [/condomin/i, "Condominio"], [/elettric|\bluce\b/i, "Elettricità"], [/\bgas\b/i, "Gas"], [/acqua/i, "Acqua"], [/abbonam|netflix|spotify|stream/i, "Abbonamenti"], [/utenz|bolletta|internet|telefon/i, "Utenze"], [/alimentar|supermerc|grocer|^spesa/i, "Alimentari"], [/ristor|\bbar\b|pizz|caff/i, "Ristorazione"], [/assicur/i, "Assicurazione"], [/manutenz|officina|gomme|tagliando/i, "Manutenzione auto"], [/benzin|carburant|diesel/i, "Benzina"], [/\bbollo/i, "Bollo"], [/pedagg|parcheggi|telepass|\bauto\b/i, "Auto"], [/dentist|ortodon|devitaliz/i, "Dentista"], [/farmac|visit|integrator|medic/i, "Farmaci e visite"], [/salute|sanit/i, "Salute"], [/palestra|fitness|sport/i, "Palestra"], [/svago|cinema|gioch|intratten/i, "Svago"], [/viagg|vacanz|hotel|volo|treno/i, "Viaggi"], [/shopping|abbigl|amazon|vestit/i, "Shopping"], [/arredament|casa/i, "Arredamento e casa"]];
      globalThis.lifeOSNormCategory = function (name) {
        const list = lifeOSContract.expenseCategories, raw = String(name || "").trim();
        const exact = list.find((c) => c.toLowerCase() === raw.toLowerCase());
        if (exact) return exact;
        const hit = CAT_RULES.find(([re]) => re.test(raw));
        return hit ? hit[1] : "Altro";
      };
      /** Spese che il Worker conta davvero in "Speso": esclude impegni fissi, accantonamenti, recuperi e quote coperte da un piano. */
      function spentBreakdown(d, spent) {
        const norm = globalThis.lifeOSNormCategory, fixedCats = new Set(financialCommittedCategories());
        for (const p of d.plansV2?.plans || []) if (p.category && (p.kind === "estimated" || p.kind === "fixed" && !(Number(p.intervalMonths) > 1))) fixedCats.add(p.category);
        const SAV = ["Assicurazione", "Bollo", "Manutenzione auto", "Dentista", "Straordinarie"];
        const pol = new Map((d.extraPlan?.budgetPolicies || []).map((p) => [Number(p.movement_source_row), p.treatment]));
        const linked = new Map();
        for (const l of d.extraPlan?.links || []) if (l.role === "payment") linked.set(Number(l.movement_source_row), (linked.get(Number(l.movement_source_row)) || 0) + Number(l.attributed_cents || 0) / 100);
        const by = new Map();
        for (const t of d.transactions || []) {
          if (t.type !== "Spesa" || !(t.amount < 0) || t.status && t.status !== "Eseguito") continue;
          const cat = t.category || "Altro", mode = pol.get(Number(t.row)) || "auto";
          if (["planned", "savings", "recovery"].includes(mode) || mode === "auto" && (fixedCats.has(cat) || SAV.includes(cat))) continue;
          const v = -t.amount - Math.min(-t.amount, linked.get(Number(t.row)) || 0);
          if (v <= 0.004) continue;
          const key = norm(t.displayCategory || cat);
          by.set(key, (by.get(key) || 0) + v);
        }
        let items = [...by].map(([name, value]) => ({ name, value })).sort((a, b) => b.value - a.value);
        const sum = items.reduce((n, x) => n + x.value, 0);
        if (sum > 0 && Math.abs(sum - spent) > 0.5) items = items.map((x) => ({ ...x, value: x.value * spent / sum }));
        else if (!sum && spent > 0.5) items = [{ name: "Altre spese", value: spent }];
        const top = items.slice(0, 5), rest = items.slice(5).reduce((n, x) => n + x.value, 0);
        return rest > 0.5 ? [...top, { name: "Altre", value: rest }] : top;
      }
      /** Parte alta di Finanza: due card simmetriche. */
      function finHero(d, daily) {
        const s = d.summary, hide = !state.assetsVisible, fmt = (v) => hide ? "•••• €" : exactEuro(v);
